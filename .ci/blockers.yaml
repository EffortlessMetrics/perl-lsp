# =============================================================================
# Blocker Ledger
# =============================================================================
#
# Machine-readable list of known active parser/LSP/CI blockers.
# Agents MUST check this file before starting discovery work to avoid
# re-investigating known issues.
#
# Schema Version: 1
# Last Verified: 2026-05-18  (counts from .ci/parser-corpus-baseline.json)
#
# Usage:
#   - Scouts: read this before /scout-dedup — if status: filed or partial, stop.
#   - Builders: pick entries with status: needs_investigation — they need issues.
#   - Archiving: when an issue closes, move entry to the archived section below.
#
# Counts source: .ci/parser-corpus-baseline.json first_error_buckets
# (system corpus only — CPAN corpus counts will differ).
#
# =============================================================================

schema_version: 1
last_verified: "2026-05-18"

budgets:
  max_active_blockers: 50  # advisory only — no gate enforcement today
  note: "Archive entries with status: fixed — do not delete, move to archived section"
  clean_rate_target: 0.90  # 90% CPAN/system corpus clean rate is the 0.12.x release criterion
  clean_rate_note: "System corpus 2026-05-18: 7047/7095 = 99.32% clean (first_error_buckets: {}). CPAN corpus 2026-04-09: 8931/9372 = 95.29% clean. Both meet the 90% release criterion."

