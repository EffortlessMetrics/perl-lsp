# =============================================================================
# Blocker Ledger
# =============================================================================
#
# Machine-readable list of known active parser/LSP/CI blockers.
# Agents MUST check this file before starting discovery work to avoid
# re-investigating known issues.
#
# Schema Version: 1
# Last Verified: 2026-03-21  (counts from .ci/parser-corpus-baseline.json)
#
# Usage:
#   - Scouts: read this before /scout-dedup — if status: filed or partial, stop.
#   - Builders: pick entries with status: needs_investigation — they need issues.
#   - Archiving: when an issue closes, move entry to the archived section below.
#
# Counts source: .ci/parser-corpus-baseline.json first_error_buckets
# (system corpus only — CPAN corpus counts will differ).
#
# =============================================================================

schema_version: 1
last_verified: "2026-03-21"

budgets:
