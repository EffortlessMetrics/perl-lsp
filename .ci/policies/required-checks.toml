version = 1
source = "ruleset-conventional"

# `[[check]]` entries are consumed by workflow-trigger-lint for required-style
# workflow shape. `[[checks]]` entries are the merge-ready / branch-protection
# status context inventory; only entries with `required = true` are treated as
# required by `cargo xtask merge-ready`.

[[check]]
name = "CI Gate"
workflow = ".github/workflows/ci.yml"
required = true

[[check]]
name = "Parser Ratchet"
workflow = ".github/workflows/parser-ratchet.yml"
required = false

[[check]]
name = "Methodology Gate"
workflow = ".github/workflows/methodology-gate.yml"
required = false

[[checks]]
name = "Perl LSP Rust Small Result"
workflow = ".github/workflows/em-ci-routed-rust.yml"
required = true
enforcement = "github-branch-protection"
reason = "Live main protection requires the routed Rust aggregate before merge."

[[checks]]
name = "ripr+ New Gap Gate"
workflow = ".github/workflows/ripr.yml"
required = true
enforcement = "github-branch-protection"
reason = "Proof lane blocks new RIPR gaps and stale/missing RIPR receipts."

[[checks]]
name = "Codecov / Patch 95"
workflow = ".github/workflows/ci-nightly.yml"
required = true
enforcement = "github-branch-protection"
reason = "Proof lane blocks patch coverage below 95% and stale/missing coverage receipts."

[[checks]]
name = "codecov/patch"
workflow = "codecov"
required = true
enforcement = "github-branch-protection"
reason = "External Codecov patch status must finish and pass before merge; the CI job alone is not enough."

[[checks]]
name = "tokmd Review Cockpit"
workflow = ".github/workflows/tokmd.yml"
# Phase 1: advisory-only (visibility gate, no merge blocking).
# Promotion to required = true tracked in #4993 (Phase 2/3).

[[checks]]
name = "PR Smoke"
workflow = ".github/workflows/ci.yml"

[[checks]]
name = "UX Regression Tests"
workflow = ".github/workflows/ux-regression-gate.yml"

[[checks]]
name = "Merge Gate"
workflow = ".github/workflows/ci.yml"
