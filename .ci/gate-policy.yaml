# =============================================================================
# Gate Policy Configuration
# =============================================================================
#
# This file defines all CI/CD gates, their enforcement levels, and execution
# parameters. It serves as the single source of truth for what checks run
# when and how strictly they are enforced.
#
# Schema Version: 1
# Last Updated: 2026-04-23
# Related: justfile (ci-gate, ci-full), .github/workflows/ci.yml
#
# =============================================================================

schema_version: 1

# =============================================================================
# Global Settings
# =============================================================================
# These settings apply to all gates unless overridden at the gate level.

global:
  # Default timeout for any gate (5 minutes)
  default_timeout_seconds: 300

  # How long to retain artifacts from gate runs (7 days)
  artifact_retention_days: 7

  # Default retry behavior for transient failures
  default_retry_count: 0

  # Environment variables applied to all gates
  environment:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: "1"
    # Ensure lockfile is honored for reproducibility
    CARGO_LOCKED: "--locked"

  # Toolchain requirements
  toolchain:
    # MSRV for the project (per rust-toolchain.toml)
    msrv: "1.92.0"
    # Required components
    components:
      - rustfmt
      - clippy

# =============================================================================
# Tier Definitions
# =============================================================================
# Tiers define when gates run and their overall enforcement level.

tiers:
  # ---------------------------------------------------------------------------
  # pr_fast: Required for every PR, must complete quickly
  # ---------------------------------------------------------------------------
  # Target: < 3 minutes
  # Purpose: Catch obvious issues before review begins
  # Enforcement: Hard fail - blocks PR from merging
  pr_fast:
    description: "Fast checks that run on every PR push"
    target_duration_seconds: 180
    enforcement: required
    # These run on: pull_request to master/main
    trigger:
      - pull_request

  # ---------------------------------------------------------------------------
  # merge_gate: Required before merge to master
  # ---------------------------------------------------------------------------
  # Target: < 8 minutes
  # Purpose: Full verification before code lands
  # Enforcement: Hard fail - blocks merge
  merge_gate:
    description: "Full verification required before merging to master"
    target_duration_seconds: 480
    enforcement: required
    # These run on: PR approval + merge queue, or manual dispatch
    trigger:
      - merge_queue
      - workflow_dispatch

  # ---------------------------------------------------------------------------
  # nightly: Scheduled deep testing, non-blocking
  # ---------------------------------------------------------------------------
  # Target: < 60 minutes
  # Purpose: Catch subtle issues, track metrics over time
  # Enforcement: Informational - logged but doesn't block
  nightly:
    description: "Deep testing and metrics collection, runs on schedule"
    target_duration_seconds: 3600
    enforcement: informational
    # These run on: daily schedule (3 AM UTC)
    trigger:
      - schedule: "0 3 * * *"

  # ---------------------------------------------------------------------------
  # release: Required for release candidate validation
  # ---------------------------------------------------------------------------
  # Target: < 10 minutes
  # Purpose: Validate everything needed before cutting a release
  # Enforcement: Hard fail - blocks release
  release:
    description: "Release candidate validation"
    target_duration_seconds: 600
    enforcement: required
    trigger:
      - workflow_dispatch

# =============================================================================
# Gate Definitions
# =============================================================================
# Each gate defines a single check with its configuration.

gates:
  # ===========================================================================
  # Tier: pr_fast
  # ===========================================================================
  # Fast checks that run on every PR. Must be quick and reliable.

  - name: fmt
    tier: pr_fast
    description: "Check code formatting with rustfmt"
    required: true
    command: cargo xtask fmt --check
    timeout_seconds: 60
    retry_count: 0
    budgets:
      max_duration_ms: 30000
    quarantine: false
    tags:
      - formatting
      - style
    planning:
      role: always_on

  - name: check_conflict_markers
    tier: pr_fast
    description: "Prevent committed merge conflict markers"
    required: true
    command: just check-conflict-markers
    timeout_seconds: 180
    retry_count: 0
    budgets:
      max_duration_ms: 120000
    quarantine: false
    tags:
      - hygiene
      - conflict-markers
    planning:
      role: always_on

  - name: release_history
    tier: pr_fast
    description: "Validate release-history surfaces"
    required: true
    command: just ci-release-history
    timeout_seconds: 120
    retry_count: 0
    budgets:
      max_duration_ms: 90000
    quarantine: false
    tags:
      - release
      - hygiene
    planning:
      role: always_on

  - name: readme_heading_check
    tier: pr_fast
    description: "Prevent duplicate README level-2 headings"
    required: true
    command: just readme-heading-check
    timeout_seconds: 30
    retry_count: 0
    budgets:
      max_duration_ms: 10000
    quarantine: false
    tags:
      - docs
      - hygiene
    planning:
      role: always_on

  - name: publish_closure
    tier: pr_fast
    description: "Check publish-closure transitive dependencies"
    required: true
    command: just ci-publish-closure
    timeout_seconds: 60
    retry_count: 0
    budgets:
      max_duration_ms: 30000
    quarantine: false
    tags:
      - publish
      - hygiene
    planning:
      role: always_on

  - name: publish_manifest_check
    tier: pr_fast
    description: "Check publish manifest allowlist drift and license metadata"
    required: true
    command: just ci-publish-manifest-check
    timeout_seconds: 60
    retry_count: 0
    budgets:
      max_duration_ms: 30000
    quarantine: false
    tags:
      - publish
      - manifest
    planning:
      role: always_on

  - name: layer_check
    tier: pr_fast
    description: "Enforce crate dependency layering"
    required: true
    command: just ci-layer-check
    timeout_seconds: 60
    retry_count: 0
    budgets:
      max_duration_ms: 30000
    quarantine: false
    tags:
      - architecture
      - hygiene
    planning:
      role: always_on

  - name: published_crate_count_pr_fast
    tier: pr_fast
    description: "Ratchet published crate count"
    required: true
    command: just ci-published-crate-count
    timeout_seconds: 30
    retry_count: 0
    budgets:
      max_duration_ms: 10000
    quarantine: false
    tags:
      - publish
      - ratchet
    planning:
      role: always_on

  - name: release_history_check
    tier: pr_fast
    description: "Check release-history drift"
    required: true
    command: just ci-release-history-check
    timeout_seconds: 120
    retry_count: 0
    budgets:
      max_duration_ms: 90000
    quarantine: false
    tags:
      - release
      - hygiene
    planning:
      role: always_on

  - name: clippy_scoped
    tier: pr_fast
    description: "Scope-aware library clippy for ci-scope selected crates"
    required: true
    command: cargo clippy --locked --lib {package_args} -- -D warnings -A missing_docs
    timeout_seconds: 180
    retry_count: 0
    budgets:
      max_duration_ms: 120000
      max_warnings: 0
    quarantine: false
    tags:
      - lint
      - clippy
      - scoped
    planning:
      role: rust_scoped

  - name: unit_scoped
    tier: pr_fast
    description: "Scope-aware library tests for ci-scope selected crates"
    required: true
    command: cargo test --locked --lib {package_args}
    # Large source/sync cutovers can select most library crates and spend
    # the former 300s budget compiling before tests begin. Keep the gate
    # required, but give the shared runner enough headroom to finish.
    timeout_seconds: 600
    retry_count: 1
    budgets:
      max_duration_ms: 540000
    quarantine: false
    tags:
      - test
      - unit
      - scoped
    planning:
      role: rust_scoped

  - name: check_tests_scoped
    tier: pr_fast
    description: "Compile integration tests for ci-scope selected crates"
    required: true
    command: cargo check --locked --tests {package_args}
    timeout_seconds: 180
    retry_count: 0
    budgets:
      max_duration_ms: 150000
    quarantine: false
    tags:
      - check
      - tests
      - scoped
    planning:
      role: rust_scoped

  - name: inline_completion_contract
    tier: pr_fast
    description: "Inline-completion registration, capability, snapshot, and core provider contracts"
    required: true
    command: >-
      cargo test -p perl-lsp-rs --locked --test lsp_inline_completion_registration_tests &&
      cargo test -p perl-lsp-rs --locked --test lsp_registration_tests &&
      cargo test -p perl-lsp-rs --locked --test lsp_cap_snap &&
      cargo test -p perl-lsp-rs-core --locked --lib inline_completion
    timeout_seconds: 300
    retry_count: 0
    budgets:
      max_duration_ms: 240000
    quarantine: false
    tags:
      - test
      - lsp
      - inline-completion
      - protocol
    planning:
      role: rust_package_scoped
      packages:
        - perl-lsp-rs
        - perl-lsp-rs-core
        - xtask

  - name: inline_completion_quality_receipt
    tier: pr_fast
    description: "Deterministic inline-completion fixture quality receipt"
    required: true
    command: cargo xtask inline-completion-quality --receipt target/receipts/inline-completion-quality.json
    timeout_seconds: 60
    retry_count: 0
    budgets:
      max_duration_ms: 30000
    quarantine: false
    tags:
      - receipt
      - lsp
      - inline-completion
      - quality
    planning:
      role: rust_package_scoped
      packages:
        - perl-lsp-rs-core
        - xtask

  - name: clippy_core
    tier: pr_fast
    description: "Clippy lints on core library crates (not full workspace)"
    required: true
    # Core crates only for speed; full workspace in merge_gate
    command: >-
      cargo clippy
      -p perl-parser -p perl-lexer -p perl-parser-core
      --lib --locked
      -- -D warnings -A missing_docs
    timeout_seconds: 180
    retry_count: 0
    budgets:
      max_duration_ms: 120000
      max_warnings: 0
    quarantine: false
    tags:
      - lint
      - clippy
    planning:
      role: rust_fallback

  - name: unit_core
    tier: pr_fast
    description: "Fast unit test subset for quick feedback"
    required: true
    # Library tests only, no integration tests
    command: >-
      cargo test
      -p perl-parser -p perl-lexer -p perl-parser-core
      --lib --locked
      -- --test-threads=4
    timeout_seconds: 180
    retry_count: 1
    budgets:
      max_duration_ms: 150000
    quarantine: false
    tags:
      - test
      - unit
    planning:
      role: rust_fallback

  - name: perl_token_leaf_contract
    tier: pr_fast
    description: "Ratchet perl-token leaf-crate dependency and API/metadata stability"
    required: true
    command: cargo test -p perl-token --test conformance_guards --locked
    timeout_seconds: 120
    retry_count: 0
    budgets:
      max_duration_ms: 90000
    quarantine: false
    tags:
      - test
      - conformance
      - perl-token
    planning:
      role: always_on

  # ===========================================================================
  # Tier: merge_gate
  # ===========================================================================
  # Full verification required before merging. Can be slower but must be thorough.

  - name: clippy_full
    tier: merge_gate
    description: "Clippy lints on full workspace with strict settings"
    required: true
    command: >-
      cargo clippy
      --workspace --lib --locked
      -- -D warnings -A missing_docs &&
      cargo clippy
      --workspace --bins --locked --no-deps
      -- -D clippy::unwrap_used -D clippy::expect_used
    timeout_seconds: 300
    retry_count: 0
    budgets:
      max_duration_ms: 240000
      max_warnings: 0
    quarantine: false
    tags:
      - lint
      - clippy
      - strict

  - name: unit_foundation_full
    tier: merge_gate
    description: "Foundation token/AST workspace library tests"
    required: true
    command: >-
      cargo test --locked --lib
      -p perl-ast -p perl-ast-v2
      -p perl-incremental-parsing
      -p perl-line-index -p perl-parser-pest
      -p perl-pod -p perl-position-tracking
      -p perl-pragma -p perl-regex
      -p perl-symbol -p perl-token -p perl-uri
      -- --test-threads=4
    timeout_seconds: 240
    retry_count: 1
    budgets:
      max_duration_ms: 180000
    quarantine: false
    tags:
      - test
      - unit
      - workspace

  - name: unit_parser_stack_full
    tier: merge_gate
    description: "Parser, lexer, and parser-core library tests"
    required: true
    command: >-
      cargo test --locked --lib
      -p perl-parser -p perl-lexer -p perl-parser-core
      -- --test-threads=4
    timeout_seconds: 180
    retry_count: 1
    budgets:
      max_duration_ms: 150000
    quarantine: false
    tags:
      - test
      - unit
      - workspace

  - name: unit_analysis_full
    tier: merge_gate
    description: "Semantic analysis, workspace, diagnostics, and refactoring library tests"
    required: true
    command: >-
      cargo test --locked --lib
      -p perl-corpus -p perl-dead-code -p perl-diagnostics
      -p perl-module -p perl-refactoring
      -p perl-semantic-analyzer -p perl-semantic-facts
      -p perl-workspace
      -- --test-threads=4
    timeout_seconds: 300
    retry_count: 1
    budgets:
      max_duration_ms: 240000
    quarantine: false
    tags:
      - test
      - unit
      - workspace

  - name: unit_lsp_full
    tier: merge_gate
    description: "LSP, editor UX, perltidy, and subprocess library tests"
    required: true
    command: >-
      cargo test --locked --lib
      -p perl-lsp-perltidy -p perl-lsp-rs
      -p perl-lsp-rs-core -p perl-lsp-ux-tests
      -p perl-subprocess-runtime -p perllsp
      -- --test-threads=4
    timeout_seconds: 300
    retry_count: 1
    budgets:
      max_duration_ms: 240000
    quarantine: false
    tags:
      - test
      - unit
      - workspace

  - name: unit_dap_support_full
    tier: merge_gate
    description: "DAP, CI hygiene, test support, and tree-sitter workspace library tests"
    required: true
    command: >-
      cargo test --locked --lib
      -p perl-ci-hygiene -p perl-dap
      -p perl-tdd-support -p perl-test-generators -p perl-test-must
      -p tree-sitter-perl-c -p tree-sitter-perl-rs
      -- --test-threads=4
    timeout_seconds: 300
    retry_count: 1
    budgets:
      max_duration_ms: 240000
    quarantine: false
    tags:
      - test
      - unit
      - workspace

  - name: compile_all_targets
    tier: merge_gate
    description: "Compile all workspace targets (lib/bin/tests/benches) to catch integration and bench bit-rot; also validates all-features paths"
    required: true
    command: just check-all-targets
    timeout_seconds: 240
    retry_count: 0
    budgets:
      max_duration_ms: 180000
    quarantine: false
    tags:
      - compile
      - integration
      - benches
      - workspace

  - name: lsp_smoke
    tier: merge_gate
    description: "Deterministic LSP scenario test (semantic definitions)"
    required: true
    # Single-threaded for determinism
    command: >-
      env -u RUSTC_WRAPPER
      RUST_TEST_THREADS=1 CARGO_BUILD_JOBS=1
      cargo test -p perl-lsp-rs --test semantic_definition --locked
      -- --test-threads=1
    timeout_seconds: 300
    retry_count: 1
    budgets:
      max_duration_ms: 240000
    quarantine: false
    tags:
      - test
      - lsp
      - integration
      - deterministic

  - name: common_corpus_clean
    tier: merge_gate
    description: "Pinned common Perl modules must parse with zero errors"
    required: true
    command: >-
      cargo run --locked -p xtask
      -- parser-corpus-sweep
      --manifest .ci/common-corpus-manifest.txt --enforce --receipt
    timeout_seconds: 240
    retry_count: 0
    budgets:
      max_duration_ms: 180000
    quarantine: false
    tags:
      - corpus
      - parser
      - common
      - strict

  # NOTE (2026-04-26): demoted to advisory (required: false). Baseline
  # `.ci/parser-corpus-baseline.json` was captured against a snapshot of the
  # runner's `/usr/share/perl` tree and drifts whenever Ubuntu updates Perl,
  # producing per-bucket "regressions" (e.g. unclosed_paren 2 → 4) that are
  # purely environmental, not parser regressions. Strategic redesign tracked
  # separately; out-of-band cron will own the ratchet going forward.
  - name: parser_corpus_ratchet
    tier: merge_gate
    description: "System Perl corpus must not regress against parser baseline (advisory; baseline drifts with runner Perl)"
    required: false
    command: >-
      cargo run --locked -p xtask
      -- parser-corpus-sweep
      --baseline .ci/parser-corpus-baseline.json --enforce --receipt
    timeout_seconds: 180
    retry_count: 0
    budgets:
      max_duration_ms: 150000
    quarantine: false
    tags:
      - corpus
      - parser
      - ratchet
      - advisory

  # NOTE (2026-04-26): demoted to advisory (required: false). The merge-gate
  # CI workflow does not run `cargo xtask cpan-corpus install` before this
  # gate, so it always fails with "CPAN corpus not installed". Until the
  # workflow is extended (or the install is moved into the gate command),
  # this gate cannot pass on PR runners. The post-merge corpus-ratchet
  # workflow already owns the real CPAN check.
  - name: cpan_corpus_ratchet
    tier: merge_gate
    description: "CPAN corpus baseline + known-clean manifest must remain green (advisory; CPAN corpus not installed on PR runners)"
    required: false
    command: cargo run --locked -p xtask -- cpan-corpus sweep --enforce
    timeout_seconds: 300
    retry_count: 0
    budgets:
      max_duration_ms: 240000
    quarantine: false
    tags:
      - corpus
      - parser
      - cpan
      - ratchet

  - name: parser_audit_closeout
    tier: merge_gate
    # Deterministic/scoped rationale for required=true:
    # - Evaluates repository-local corpus files only (`--corpus-path .`), not host CPAN/system trees.
    # - Uses a fresh in-process run (`--fresh`) to avoid stale machine-local cache baselines.
    description: "Project corpus parser closeout metrics (repo-scoped, deterministic run) must not regress"
    required: true
    command: >-
      cargo run --locked -p xtask
      -- corpus-audit --fresh --corpus-path . --check
    timeout_seconds: 180
    retry_count: 0
    budgets:
      max_duration_ms: 150000
    quarantine: false
    tags:
      - corpus
      - parser
      - audit
      - ratchet

  - name: security_audit
    tier: merge_gate
    description: "Check dependencies for known security vulnerabilities"
    required: true
    # Quarantined: cargo-audit ecosystem breakage as of 2026-04-26.
    # - cargo-audit >= 0.21: can't install (abscissa_core ^0.8 requires secrecy ^0.10, all 0.10.x yanked)
    # - cargo-audit <= 0.20: installs but can't parse CVSS 4.0 advisories (RUSTSEC-2026-0041)
    # Unquarantine when a working cargo-audit release is available. See debt-ledger.yaml.
    command: cargo audit --deny warnings --ignore RUSTSEC-2023-0089 2>/dev/null || cargo install cargo-audit && cargo audit --deny warnings --ignore RUSTSEC-2023-0089
    timeout_seconds: 300
    retry_count: 1
    budgets:
      max_duration_ms: 240000
    quarantine: true  # See debt-ledger.yaml: cargo-audit-broken-install-2026-04-26
    tags:
      - security
      - dependencies
      - audit

  - name: policy_checks
    tier: merge_gate
    description: "Enforce project policies (docs baseline, version sync, ExitStatus helper, features invariants)"
    required: true
    command: >-
      cargo xtask check-from-raw &&
      cargo xtask check-memory-lifecycle-policy &&
      bash scripts/check-version-sync.sh &&
      bash scripts/check_release_history.sh &&
      bash ci/check_missing_docs.sh &&
      bash ci/check_parse_errors.sh &&
      python3 scripts/check_features_invariants.py
    timeout_seconds: 240
    retry_count: 0
    budgets:
      max_duration_ms: 220000
    quarantine: false
    tags:
      - policy
      - docs
      - invariants

  - name: docs_build
    tier: merge_gate
    description: "Verify documentation builds without errors"
    required: true
    command: cargo doc -p perl-parser -p perl-lsp-rs --no-deps --locked
    timeout_seconds: 180
    retry_count: 0
    budgets:
      max_duration_ms: 150000
    quarantine: false
    tags:
      - docs
      - build

  - name: v2_parity
    tier: merge_gate
    description: "Verify in-crate v2 and perl-parser-pest v2 produce identical corpus output"
    required: true
    command: >-
      cargo run --locked -p xtask --features legacy
      -- corpus --scanner v2-parity
    timeout_seconds: 300
    retry_count: 0
    budgets:
      max_duration_ms: 240000
    quarantine: false
    tags:
      - parser
      - corpus
      - parity
      - microcrate

  - name: v2_bundle_sync
    tier: merge_gate
    description: "Verify v2 bundle files stay synchronized while bridge fallback exists"
    required: true
    command: bash scripts/check-v2-bundle-sync.sh
    timeout_seconds: 60
    retry_count: 0
    budgets:
      max_duration_ms: 30000
    quarantine: false
    tags:
      - parser
      - sync
      - microcrate

  - name: workflow_audit
    tier: merge_gate
    description: "Audit CI workflows for ungated expensive jobs"
    required: true
    command: python3 scripts/ci-audit-workflows.py
    timeout_seconds: 60
    retry_count: 0
    budgets:
      max_duration_ms: 30000
    quarantine: false
    tags:
      - ci
      - audit
      - meta

  - name: nested_lock_check
    tier: merge_gate
    description: "Ensure no nested Cargo.lock files exist (footgun prevention)"
    required: true
    command: >-
      if find . \( -path './target' -o -path './.runs' -o -path './archive' -o -path './fuzz' -o -path './tree-sitter-perl' \) -prune -o -name 'Cargo.lock' -type f -print 2>/dev/null |
         grep -v '^\./Cargo\.lock$' | grep -q .; then
        echo "ERROR: Nested Cargo.lock detected!";
        find . \( -path './target' -o -path './.runs' -o -path './archive' -o -path './fuzz' -o -path './tree-sitter-perl' \) -prune -o -name 'Cargo.lock' -type f -print 2>/dev/null |
          grep -v '^\./Cargo\.lock$';
        exit 1;
      fi
    timeout_seconds: 30
    retry_count: 0
    budgets:
      max_duration_ms: 10000
    quarantine: false
    tags:
      - lockfile
      - hygiene

  - name: published_crate_count
    tier: merge_gate
    description: "Ratchet: published crate count must not exceed baseline"
    required: true
    command: cargo xtask published-crate-count
    timeout_seconds: 30
    retry_count: 0
    budgets:
      max_duration_ms: 5000
    quarantine: true  # Until collapse completes (~30-31 crates)
    tags:
      - ratchet
      - microcrate
      - collapse

  # ===========================================================================
  # Tier: nightly
  # ===========================================================================
  # Expensive checks that run on schedule. Non-blocking but tracked.

  - name: mutation
    tier: nightly
    description: "Mutation testing subset to verify test quality"
    required: false
    # Limited timeout and package subset for bounded runtime
    command: >-
      cargo install cargo-mutants --locked 2>/dev/null || true;
      cargo mutants
      --package perl-parser-core
      --timeout 60
      --jobs 2
      --no-shuffle
      || true
    timeout_seconds: 1800
    retry_count: 0
    budgets:
      max_duration_ms: 1800000
    quarantine: true
    tags:
      - mutation
      - test-quality
      - expensive

  - name: fuzz
    tier: nightly
    description: "Bounded fuzzing runs for parser robustness"
    required: false
    # Property tests with high iteration count
    command: >-
      env PROPTEST_CASES=2048 PROPTEST_MAX_SHRINK_ITERS=1000
      cargo test --locked -p perl-parser prop_ --release
      -- --nocapture
    timeout_seconds: 1800
    retry_count: 0
    budgets:
      max_duration_ms: 1800000
    quarantine: true
    tags:
      - fuzz
      - proptest
      - expensive

  - name: benchmarks
    tier: nightly
    description: "Performance benchmarks for tracking regressions"
    required: false
    command: >-
      cargo bench --locked -p perl-parser --bench parser_benchmark
      -- --output-format bencher
      | tee benchmark_output.txt
    timeout_seconds: 900
    retry_count: 0
    budgets:
      max_duration_ms: 900000
    quarantine: true
    artifacts:
      - benchmark_output.txt
      - target/criterion/**
    tags:
      - benchmark
      - performance
      - tracking

  - name: full_matrix
    tier: nightly
    description: "All OS/toolchain combinations for compatibility"
    required: false
    # This is a matrix job; command represents one cell
    # Actual matrix expansion happens in workflow definition
    command: >-
      cargo test --workspace --lib --locked
    timeout_seconds: 1200
    retry_count: 1
    budgets:
      max_duration_ms: 1200000
    quarantine: true
    matrix:
      os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
      toolchain:
        - stable
        - "1.92.0"  # MSRV
        - beta
    tags:
      - matrix
      - compatibility
      - cross-platform

  - name: coverage
    tier: nightly
    description: "Code coverage collection and reporting"
    required: false
    command: >-
      rustup run nightly cargo install cargo-llvm-cov --locked 2>/dev/null || true;
      rustup run nightly cargo llvm-cov -p perl-parser --lib --branch --lcov --output-path lcov.info;
      bash ./scripts/check-coverage-baseline.sh lcov.info .ci/coverage-baseline.txt
    timeout_seconds: 900
    retry_count: 0
    budgets:
      max_duration_ms: 900000
    quarantine: true
    artifacts:
      - lcov.info
    tags:
      - coverage
      - metrics
      - tracking

  - name: corpus_validation
    tier: nightly
    description: "Full corpus validation and coverage reporting"
    required: false
    command: >-
      cargo run --locked -p xtask --no-default-features
      -- corpus-audit --fresh --corpus-path .
    timeout_seconds: 600
    retry_count: 0
    budgets:
      max_duration_ms: 600000
    quarantine: true
    artifacts:
      - corpus_audit_report.json
    tags:
      - corpus
      - coverage
      - tracking

  - name: corpus_sweep
    tier: nightly
    description: "Parser corpus sweep ratchet check against baseline"
    required: false
    command: >-
      cargo run --locked -p xtask
      -- parser-corpus-sweep
      --baseline .ci/parser-corpus-baseline.json --enforce --receipt
    timeout_seconds: 600
    retry_count: 0
    budgets:
      max_duration_ms: 600000
    quarantine: true
    artifacts:
      - target/receipts/corpus-sweep.json
    tags:
      - corpus
      - parser
      - ratchet

  - name: determinism_check
    tier: nightly
    description: "Verify test output is deterministic across runs"
    required: false
    # Run tests multiple times and compare output
    command: >-
      for i in 1 2 3; do
        cargo test -p perl-parser --lib --locked 2>&1 |
        sed -E 's/^Finished in .*//; s/^\s*Time:\s.*$//' > "run_${i}.log";
      done;
      diff -q run_1.log run_2.log && diff -q run_1.log run_3.log
    timeout_seconds: 600
    retry_count: 0
    budgets:
      max_duration_ms: 600000
    quarantine: true
    tags:
      - determinism
      - reproducibility
      - quality

  # ===========================================================================
  # Tier: release
  # ===========================================================================
  # Release candidate validation gates.

  - name: release_build
    tier: release
    description: "Release build with locked dependencies"
    required: true
    command: cargo build -p perllsp --release --locked
    timeout_seconds: 300
    retry_count: 0
    budgets:
      max_duration_ms: 300000
    quarantine: false
    tags:
      - release
      - build

  - name: inline_completion_binary_smoke
    tier: release
    description: "Release-built perl-lsp stdio smoke for LSP 3.18 inline completion"
    required: true
    command: >-
      cargo build --release -p perl-lsp-rs --bin perl-lsp --locked &&
      cargo xtask smoke inline-completion --binary target/release/perl-lsp
    timeout_seconds: 360
    retry_count: 0
    budgets:
      max_duration_ms: 300000
    quarantine: false
    tags:
      - release
      - lsp
      - inline-completion
      - smoke

  - name: version_sync
    tier: release
    description: "All version strings agree across features.toml, Cargo.toml, package.json, build.rs"
    required: true
    command: bash scripts/check-version-sync.sh
    timeout_seconds: 30
    retry_count: 0
    budgets:
      max_duration_ms: 10000
    quarantine: false
    tags:
      - release
      - version
      - hygiene

  - name: sbom_verify
    tier: release
    description: "SBOM generation and verification for supply chain security"
    required: true
    command: >-
      just sbom-verify
    timeout_seconds: 300
    retry_count: 0
    budgets:
      max_duration_ms: 300000
    quarantine: false
    tags:
      - release
      - sbom
      - supply-chain

  # ===========================================================================
  # LSP Tiered Testing
  # ===========================================================================
  # Fast smoke subset for merge gate, full suite for nightly.

  - name: lsp_tier_a
    tier: merge_gate
    description: "LSP smoke tests: capabilities, protocol basics (<30s)"
    required: true
    command: >-
      cargo test -p perl-lsp-rs
      --test cli_smoke --test lsp_capabilities_snapshot
      --test lsp_capabilities_contract --test lsp_protocol_tests
      --locked -- --test-threads=1
    timeout_seconds: 60
    retry_count: 1
    budgets:
      max_duration_ms: 30000
    quarantine: false
    tags:
      - test
      - lsp
      - smoke
      - tier-a

  - name: lsp_tier_b
    tier: merge_gate
    description: "LSP core behavior: definitions, completion, color handling, code lens, inline completion, security (2-5 min)"
    required: true
    command: >-
      env RUST_TEST_THREADS=2
      cargo test -p perl-lsp-rs
      --test semantic_definition --test lsp_completion_tests
      --test lsp_color_tests
      --test lsp_code_lens_tests
      --test lsp_inline_completion_tests
      --test lsp_unhappy_paths --test lsp_code_actions_test
      --test execute_command_security_tests --test lsp_behavioral_tests
      --test lsp_workspace_index_e2e
      --test editor_intelligence_scorecard
      --locked -- --test-threads=2
    timeout_seconds: 300
    retry_count: 1
    budgets:
      max_duration_ms: 300000
    quarantine: false
    tags:
      - test
      - lsp
      - behavior
      - tier-b

# =============================================================================
# Flake Management Policy
# =============================================================================
# How to handle flaky tests and transient failures.
#
# IMPORTANT: Quarantined tests are now tracked in .ci/debt-ledger.yaml
# This section defines the policy; the ledger tracks the actual items.

flake_policy:
  # Number of automatic retries before marking as failed
  max_retries: 2

  # If a gate fails more than this many times in a week, auto-quarantine
  auto_quarantine_threshold: 3

  # How long a gate stays in quarantine before re-evaluation (days)
  quarantine_duration_days: 7

  # Path to the technical debt ledger (source of truth for quarantined items)
  debt_ledger_path: ".ci/debt-ledger.yaml"

  # Gates currently in quarantine are managed via debt-ledger.yaml
  # Run `just debt-report` to see current quarantined tests
  # Run `just debt-check` to verify budget compliance
  quarantined_gates: []
  # Note: This is populated dynamically from debt-ledger.yaml by tooling

  # Known flaky test patterns (for reporting, not skipping)
  known_flaky_patterns:
    - pattern: "test_lsp_.*timeout"
      reason: "Network-dependent LSP tests occasionally timeout"
    - pattern: "prop_.*shrink"
      reason: "Proptest shrinking can be non-deterministic"

  # Debt budget enforcement in gates
  debt_budget_enforcement:
    # Fail merge-gate if debt budgets are exceeded
    fail_on_budget_exceeded: true
    # Fail merge-gate if quarantines are expired
    fail_on_expired_quarantine: true
    # Warn (but don't fail) when approaching budget
    warn_on_warning_threshold: true

# =============================================================================
# Escape Hatch Documentation
# =============================================================================
# IMPORTANT: Escape hatches exist for emergencies only. Abuse will be tracked.

escape_hatches:
  # ---------------------------------------------------------------------------
  # Bypass a specific gate (use sparingly!)
  # ---------------------------------------------------------------------------
  skip_gate:
    description: |
      To skip a specific gate in an emergency:

      1. Add `[skip-gate:GATE_NAME]` to your commit message
      2. The gate will be skipped BUT logged to audit trail
      3. A GitHub issue will be auto-created to track the bypass

      Example: `git commit -m "hotfix: critical bug [skip-gate:clippy_full]"`

      Requirements:
      - Must have maintainer approval (via PR review)
      - Must create follow-up issue to address the root cause
      - Bypass logged permanently in audit trail

    allowed_gates:
      # These gates CAN be bypassed in emergencies
      - clippy_full
      - security_audit
      - docs_build
      - policy_checks
    never_skip:
      # These gates can NEVER be bypassed
      - fmt
      - clippy_core
      - unit_core
      - unit_foundation_full
      - unit_parser_stack_full
      - unit_analysis_full
      - unit_lsp_full
      - unit_dap_support_full

  # ---------------------------------------------------------------------------
  # Force merge despite failures
  # ---------------------------------------------------------------------------
  force_merge:
    description: |
      To force-merge despite gate failures:

      1. Requires TWO maintainer approvals
      2. Add `[force-merge]` to PR title
      3. Document reason in PR description under `## Force Merge Justification`
      4. All bypassed gates logged to audit trail
      5. Auto-creates tracking issue for resolution

      THIS SHOULD BE EXTREMELY RARE. Most emergencies can be handled by:
      - Fixing the actual issue
      - Using skip_gate for specific gates
      - Deploying from a known-good commit

  # ---------------------------------------------------------------------------
  # Disable all gates (nuclear option)
  # ---------------------------------------------------------------------------
  disable_all:
    description: |
      To temporarily disable all gates (NUCLEAR OPTION):

      1. Requires repository admin
      2. Set repository variable: CI_GATES_DISABLED=true
      3. Maximum duration: 24 hours (auto-reverts)
      4. Sends alert to #oncall channel
      5. Creates incident report

      Use only for:
      - Complete CI infrastructure failure
      - Critical security patches that must deploy immediately
      - GitHub Actions outage

# =============================================================================
# Audit and Reporting
# =============================================================================

audit:
  # Where to store gate execution receipts
  receipt_path: target/receipts/receipt.json

  # Log directory for individual gate outputs
  log_directory: target/receipts/logs

  # How long to retain audit logs (days)
  retention_days: 90

  # Metrics to track over time
  tracked_metrics:
    - gate_duration_seconds
    - gate_success_rate
    - retry_frequency
    - quarantine_entries
    - escape_hatch_usage

  # Alert thresholds
  alerts:
    # Alert if any gate regularly exceeds its budget
    duration_budget_exceeded_percent: 150
    # Alert if success rate drops below threshold
    success_rate_threshold_percent: 95
    # Alert if escape hatches used more than N times per month
    escape_hatch_monthly_limit: 3

# =============================================================================
# Integration with CI Workflows
# =============================================================================
# Mapping between this policy and GitHub Actions workflows.

workflow_integration:
  # Primary workflow that consumes this policy
  primary_workflow: .github/workflows/ci.yml

  # How gates map to workflow jobs
  job_mapping:
    ci-gate:
      gates:
        - fmt
        - clippy_full
        - unit_foundation_full
        - unit_analysis_full
        - unit_lsp_full
        - unit_dap_support_full
        - compile_all_targets
        - common_corpus_clean
        - lsp_smoke
        - docs_build
        - v2_bundle_sync
        - nested_lock_check
        - published_crate_count
      # Note: PR Smoke owns clippy_core/unit_core/parser stack. Parser audit,
      # v2 parity, workflow audit, and full policy closeout remain defined but
      # are too long for the bounded merge-blocking workflow shard.

    release-gate:
      gates:
        - release_build
        - inline_completion_binary_smoke
        - version_sync
        - sbom_verify

  # Environment variables set by workflows
  workflow_env:
    CI: "true"
    GITHUB_ACTIONS: "true"

# =============================================================================
# Version History
# =============================================================================
# Track significant changes to this policy.

version_history:
  - version: "1.0.0"
    date: "2026-01-24"
    changes:
      - "Initial gate policy definition"
      - "Three-tier system: pr_fast, merge_gate, nightly"
      - "Escape hatch documentation"
      - "Flake management policy"
