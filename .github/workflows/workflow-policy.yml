name: Workflow Policy Lint

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [master]
  merge_group:

permissions:
  contents: read

jobs:
  workflow-policy-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - name: Run workflow policy lint
        run: cargo xtask workflow-policy-lint --receipt target/receipts/workflow-policy.json
      - name: Upload workflow policy receipt
        uses: actions/upload-artifact@v4
        with:
          name: workflow-policy-receipt
          path: target/receipts/workflow-policy.json
