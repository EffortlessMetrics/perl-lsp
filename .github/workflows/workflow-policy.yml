name: Workflow Policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'xtask/src/tasks/workflow_policy_lint.rs'
      - 'xtask/src/main.rs'
      - 'xtask/src/tasks/mod.rs'
      - 'xtask/tests/fixtures/workflow-policy/**'
      - '.ci/receipts/schemas/workflow-policy.schema.json'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - 'xtask/src/tasks/workflow_policy_lint.rs'
      - 'xtask/src/main.rs'
      - 'xtask/src/tasks/mod.rs'
      - 'xtask/tests/fixtures/workflow-policy/**'
      - '.ci/receipts/schemas/workflow-policy.schema.json'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run workflow policy lint
        run: cargo xtask workflow-policy-lint --receipt target/receipts/workflow-policy.json
