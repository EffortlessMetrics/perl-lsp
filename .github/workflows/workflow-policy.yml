name: Workflow Policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'xtask/src/tasks/workflow_policy_lint.rs'
      - 'xtask/src/main.rs'
      - 'xtask/src/tasks/mod.rs'
      - '.ci/receipts/schemas/workflow-policy.schema.json'
      - 'xtask/tests/fixtures/workflow-policy/**'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - 'xtask/src/tasks/workflow_policy_lint.rs'
      - 'xtask/src/main.rs'
      - 'xtask/src/tasks/mod.rs'
      - '.ci/receipts/schemas/workflow-policy.schema.json'
      - 'xtask/tests/fixtures/workflow-policy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-policy-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - name: Run workflow policy lint
        run: cargo xtask workflow-policy-lint --receipt target/receipts/workflow-policy.json
      - name: Upload workflow policy receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-policy-receipt
          path: target/receipts/workflow-policy.json
