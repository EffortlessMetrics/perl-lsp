# ripr — static RIPR exposure analysis (advisory)
#
# Adds mutation-testing-lite oracle-gap detection at static-analysis prices.
# Advisory in this rollout PR (PR 06). PR 18 introduces narrow soft-gating
# for high-confidence new oracle gaps with `ripr` / `ripr-waive` / `full-ci`
# / `ci-budget-ack` labels.
#
# See docs/ci/ripr.md.

name: ripr

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'crates/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ripr.toml'
      - 'policy/ripr-suppressions.toml'
      - '.github/workflows/ripr.yml'
  workflow_dispatch: {}

concurrency:
  group: ripr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  ripr:
    name: ripr static exposure
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    # Advisory only in this PR. Failures do not block.
    continue-on-error: true
    if: github.event.pull_request.draft != true
    env:
      RIPR_VERSION: "0.5.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Toolchain (rust-toolchain.toml pins 1.95.0)
        run: rustc --version

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ripr-${{ env.RIPR_VERSION }}-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Install ripr
        run: cargo install ripr --version "$RIPR_VERSION" --locked

      - name: Run ripr (doctor)
        run: ripr doctor

      - name: Fetch base branch
        if: github.base_ref != ''
        run: git fetch origin ${{ github.base_ref }}

      - name: RIPR PR evidence
        id: ripr_pr
        run: cargo xtask ripr-pr

      - name: RIPR review guidance
        id: ripr_review
        run: cargo xtask ripr-review-comments

      - name: RIPR PR contract
        if: always()
        run: cargo xtask ripr-pr --check

      - name: RIPR review contract
        if: always()
        run: cargo xtask ripr-review-comments --check

      - name: RIPR annotations
        if: always()
        run: python scripts/ripr-annotations.py

      - name: RIPR review summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RIPR Review Guidance"
            echo
            if [ -f target/ripr/review/comments.md ]; then
              cat target/ripr/review/comments.md
            else
              echo "No RIPR review guidance was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RIPR PR evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-pr
          path: target/ripr/pr
          retention-days: 14
          if-no-files-found: warn

      - name: Upload RIPR review guidance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-review
          path: target/ripr/review
          retention-days: 14
          if-no-files-found: warn
