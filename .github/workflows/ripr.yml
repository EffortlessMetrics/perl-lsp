# ripr - portable PR evidence and review guidance (advisory)
#
# Badges are repo-scoped public state. This workflow produces diff-scoped PR
# evidence under target/ripr/ and mutation-routing receipts under target/xtask/.

name: ripr

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: ripr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ripr:
    name: ripr+ New Gap Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event.pull_request.draft != true
    env:
      RIPR_VERSION: "0.5.0"
      BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
      PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Toolchain (rust-toolchain.toml pins 1.95.0)
        run: rustc --version

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ripr-${{ env.RIPR_VERSION }}-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Install ripr
        run: cargo install ripr --version "$RIPR_VERSION" --locked

      - name: Run ripr doctor
        run: ripr doctor

      - name: Generate PR evidence
        run: cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD

      - name: Generate repo-wide RIPR+ baseline receipt
        if: always()
        run: cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json

      - name: Generate review guidance
        if: always()
        run: cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --timeout-seconds 210

      - name: Generate impacted evidence
        if: always()
        run: cargo xtask impacted-evidence --labels-csv "$PR_LABELS"

      - name: Generate PR evidence summary
        if: always()
        run: cargo xtask ripr-pr-summary

      - name: Generate warning annotations
        if: always()
        run: cargo xtask ripr-annotations

      - name: Validate PR evidence contracts
        if: always()
        run: |
          cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --check
          cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json --check
          cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --check
          cargo xtask impacted-evidence --labels-csv "$PR_LABELS" --check
          cargo xtask ripr-pr-summary --check
          cargo xtask ripr-annotations --check

      - name: Enforce new RIPR gap quality gate
        if: always()
        run: |
          cargo xtask quality-gate \
            --mode enforce-new-ripr \
            --ripr-receipt target/receipts/quality/ripr-plus.json \
            --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
            --review-receipt target/ripr/review/comments.json \
            --ripr-base "origin/$BASE_REF" \
            --ripr-head HEAD \
            --receipt target/receipts/quality/quality-gate-ripr.json \
            --summary target/receipts/quality/quality-gate-ripr.md
          cargo xtask quality-gate \
            --mode enforce-new-ripr \
            --ripr-receipt target/receipts/quality/ripr-plus.json \
            --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
            --review-receipt target/ripr/review/comments.json \
            --ripr-base "origin/$BASE_REF" \
            --ripr-head HEAD \
            --receipt target/receipts/quality/quality-gate-ripr.json \
            --summary target/receipts/quality/quality-gate-ripr.md \
            --check

      - name: Append PR evidence summary
        if: always()
        shell: bash
        run: |
          if [ -f target/ripr/pr/summary.md ]; then
            cat target/ripr/pr/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR PR evidence summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/receipts/quality/quality-gate-ripr.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat target/receipts/quality/quality-gate-ripr.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR quality-gate summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/ripr/review/annotations.txt ]; then
            cat target/ripr/review/annotations.txt
          fi

      - name: Upload ripr PR evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-pr-evidence
          path: |
            target/ripr/pr/**
            target/ripr/review/**
            target/xtask/impacted-evidence/**
            target/receipts/quality/ripr-plus.json
            target/receipts/quality/quality-gate-ripr.json
            target/receipts/quality/quality-gate-ripr.md
          retention-days: 14
          if-no-files-found: error
