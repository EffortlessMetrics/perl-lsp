name: EM CI Routed Rust

on:
  workflow_dispatch:
    inputs:
      force_target:
        description: Force a route target for fallback proof.
        required: false
        default: auto
        type: choice
        options:
          - auto
          - cx53
          - cx43
          - github
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: em-ci-routed-rust-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.95.0"

jobs:
  route-rust-small:
    name: Route Perl LSP Rust Small
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.route.outputs.target }}
      reason: ${{ steps.route.outputs.reason }}
      error: ${{ steps.route.outputs.error }}
      fallback_allowed: ${{ steps.route.outputs.fallback_allowed }}
    steps:
      - name: Decide target runner
        id: route
        env:
          GH_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN }}
          ORG: EffortlessMetrics
          FORCE_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.force_target || 'auto' }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PR_AUTHOR_LOGIN: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || '' }}
          PR_AUTHOR_TYPE: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.type || '' }}
        shell: bash
        run: |
          set -euo pipefail

          emit() {
            local target="$1" reason="$2" error="$3" fallback_allowed="$4"
            echo "router_target=$target"
            echo "router_reason=$reason"
            echo "router_error=$error"
            echo "router_fallback_allowed=$fallback_allowed"
            {
              echo "target=$target"
              echo "reason=$reason"
              echo "error=$error"
              echo "fallback_allowed=$fallback_allowed"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### Perl LSP Rust Small Route"
              echo ""
              echo "- router_target: \`$target\`"
              echo "- router_reason: \`$reason\`"
              echo "- router_error: \`$error\`"
              echo "- router_fallback_allowed: \`$fallback_allowed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$IS_FORK_PR" = "true" ]; then
            emit "github" "fork_pr" "false" "true"
            exit 0
          fi

          if [ "$IS_PULL_REQUEST" = "true" ]; then
            pr_author_login_lc="$(printf '%s' "${PR_AUTHOR_LOGIN:-}" | tr '[:upper:]' '[:lower:]')"
            pr_author_type_lc="$(printf '%s' "${PR_AUTHOR_TYPE:-}" | tr '[:upper:]' '[:lower:]')"
            is_bot_pr="false"

            case "$pr_author_login_lc" in
              dependabot*|app/*|*\[bot\])
                is_bot_pr="true"
                ;;
            esac

            if [ "$pr_author_type_lc" = "bot" ]; then
              is_bot_pr="true"
            fi

            if [ "$is_bot_pr" = "true" ]; then
              emit "github" "bot_pr_github_hosted" "false" "true"
              exit 0
            fi
          fi

          case "${FORCE_TARGET:-auto}" in
            cx53|cx43|github)
              emit "$FORCE_TARGET" "workflow_dispatch_force_target" "false" "true"
              exit 0
              ;;
            auto|"")
              ;;
            *)
              emit "none" "invalid_force_target" "true" "false"
              exit 0
              ;;
          esac

          if [ -z "${GH_TOKEN:-}" ]; then
            emit "none" "runner_token_missing" "true" "false"
            exit 0
          fi

          response="$(mktemp)"
          status="$(curl -sS -w '%{http_code}' -o "$response" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/$ORG/actions/runners?per_page=100" || true)"

          if [ "$status" != "200" ]; then
            echo "::error::runner API returned HTTP $status; refusing implicit GitHub-hosted fallback"
            emit "none" "runner_api_failed" "true" "false"
            exit 0
          fi

          idle_runner_count() {
            local runner_label="$1"
            jq --arg runner_label "$runner_label" '
              [ .runners[]?
                | select(.status == "online")
                | select(.busy == false)
                | ([.labels[].name | ascii_downcase] // []) as $have
                | select(
                    ($have | index("em-ci")) and
                    ($have | index($runner_label)) and
                    ($have | index("rust-small")) and
                    ($have | index("trusted-pr"))
                  )
              ] | length
            ' "$response"
          }

          idle_cx53="$(idle_runner_count "cx53")"
          idle_cx43="$(idle_runner_count "cx43")"

          echo "idle_cx53=${idle_cx53:-0}"
          echo "idle_cx43=${idle_cx43:-0}"

          if [ "${idle_cx53:-0}" -gt 0 ]; then
            emit "cx53" "cx53_idle" "false" "false"
          elif [ "${idle_cx43:-0}" -gt 0 ]; then
            emit "cx43" "cx43_idle" "false" "false"
          else
            emit "github" "no_idle_runner" "false" "true"
          fi

  rust-small-cx53:
    name: Perl LSP Rust Small on CX53
    needs: route-rust-small
    if: >-
      needs.route-rust-small.result == 'success' &&
      needs.route-rust-small.outputs.target == 'cx53'
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx53, rust-small, trusted-pr]
    timeout-minutes: 60
    env:
      CARGO_HOME: /mnt/ci-cache/cargo-home
      SCCACHE_DIR: /mnt/ci-cache/sccache
      SCCACHE_CACHE_SIZE: 60G
      CARGO_BUILD_JOBS: "12"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /mnt/ci-scratch/perl-lsp-swarm/${{ github.run_id }}-${{ github.run_attempt }}
      RUST_TEST_THREADS: "2"
      TMPDIR: /mnt/ci-scratch/tmp/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Fix workspace ownership (pre-checkout)
        shell: bash
        run: |
          # ripr.yml (and any other Docker-on-CX job) may leave root-owned files
          # in the workspace target/ dir. actions/checkout@v6 cannot clean them
          # (EACCES). Chown back to the host runner user before checkout so the
          # workspace is always in a cleanable state.
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            em-ci-rust:1.95 \
            bash -c "chown -R $(id -u):$(id -g) /workspace/target 2>/dev/null || true" || true

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Preflight disk and toolchain
        shell: bash
        run: |
          set -euo pipefail
          ci-disk-guard /mnt/ci-scratch 100
          ci-disk-guard /mnt/docker 20
          ci-disk-guard /mnt/ci-cache 20
          df -h /mnt/ci-scratch /mnt/docker /mnt/ci-cache || true
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$SCCACHE_DIR"

      - name: Run Rust small lane
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus="14" \
            --memory="28g" \
            -e CARGO_HOME=/cargo-home \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE="$SCCACHE_CACHE_SIZE" \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e CARGO_INCREMENTAL="$CARGO_INCREMENTAL" \
            -e CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            -e CARGO_TARGET_DIR=/target \
            -e RUST_TEST_THREADS="$RUST_TEST_THREADS" \
            -e RUST_BACKTRACE=1 \
            -e CARGO_TERM_COLOR=always \
            -e TMPDIR=/tmp/jobtmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CARGO_HOME:/cargo-home" \
            -v "$SCCACHE_DIR:/sccache" \
            -v "$CARGO_TARGET_DIR:/target" \
            -v "$TMPDIR:/tmp/jobtmp" \
            -w /workspace \
            em-ci-rust:1.95 \
            bash -eu -o pipefail -c '
              rustc --version
              cargo --version
              sccache --version || true
              cargo fetch --locked
              cargo check --workspace --locked
              cargo test --locked -p perl-parser --test semantic_smoke_tests -- --nocapture
              cargo test --locked -p perl-lsp-rs --test lsp_smoke -- --test-threads=1 --nocapture
              sccache --show-stats || true
            '

      - name: Cleanup and final stats
        if: always()
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$TMPDIR:/tmpdir" \
            -v "$CARGO_TARGET_DIR:/target" \
            em-ci-rust:1.95 \
            bash -c 'find /tmpdir /target -mindepth 1 -delete 2>/dev/null || true' || true
          rmdir "$TMPDIR" "$CARGO_TARGET_DIR" 2>/dev/null || true
          df -h /mnt/ci-scratch /mnt/docker /mnt/ci-cache || true

  rust-small-cx43:
    name: Perl LSP Rust Small on CX43
    needs: route-rust-small
    if: >-
      needs.route-rust-small.result == 'success' &&
      needs.route-rust-small.outputs.target == 'cx43'
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-small, trusted-pr]
    timeout-minutes: 75
    env:
      CARGO_HOME: /mnt/ci-cache/cargo-home
      SCCACHE_DIR: /mnt/ci-cache/sccache
      SCCACHE_CACHE_SIZE: 30G
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /mnt/ci-scratch/perl-lsp-swarm/${{ github.run_id }}-${{ github.run_attempt }}
      RUST_TEST_THREADS: "2"
      TMPDIR: /mnt/ci-scratch/tmp/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Fix workspace ownership (pre-checkout)
        shell: bash
        run: |
          # ripr.yml (and any other Docker-on-CX job) may leave root-owned files
          # in the workspace target/ dir. actions/checkout@v6 cannot clean them
          # (EACCES). Chown back to the host runner user before checkout so the
          # workspace is always in a cleanable state.
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            em-ci-rust:1.95 \
            bash -c "chown -R $(id -u):$(id -g) /workspace/target 2>/dev/null || true" || true

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Preflight disk and toolchain
        shell: bash
        run: |
          set -euo pipefail
          ci-disk-guard /mnt/ci-scratch 80
          ci-disk-guard /mnt/docker 15
          ci-disk-guard /mnt/ci-cache 15
          df -h /mnt/ci-scratch /mnt/docker /mnt/ci-cache || true
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$SCCACHE_DIR"

      - name: Run Rust small lane
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus="8" \
            --memory="16g" \
            -e CARGO_HOME=/cargo-home \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE="$SCCACHE_CACHE_SIZE" \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e CARGO_INCREMENTAL="$CARGO_INCREMENTAL" \
            -e CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            -e CARGO_TARGET_DIR=/target \
            -e RUST_TEST_THREADS="$RUST_TEST_THREADS" \
            -e RUST_BACKTRACE=1 \
            -e CARGO_TERM_COLOR=always \
            -e TMPDIR=/tmp/jobtmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CARGO_HOME:/cargo-home" \
            -v "$SCCACHE_DIR:/sccache" \
            -v "$CARGO_TARGET_DIR:/target" \
            -v "$TMPDIR:/tmp/jobtmp" \
            -w /workspace \
            em-ci-rust:1.95 \
            bash -eu -o pipefail -c '
              rustc --version
              cargo --version
              sccache --version || true
              cargo fetch --locked
              cargo check --workspace --locked
              cargo test --locked -p perl-parser --test semantic_smoke_tests -- --nocapture
              cargo test --locked -p perl-lsp-rs --test lsp_smoke -- --test-threads=1 --nocapture
              sccache --show-stats || true
            '

      - name: Cleanup and final stats
        if: always()
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$TMPDIR:/tmpdir" \
            -v "$CARGO_TARGET_DIR:/target" \
            em-ci-rust:1.95 \
            bash -c 'find /tmpdir /target -mindepth 1 -delete 2>/dev/null || true' || true
          rmdir "$TMPDIR" "$CARGO_TARGET_DIR" 2>/dev/null || true
          df -h /mnt/ci-scratch /mnt/docker /mnt/ci-cache || true

  rust-small-github:
    name: Perl LSP Rust Small on GitHub Hosted
    needs: route-rust-small
    if: >-
      needs.route-rust-small.result == 'success' &&
      needs.route-rust-small.outputs.target == 'github' &&
      needs.route-rust-small.outputs.fallback_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: perl-lsp-rust-small-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Rust small lane
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo check --workspace --locked
          git diff --check

  rust-small-result:
    name: Perl LSP Rust Small Result
    needs:
      - route-rust-small
      - rust-small-cx53
      - rust-small-cx43
      - rust-small-github
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate routed result
        shell: bash
        env:
          ROUTE_RESULT: ${{ needs.route-rust-small.result }}
          ROUTER_TARGET: ${{ needs.route-rust-small.outputs.target }}
          ROUTER_REASON: ${{ needs.route-rust-small.outputs.reason }}
          ROUTER_ERROR: ${{ needs.route-rust-small.outputs.error }}
          ROUTER_FALLBACK_ALLOWED: ${{ needs.route-rust-small.outputs.fallback_allowed }}
          CX53_RESULT: ${{ needs.rust-small-cx53.result }}
          CX43_RESULT: ${{ needs.rust-small-cx43.result }}
          GITHUB_RESULT: ${{ needs.rust-small-github.result }}
        run: |
          set -euo pipefail

          echo "route_result=${ROUTE_RESULT:-}"
          echo "router_target=${ROUTER_TARGET:-}"
          echo "router_reason=${ROUTER_REASON:-}"
          echo "router_error=${ROUTER_ERROR:-}"
          echo "router_fallback_allowed=${ROUTER_FALLBACK_ALLOWED:-}"
          echo "cx53_result=${CX53_RESULT:-}"
          echo "cx43_result=${CX43_RESULT:-}"
          echo "github_result=${GITHUB_RESULT:-}"

          {
            echo "### Perl LSP Rust Small Result"
            echo ""
            echo "- route_result: \`${ROUTE_RESULT:-}\`"
            echo "- router_target: \`${ROUTER_TARGET:-}\`"
            echo "- router_reason: \`${ROUTER_REASON:-}\`"
            echo "- router_error: \`${ROUTER_ERROR:-}\`"
            echo "- router_fallback_allowed: \`${ROUTER_FALLBACK_ALLOWED:-}\`"
            echo "- cx53_result: \`${CX53_RESULT:-}\`"
            echo "- cx43_result: \`${CX43_RESULT:-}\`"
            echo "- github_result: \`${GITHUB_RESULT:-}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ROUTE_RESULT" != "success" ]; then
            echo "::error::Router did not complete successfully: $ROUTE_RESULT"
            exit 1
          fi

          case "${ROUTER_TARGET:-}" in
            cx53)
              test "$CX53_RESULT" = "success"
              test "$CX43_RESULT" = "skipped"
              test "$GITHUB_RESULT" = "skipped"
              ;;
            cx43)
              test "$CX43_RESULT" = "success"
              test "$CX53_RESULT" = "skipped"
              test "$GITHUB_RESULT" = "skipped"
              ;;
            github)
              test "$GITHUB_RESULT" = "success"
              test "$CX53_RESULT" = "skipped"
              test "$CX43_RESULT" = "skipped"
              ;;
            none)
              test "$CX53_RESULT" = "skipped"
              test "$CX43_RESULT" = "skipped"
              test "$GITHUB_RESULT" = "skipped"
              echo "::error::No runner route available (reason: ${ROUTER_REASON:-unknown}). Re-run later or use workflow_dispatch force_target=github."
              exit 1
              ;;
            *)
              echo "::error::Unknown router target: ${ROUTER_TARGET:-<empty>}"
              exit 1
              ;;
          esac

          echo "Perl LSP Rust Small Result: success"
