name: Badge Endpoints

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: badge-endpoints-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install ripr
        run: cargo install ripr

      - name: Refresh badge endpoints
        run: cargo xtask badges

      - name: Discard unrelated working tree drift
        shell: bash
        run: |
          set -euo pipefail
          # Earlier steps in this job (toolchain install, `cargo install ripr`,
          # `cargo xtask badges`) have, in practice, left tracked files outside
          # `badges/` showing as modified in the working tree (observed:
          # policy/ub-review.toml) even though nothing in this job's own code
          # writes that file. Whatever the upstream cause, this job's only
          # legitimate payload is the generated JSON under `badges/` -- so
          # make it resilient to any incidental drift rather than let it
          # abort `git checkout -B` in the next step with "local changes
          # would be overwritten".
          echo "::group::git status before drift cleanup"
          git status --porcelain
          echo "::endgroup::"
          git checkout -- . ':!badges'
          git clean -fd -- . ':!badges'
          echo "::group::git status/diff after drift cleanup (should be limited to badges/)"
          git status --porcelain
          git diff -- policy/ub-review.toml
          echo "(empty diff above == policy/ub-review.toml is clean going into the next steps)"
          echo "::endgroup::"

      - name: Reset stale automation branch to avoid a divergent checkout
        shell: bash
        run: |
          set -euo pipefail
          # Root cause of the recurring "local changes to policy/ub-review.toml
          # would be overwritten" failure (#3576): it is NOT this job's working
          # tree. `automation/badge-endpoints` is a long-lived branch that
          # create-pull-request reuses across runs. When it falls behind `main`
          # (it was last touched at 16204f9e4 on 2026-07-03, ~173 commits
          # behind current main -- confirmed via
          # `git diff origin/main origin/automation/badge-endpoints -- policy/ub-review.toml`
          # showing the branch's copy is byte-identical to that old commit and
          # unrelated to main's current copy), create-pull-request's own
          # internal `git checkout automation/badge-endpoints` step brings that
          # stale committed content into the working tree. The very next
          # internal step, `git checkout -B automation/badge-endpoints <base
          # sha>`, then refuses to overwrite it, because git sees the
          # newly-checked-out stale blob as a "local change" relative to the
          # base commit it is about to reset onto.
          #
          # Delete the remote branch before every run so create-pull-request
          # always builds it fresh from the current base. This only recreates
          # the branch (and re-links any existing open PR under the same
          # branch name) when there is an actual badges/ diff to commit; if
          # there is nothing to update, create-pull-request is a no-op and no
          # branch is created at all.
          echo "::group::automation/badge-endpoints before reset"
          git ls-remote origin refs/heads/automation/badge-endpoints || echo "(no remote ref)"
          echo "::endgroup::"
          git push origin --delete automation/badge-endpoints || echo "automation/badge-endpoints did not exist remotely (or delete failed); continuing -- create-pull-request will create it fresh if needed"

      - name: Open badge refresh PR
        id: cpr
        # The repository's Actions settings may disallow the default
        # GITHUB_TOKEN from opening pull requests ("GitHub Actions is not
        # permitted to create or approve pull requests"). Badge regeneration
        # above is the payload that must keep failing loudly; opening the PR
        # is best-effort delivery, so tolerate that permission denial here and
        # surface it as a ::notice:: in the next step instead of turning the
        # whole run red.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/badge-endpoints
          add-paths: badges
          title: "chore(badges): refresh public endpoints (#8820)"
          commit-message: "chore(badges): refresh public endpoints (#8820)"
          body: |
            Refreshes generated Shields endpoint JSON under `badges/`.

            Generated by:

            ```bash
            cargo xtask badges
            ```

      - name: Report badge PR creation failure
        if: steps.cpr.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "::notice title=Badge PR skipped::The badge refresh PR could not be opened."
            echo "::notice::Likely cause: repository Actions settings disallow the GITHUB_TOKEN from creating pull requests ('GitHub Actions is not permitted to create or approve pull requests')."
            echo "::notice::Badges were still regenerated successfully in this run. To restore automated badge PRs, a maintainer can enable 'Allow GitHub Actions to create and approve pull requests' under Settings > Actions > General, or open the PR manually from the badges/ diff."
          }
