name: Badge Endpoints

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: badge-endpoints-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install ripr
        run: cargo install ripr

      - name: Refresh badge endpoints
        run: cargo xtask badges

      - name: Open badge refresh PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/badge-endpoints
          title: "chore(badges): refresh public endpoints (#8820)"
          commit-message: "chore(badges): refresh public endpoints (#8820)"
          body: |
            Refreshes generated Shields endpoint JSON under `badges/`.

            Generated by:

            ```bash
            cargo xtask badges
            ```
