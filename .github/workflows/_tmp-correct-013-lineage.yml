name: Temporary 0.13 lineage correction

on:
  push:
    branches:
      - docs/release-lineage-0.13
    paths:
      - scripts/_correct_013_lineage_tmp.py
      - .github/workflows/_tmp-correct-013-lineage.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v7
        with:
          ref: docs/release-lineage-0.13
          fetch-depth: 0

      - name: Apply guarded changelog correction
        run: python3 scripts/_correct_013_lineage_tmp.py

      - name: Validate final documentation diff
        run: |
          set -euo pipefail
          grep -q '<!-- lineage-correction:0.13 -->' CHANGELOG.md
          grep -q 'Prepared milestone, not a tagged release' CHANGELOG.md
          grep -q 'v0.13.0-rc1...v0.13.1' CHANGELOG.md
          ! grep -q '^## \[0\.13\.0\]' CHANGELOG.md
          grep -q '^tag: null$' docs/releases/v0.13.4.md
          grep -q '^previous_tag: "v0.13.3"$' docs/releases/v0.14.0.md
          grep -q '^previous_tag: "v0.13.0-rc1"$' docs/releases/v0.13.1.md
          grep -q '^## Lineage corrections$' RELEASE_HISTORY.md
          git diff --check

      - name: Remove one-shot machinery
        run: |
          rm scripts/_correct_013_lineage_tmp.py
          rm .github/workflows/_tmp-correct-013-lineage.yml

      - name: Commit final correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(release): correct 0.13 lineage and 0.14 boundary (#9961)'
          git push origin HEAD:refs/heads/docs/release-lineage-0.13
