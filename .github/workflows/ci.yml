name: CI

# Tiered CI for perl-lsp (see tests/TAXONOMY.md)
# - PR smoke: fast feedback on every push (~1-2 min)
# - Merge gate: full validation on every PR push and push to main (~5-10 min)
# Cost: ~$0.05 per PR (smoke + merge gate; see #4675 for rationale)

on:
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, labeled, ready_for_review, converted_to_draft]
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

# Cancel in-flight runs on new pushes (saves minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── PR Smoke: fast feedback for every PR (~1-2 min) ──────────────────
  pr-smoke:
    name: PR Smoke (Fast Feedback)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Install just
        uses: taiki-e/install-action@cf39a74df4a72510be4e5b63348d61067f11e64a  # v2.75.0
        with:
          tool: just

      - name: Auto-fix formatting
        run: |
          cargo xtask fmt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-format with cargo fmt"
            git push
            echo "::notice::Auto-formatted code pushed. CI will re-run."
            exit 0
          fi

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-gate-${{ hashFiles('Cargo.lock') }}

      - name: Run PR smoke checks
        run: |
          just clippy-core
          just test-core

  # ── Merge Gate: full validation on every PR and push to main ─────────
  merge-gate:
    name: CI Gate (Merge-Blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: pr-smoke
    # Run on every PR push and on push to main/master
    # Earlier gating > label-gated gating (see #4675)
    # Frequent commits will churn CI; concurrency group cancels in-flight runs.
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Install just
        uses: taiki-e/install-action@cf39a74df4a72510be4e5b63348d61067f11e64a  # v2.75.0
        with:
          tool: just

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-gate-${{ hashFiles('Cargo.lock') }}

      - name: Run full ci-gate with receipts
        run: just gates

      - name: Upload gate receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-receipt-${{ github.sha }}
          path: |
            target/receipts/receipt.json
            target/receipts/logs/*.log
            target/receipts/artifacts/*
          if-no-files-found: warn
          retention-days: 7

      - name: Dump gate failures on error
        if: failure()
        run: |
          echo "=== receipt.json (tail) ==="
          test -f target/receipts/receipt.json && tail -200 target/receipts/receipt.json || true
          echo "=== failed gates ==="
          python3 - <<'PY' || true
          import json, pathlib
          p = pathlib.Path("target/receipts/receipt.json")
          if not p.exists(): raise SystemExit(0)
          data = json.loads(p.read_text())
          for g in data.get("gates", []):
              if str(g.get("status", "")).lower() not in ("passed", "pass", "skipped", "skip"):
                  print(f"- {g.get('gate_name', g.get('name', '<unnamed>'))}: {g.get('status', '')} (exit {g.get('exit_code', '?')})")
          PY

      - name: Gate summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt_path = Path("target/receipts/receipt.json")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if not summary_path:
              raise SystemExit(0)

          lines = ["### CI Gate Receipt", ""]
          if not receipt_path.exists():
              lines.append("Receipt not found.")
              Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
              raise SystemExit(0)

          data = json.loads(receipt_path.read_text(encoding="utf-8"))
          md = data.get("metadata", {})
          lines.append(f"Generated: {md.get('timestamp', data.get('generated_at', ''))}")
          lines.append(f"Commit: {md.get('git_sha_short', data.get('commit', ''))}")
          lines.append("")
          lines.append("| Gate | Status | Exit | Duration (s) |")
          lines.append("| --- | --- | --- | --- |")
          for gate in data.get("gates", []):
              gate_label = gate.get('gate_name', gate.get('name', ''))
              dur_ms = gate.get('duration_ms')
              dur_s = f"{dur_ms / 1000:.1f}" if dur_ms is not None else str(gate.get('duration_seconds', ''))
              lines.append(
                  f"| {gate_label} | {gate.get('status', '')} | "
                  f"{gate.get('exit_code', '')} | {dur_s} |"
              )

          Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Set PR status (check)
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let status = 'success';
            let description = 'All checks passed';

            if (!fs.existsSync('target/receipts/receipt.json')) {
              status = 'failure';
              description = 'Gate receipt not found';
            } else {
              const data = JSON.parse(fs.readFileSync('target/receipts/receipt.json', 'utf8'));
              const ok = s => ['passed', 'pass', 'skipped', 'skip'].includes(String(s || '').toLowerCase());
              const failedGates = (data.gates || []).filter(g => !ok(g.status));
              if (failedGates.length > 0) {
                status = 'failure';
                description = `${failedGates.length} gate(s) failed: ${failedGates.map(g => g.gate_name || g.name || '<unnamed>').join(', ')}`;
              }
            }

            console.log(`Setting PR status to: ${status}`);
            console.log(`Description: ${description}`);

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status,
              context: 'ci/merge-gate',
              description,
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            });

  # ── UX Tests: first-5-minutes scenario regression suite ──────────────
  ux-tests:
    name: UX Regression Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: pr-smoke
    # Run on every PR push — this is the regression prevention gate.
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-ux-tests-${{ hashFiles('Cargo.lock') }}

      - name: Build perl-lsp binary
        run: cargo build -p perl-lsp-rs

      - name: Run UX regression tests
        env:
          PERL_LSP_BIN: ${{ github.workspace }}/target/debug/perl-lsp
          RUST_TEST_THREADS: "1"
        run: just ux-tests
