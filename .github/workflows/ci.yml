name: CI

# Tiered CI for perl-lsp (see tests/TAXONOMY.md)
# - PR smoke: fast feedback on every push (~1-2 min)
# - Merge gate: full validation on every PR push and push to main (~5-10 min)
# Cost: ~$0.05 per PR (smoke + merge gate; see #4675 for rationale)

on:
  pull_request:
    branches: [ main, master ]
    # Deliberately exclude `labeled` / `unlabeled` — every label-add (e.g., applying
    # `ci-green`, `merge-ready`, pipeline sign-off labels) would trigger a fresh CI run
    # that cancels the prior in-progress run (see `cancel-in-progress` below). This
    # caused a cascade observed across ~20 admin-merges: each pipeline label applied by
    # agents killed the running CI, restarting from scratch and eating minutes of compute
    # per label. The merge-ready-reconciler.yml applies the same exclusion for the same
    # reason (infinite-loop guard). `ready_for_review` and `converted_to_draft` are kept
    # because they change the draft-pr-check guard behavior and must trigger CI.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group: {}
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

# Cancel in-progress runs for PR events on new pushes; let push/merge_group runs complete.
# The preflight SHA-staleness check provides additional skip logic for superseded SHAs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  draft-pr-check:
    name: Draft PR guard
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      run_ci: ${{ steps.guard.outputs.run_ci }}
    steps:
      - name: Decide whether full CI should run
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Non-PR event detected — running full CI"
          elif [[ ",${{ join(github.event.pull_request.labels.*.name, ',') }}," == *",full-ci,"* ]]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR has full-ci label — running full CI"
          elif [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Draft PR detected — skipping CI jobs until ready for review"
          else
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR default lane is EM routed CI; legacy CI requires full-ci label"
          fi

  # ── Preflight: skip superseded SHAs to save cost ─────────────────────
  preflight-latest-check:
    name: Preflight — is this SHA latest?
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: draft-pr-check
    if: needs.draft-pr-check.outputs.run_ci == 'true'
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - name: Check if this SHA is latest on the ref
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          CURRENT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          LATEST=$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "refs/heads/${BRANCH}" | awk '{print $1}')
          if [ -z "$LATEST" ] || [ "$LATEST" = "$CURRENT" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This SHA ($CURRENT) is latest on $BRANCH — running full CI"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded by $LATEST — skipping remaining jobs to save cost"
          fi

  # ── Conflict-marker guard: <1s, no toolchain needed ─────────────────
  # Prevents committed conflict markers reaching master (see #7183).
  # Two incidents on 2026-04-28 each cost 1-3h of orchestrator + builder time.
  conflict-markers:
    name: Conflict marker check
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
      - name: Check for conflict markers
        run: |
          matches=$(git ls-files -z | xargs -0 grep -lP '^(<{7} |>{7} |={7}$)' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "❌ Conflict markers found in committed files:"
            echo "$matches"
            echo ""
            echo "Run: grep -rn -P '^(<{7} |>{7} |={7}\$)' \$(git ls-files)"
            echo "to locate exact lines, then resolve and re-commit."
            exit 1
          fi
          echo "✅ No conflict markers found"

  # ── PR Smoke: fast feedback for every PR (~1-2 min) ──────────────────
  pr-smoke:
    name: PR Smoke (Fast Feedback)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
          # Fetch full history so ci-scope can diff against the explicit PR-fast base.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install just
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4  # v2.79.7
        with:
          tool: just

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-gate-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Warm xtask
        run: cargo build -p xtask --locked

      - name: Run PR-fast via shared xtask gate runner
        run: |
          set +e
          echo "PR-fast timeout policy: GitHub job 35m, outer runner watchdog 30m, per-gate timeouts recorded in target/receipts/receipt.json"
          timeout --signal=TERM --kill-after=60s 1800s ./target/debug/xtask gates --tier pr-fast --base origin/master --receipt
          status=$?
          case "$status" in
            124)
              echo "::error::PR-fast hit the 30m runner watchdog before xtask produced a final receipt"
              ;;
            137|143)
              echo "::error::PR-fast was cancelled by the runner or process group (exit $status)"
              ;;
          esac
          exit "$status"

      - name: Upload PR-fast receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-fast-receipt-${{ github.sha }}
          path: |
            target/receipts/receipt.json
            target/receipts/logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Convert PR-fast receipt to JUnit
        if: always()
        run: |
          python3 scripts/ci/receipts-to-junit.py \
            --input target/receipts/receipt.json \
            --output target/test-results/pr-fast-junit.xml \
            --suite-name pr-fast

      - name: Upload PR-fast test results to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/test-results/pr-fast-junit.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Note: workspace-wide integration-test compilation is covered by the
      # parallel check-all-targets job (just check-all-targets), which runs
      # cargo check --workspace --all-targets --locked independently of pr-smoke.
      # Adding a redundant fallback here would duplicate that work without gain.

  # ── Merge Gate shards: bounded validation lanes for every PR/push ────
  merge-gate-shards:
    name: CI Gate shard (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No functional dependency on pr-smoke output; run in parallel after preflight
    # + conflict guard to reduce end-to-end merge-gate wall time.
    needs: [draft-pr-check, conflict-markers, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: meta
            gates: fmt check_conflict_markers release_history readme_heading_check publish_closure publish_manifest_check layer_check published_crate_count_pr_fast release_history_check perl_token_leaf_contract clippy_full
          - name: foundation
            gates: unit_foundation_full
          - name: analysis
            gates: unit_analysis_full
          - name: lsp
            gates: unit_lsp_full lsp_smoke
          - name: support
            gates: unit_dap_support_full
          - name: corpus
            gates: common_corpus_clean
          - name: policy
            gates: docs_build v2_bundle_sync nested_lock_check published_crate_count
    permissions:
      contents: read
    # Run on every PR push and on push to main/master
    # Earlier gating > label-gated gating (see #4675)
    # Frequent commits will queue; preflight skips superseded SHAs.
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install just
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4  # v2.79.7
        with:
          tool: just

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-gate-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Warm xtask
        run: cargo build -p xtask --locked

      - name: Run merge-gate shard with receipts
        shell: bash
        run: |
          set -euo pipefail
          (
            while true; do
              sleep 30
              printf 'ci-gate shard %s still running at %s\n' "${{ matrix.name }}" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          mkdir -p target/receipts/shards
          for gate in ${{ matrix.gates }}; do
            printf '::group::gate %s\n' "$gate"
            cargo xtask gates --gate "$gate" --receipt --receipt-path "target/receipts/shards/${gate}.json"
            printf '::endgroup::\n'
          done

      - name: Upload gate receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-receipt-${{ matrix.name }}-${{ github.sha }}
          path: |
            target/receipts/shards/*.json
            target/receipts/logs/*.log
            target/receipts/artifacts/*
          if-no-files-found: warn
          retention-days: 7

      - name: Convert gate shard receipts to JUnit
        if: always()
        run: |
          python3 scripts/ci/receipts-to-junit.py \
            --input target/receipts/shards \
            --output target/test-results/gate-shard-${{ matrix.name }}-junit.xml \
            --suite-name "gate-${{ matrix.name }}"

      - name: Emit CI actuals (LEM telemetry)
        # Reads gate receipts produced above and writes target/ci/ci-actuals.json
        # for the calibration pipeline. See docs/ci/ci-actuals.md and
        # docs/ci/learned-estimates.md. Tolerant of missing data.
        if: always()
        continue-on-error: true
        run: |
          mkdir -p target/ci
          python3 scripts/ci/emit_ci_actuals.py \
            --receipts-dir target/receipts/shards \
            --workflow "${{ github.workflow }}" \
            --sha "${{ github.sha }}" \
            --pr "${{ github.event.pull_request.number || 0 }}" \
            --json-out "target/ci/ci-actuals-${{ matrix.name }}.json" || true

      - name: Upload CI actuals
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-actuals-${{ matrix.name }}-${{ github.sha }}
          path: target/ci/ci-actuals-${{ matrix.name }}.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload gate shard test results to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/test-results/gate-shard-${{ matrix.name }}-junit.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Dump gate failures on error
        if: failure()
        run: |
          echo "=== receipt.json (tail) ==="
          find target/receipts/shards -name '*.json' -maxdepth 1 -print -exec tail -120 {} \; || true
          echo "=== failed gates ==="
          python3 - <<'PY' || true
          import json, pathlib
          for p in pathlib.Path("target/receipts/shards").glob("*.json"):
              data = json.loads(p.read_text())
              for g in data.get("gates", []):
                  if str(g.get("status", "")).lower() not in ("passed", "pass", "skipped", "skip"):
                      print(f"- {p.name}: {g.get('gate_name', g.get('name', '<unnamed>'))}: {g.get('status', '')} (exit {g.get('exit_code', '?')})")
          PY

      - name: Gate summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt_paths = sorted(Path("target/receipts/shards").glob("*.json"))
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if not summary_path:
              raise SystemExit(0)

          lines = [f"### CI Gate shard: {os.environ.get('SHARD_NAME', '')}", ""]
          if not receipt_paths:
              lines.append("Receipt not found.")
              Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
              raise SystemExit(0)

          lines.append("| Gate | Status | Exit | Duration (s) |")
          lines.append("| --- | --- | --- | --- |")
          for receipt_path in receipt_paths:
              data = json.loads(receipt_path.read_text(encoding="utf-8"))
              for gate in data.get("gates", []):
                  gate_label = gate.get('gate_name', gate.get('name', ''))
                  dur_ms = gate.get('duration_ms')
                  dur_s = f"{dur_ms / 1000:.1f}" if dur_ms is not None else str(gate.get('duration_seconds', ''))
                  lines.append(
                      f"| {gate_label} | {gate.get('status', '')} | "
                      f"{gate.get('exit_code', '')} | {dur_s} |"
                  )

          Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
        env:
          SHARD_NAME: ${{ matrix.name }}

  # ── Merge Gate: aggregate shard and required job status ───────────────
  merge-gate:
    name: CI Gate (Merge-Blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs:
      - draft-pr-check
      - preflight-latest-check
      - pr-smoke
      - conflict-markers
      - check-all-targets
      - ux-tests
      - windows-required
      - merge-gate-shards
    if: always() && needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    permissions:
      statuses: write
    steps:
      - name: Gate summary
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          needs = json.loads(os.environ["NEEDS_JSON"])
          lines = ["### CI Gate aggregate", ""]
          lines.append("| Dependency | Result |")
          lines.append("| --- | --- |")
          failed = []
          for name, value in sorted(needs.items()):
              result = value.get("result", "")
              lines.append(f"| {name} | {result} |")
              if result != "success":
                  failed.append(name)

          if failed:
              lines.extend(["", f"Blocking dependency failure(s): {', '.join(failed)}"])
          else:
              lines.extend(["", "All merge-gate dependencies passed."])

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")

          if failed:
              raise SystemExit(1)
          PY

      - name: Set PR status (check)
        if: always()
        uses: actions/github-script@v9
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS_JSON || '{}');
            const failed = Object.entries(needs)
              .filter(([name, value]) => value.result !== 'success')
              .map(([name]) => name);
            const status = failed.length === 0 ? 'success' : 'failure';
            const description = failed.length === 0
              ? 'All merge-gate dependencies passed'
              : `Failed dependency: ${failed.join(', ')}`;

            console.log(`Setting PR status to: ${status}`);
            console.log(`Description: ${description}`);

            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: status,
                context: 'ci/merge-gate',
                description,
                target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              });
            } catch (error) {
              if (error.status === 403) {
                core.warning(`Could not create ci/merge-gate commit status from this workflow context: ${error.message}`);
              } else {
                throw error;
              }
            }

  # ── UX Tests: first-5-minutes scenario regression suite ──────────────
  ux-tests:
    name: UX Regression Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # UX suite does not consume pr-smoke artifacts/results; parallelize after preflight.
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    # Run on every PR push — this is the regression prevention gate.
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Install just
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4  # v2.79.7
        with:
          tool: just

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-ux-tests-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Build perl-lsp binary
        run: cargo build -p perl-lsp-rs

      - name: Run UX regression tests
        id: ux_tests
        continue-on-error: true
        env:
          PERL_LSP_BIN: ${{ github.workspace }}/target/debug/perl-lsp
          RUST_TEST_THREADS: "1"
        run: |
          mkdir -p target/receipts
          just ux-tests 2>&1 | tee target/receipts/ux-regression.log
          exit ${PIPESTATUS[0]}

      - name: Emit UX regression receipt
        if: always()
        run: |
          cargo xtask ux-regression-receipt \
            --input target/receipts/ux-regression.log \
            --receipt target/receipts/ux-regression.json \
            --sha "${{ github.sha }}"

      - name: Upload UX regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ux-regression-receipt-${{ github.sha }}
          path: |
            target/receipts/ux-regression.json
            target/receipts/ux-regression.log
          if-no-files-found: warn
          retention-days: 7

      - name: Convert UX regression receipt to JUnit
        if: always()
        run: |
          python3 scripts/ci/receipts-to-junit.py \
            --input target/receipts/ux-regression.json \
            --output target/test-results/ux-regression-junit.xml \
            --suite-name ux-regression

      - name: Upload UX regression test results to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/test-results/ux-regression-junit.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: UX regression summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          receipt_path = Path("target/receipts/ux-regression.json")
          log_path = Path("target/receipts/ux-regression.log")
          lines = ["### UX Regression Receipt", ""]
          lines.append(f"- Receipt: `{receipt_path}`")
          lines.append(f"- Log: `{log_path}`")

          if receipt_path.exists():
              data = json.loads(receipt_path.read_text(encoding="utf-8"))
              lines.append(f"- Result: `{data.get('result', 'unknown')}`")
              if data.get("failure_class"):
                  lines.append(f"- Failure class: `{data.get('failure_class')}`")
              if data.get("route"):
                  lines.append(f"- Route: `{data.get('route')}`")
              if data.get("merge_action"):
                  lines.append(f"- Merge action: `{data.get('merge_action')}`")
              if data.get("first_failing_test"):
                  lines.append(f"- First failing test: `{data.get('first_failing_test')}`")
              if data.get("first_failing_line"):
                  lines.append(f"- First failing line: `{data.get('first_failing_line')}`")
              if data.get("canonical_repro"):
                  lines.append(f"- Repro: `{data.get('canonical_repro')}`")
              if data.get("human_summary"):
                  lines.append(f"- Summary: {data.get('human_summary')}")
          else:
              lines.append("- Receipt unavailable.")

          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Fail UX regression gate on test failures
        if: steps.ux_tests.outcome == 'failure'
        run: exit 1

  # ── Compile All Targets: catch integration-test + bench bit-rot ───────
  check-all-targets:
    name: Compile All Targets (bit-rot guard)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Install just
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4  # v2.79.7
        with:
          tool: just

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-all-targets-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Compile all targets (catches integration-test + bench bit-rot)
        run: just check-all-targets

  lsp-memory-smoke:
    name: LSP Memory Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-lsp-memory-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Build perl-lsp release binary
        run: cargo build --release -p perl-lsp-rs --bin perl-lsp --locked

      - name: Run document-churn memory smoke
        run: |
          mkdir -p target/memory
          N_FILES=75 \
          N_CHANGES=5 \
          DO_WORKSPACE_SYMBOL=0 \
          DELETE_AFTER_CLOSE=1 \
          BINARY=./target/release/perl-lsp \
          python3 scripts/repro_lsp_storm.py \
            --json-out target/memory/pr-smoke-doc-churn.json \
            --csv-out target/memory/pr-smoke-doc-churn.csv \
            --settle-seconds 1 \
            --server-stderr target/memory/pr-smoke-doc-churn.server.log
          set +e
          python3 scripts/assert_rss_plateau.py \
            target/memory/pr-smoke-doc-churn.json \
            --summary-out target/memory/pr-smoke-doc-churn.plateau.json \
            --loose
          PLATEAU_STATUS=$?
          set -e
          case "$GITHUB_EVENT_NAME" in
            pull_request) RECEIPT_EVENT=pull_request ;;
            merge_group) RECEIPT_EVENT=merge_group ;;
            *) RECEIPT_EVENT=push ;;
          esac
          cargo xtask metrics memory \
            --workload-json target/memory/pr-smoke-doc-churn.json \
            --plateau-json target/memory/pr-smoke-doc-churn.plateau.json \
            --scenario lsp_doc_churn_delete_smoke \
            --receipt target/memory/receipts/pr-smoke-doc-churn.receipt.json \
            --commit "$GITHUB_SHA" \
            --event "$RECEIPT_EVENT" \
            --markdown >> "$GITHUB_STEP_SUMMARY"
          cargo xtask gate-receipts validate target/memory/receipts/pr-smoke-doc-churn.receipt.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              raise SystemExit(0)

          plateau = json.loads(Path("target/memory/pr-smoke-doc-churn.plateau.json").read_text())
          payload = json.loads(Path("target/memory/pr-smoke-doc-churn.json").read_text())
          result = "passed" if plateau["passed"] else "failed"

          with open(summary_path, "a", encoding="utf-8") as fh:
              fh.write("## LSP memory smoke\n\n")
              fh.write("| Workload | Files | Tail growth KB | Median tail slope KB/file | Result |\n")
              fh.write("| --- | ---: | ---: | ---: | --- |\n")
              fh.write(
                  "| doc churn + delete "
                  f"| {payload['n_files']} "
                  f"| {plateau['tail_growth_kb']} "
                  f"| {plateau['median_tail_slope_kb_per_file']} "
                  f"| {result} |\n"
              )
          PY
          exit "$PLATEAU_STATUS"

      - name: Upload memory smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lsp-memory-smoke-${{ github.sha }}
          path: |
            target/memory/pr-smoke-doc-churn.json
            target/memory/pr-smoke-doc-churn.csv
            target/memory/pr-smoke-doc-churn.plateau.json
            target/memory/pr-smoke-doc-churn.server.log
            target/memory/receipts/pr-smoke-doc-churn.receipt.json
          if-no-files-found: warn
          retention-days: 14

  # ── Windows scope: decide whether the native Windows canary is needed ─
  # Cheap Ubuntu job that diffs against master and decides whether the
  # diff plausibly affects Windows-specific behavior. Default for normal
  # PRs is to skip the native Windows runner entirely and let the Linux
  # cross-target compile check + tests cover the surface.
  windows-scope:
    name: Windows scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    outputs:
      required: ${{ steps.scope.outputs.required }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Decide Windows scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          # On non-PR events (push to master, schedule, manual dispatch),
          # always run the canary and the full guardrails.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Non-PR event — Windows canary + full guardrails required"
            exit 0
          fi

          # Diff against the PR base; fall back to origin/master.
          base_ref="${{ github.event.pull_request.base.ref }}"
          if [ -n "$base_ref" ]; then
            git fetch --no-tags --depth=200 origin "$base_ref" || true
            base="origin/$base_ref"
          else
            git fetch --no-tags --depth=200 origin master || true
            base="origin/master"
          fi

          changed="$(git diff --name-only "$base"...HEAD || true)"
          echo "Changed files vs $base:"
          echo "$changed"

          required=false
          full=false

          # Windows-sensitive code paths (sandbox, module path resolution,
          # workspace discovery, URI handling).
          if echo "$changed" | grep -E '^(crates/perl-lsp-rs/src/security/sandbox\.rs|crates/perl-module/|crates/perl-workspace/|crates/perl-uri/)' >/dev/null; then
            required=true
          fi

          # Toolchain / workflow / lockfile / CI-policy changes can shift
          # Windows behavior in ways the diff alone won't reveal — promote
          # to full. Cargo.toml is anchored to the workspace root only;
          # per-crate Cargo.toml files are treated as ordinary code changes.
          if echo "$changed" | grep -E '(^\.github/workflows/|^\.ci/|^Cargo\.lock$|^Cargo\.toml$|^rust-toolchain\.toml$|^justfile$)' >/dev/null; then
            required=true
            full=true
          fi

          # Generic Windows-sensitive heuristic across other crates. Match
          # path basenames (segments) rather than substrings so PRs that
          # merely happen to mention these tokens inside an unrelated file
          # path don't get pulled in.
          if echo "$changed" | awk -F/ '{ print $NF }' \
              | grep -E '(^|[._-])(uri|path|module|workspace-folder|file_uri|windows|separator|canonicalize|sandbox)([._-]|$)' >/dev/null; then
            required=true
          fi

          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "::notice::windows-scope: required=$required full=$full"

  # ── Windows Canary: tiny native dispatch check ───────────────────────
  # Proves the Windows-only code path (currently sandbox fail-closed) is
  # still wired. Runs only when windows-scope says required=true.
  windows-canary:
    name: Windows Canary
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [draft-pr-check, preflight-latest-check, windows-scope]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true' && needs.windows-scope.outputs.required == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-windows-canary-${{ hashFiles('Cargo.lock') }}

      - name: Run sandbox fail-closed canary
        shell: bash
        run: |
          cargo test --locked --lib -p perl-lsp-rs \
            security::sandbox::tests::test_windows_sandbox_fails_closed \
            -- --exact

  # ── Windows Required: Ubuntu aggregator consumed by merge-gate ──────
  # Skipped together with the rest of CI on draft PRs / superseded SHAs
  # (same gate as merge-gate). Otherwise always runs: succeeds when the
  # canary isn't needed, fails when the canary was required but didn't
  # pass, and fails closed if windows-scope itself errored out (so a
  # broken scope doesn't slip through as a green required check).
  windows-required:
    name: Windows Required
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [draft-pr-check, preflight-latest-check, windows-scope, windows-canary]
    if: always() && needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    steps:
      - name: Summarize Windows requirement
        shell: bash
        run: |
          scope_result='${{ needs.windows-scope.result }}'
          if [ "$scope_result" != "success" ]; then
            echo "::error::windows-scope did not succeed (result=$scope_result); failing closed."
            exit 1
          fi

          required='${{ needs.windows-scope.outputs.required }}'
          result='${{ needs.windows-canary.result }}'

          if [ "$required" != "true" ]; then
            echo "::notice::Windows canary not required for this diff."
            exit 0
          fi

          if [ "$result" = "success" ]; then
            echo "::notice::Windows canary passed."
            exit 0
          fi

          echo "::error::Windows canary required but result was: $result"
          exit 1

  # ── Windows Full Guardrails: advisory / risk-triggered ──────────────
  # The old broad Windows matrix. Runs on push to master, manual
  # dispatch, and PRs that windows-scope flagged as full=true
  # (workflow/toolchain/lockfile changes). Not a merge-gate dependency
  # for normal PRs — the cheap Linux cross-target check + windows-canary
  # cover the universal slow lane, and this lane catches the rest.
  # (Nightly Windows soak runs are owned by ci-nightly.yml, not here.)
  windows-full-guardrails:
    name: Windows Full Guardrails (${{ matrix.lane.name }})
    runs-on: windows-latest
    timeout-minutes: 35
    needs: [draft-pr-check, preflight-latest-check, windows-scope]
    if: |
      always()
      && needs.draft-pr-check.outputs.run_ci == 'true'
      && needs.preflight-latest-check.outputs.is_latest == 'true'
      && (github.event_name != 'pull_request' || needs.windows-scope.outputs.full == 'true')
    strategy:
      fail-fast: false
      matrix:
        lane:
          - name: compile
            command: >-
              cargo check --locked --all-targets
              -p perl-module
              -p perl-lsp-rs
              -p perl-workspace
          - name: module-separator-regressions
            command: >-
              cargo test --locked -p perl-module
              --test path_comprehensive_unit_tests
              --test module_resolution_use_require
          - name: sandbox-fail-closed
            command: >-
              cargo test --locked --lib -p perl-lsp-rs
              security::sandbox::tests::test_windows_sandbox_fails_closed
              -- --exact
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-windows-full-${{ hashFiles('Cargo.lock') }}-${{ matrix.lane.name }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Run Windows full guardrail lane
        shell: bash
        run: ${{ matrix.lane.command }}
