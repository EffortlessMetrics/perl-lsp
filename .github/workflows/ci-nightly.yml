name: CI (Nightly)

# Consolidated workflow for comprehensive nightly tests and label-gated jobs
# Combines: ci-expensive.yml, quality-checks.yml, fuzz.yml
# Cost: ~$0.15 per run (label-gated), ~$0.30 per nightly run

on:
  pull_request:
    branches: [ main, master ]
    # Keep label-gated jobs alive after the label is applied.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  schedule:
    # Run nightly at 3am UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run_mutation:
        description: 'Run mutation testing'
        required: false
        type: boolean
        default: true
      run_benchmarks:
        description: 'Run performance benchmarks'
        required: false
        type: boolean
        default: true
      run_real_repo_latency:
        description: 'Run real-repo latency suite'
        required: false
        type: boolean
        default: true
      run_coverage:
        description: 'Run test coverage'
        required: false
        type: boolean
        default: true
      run_fuzz:
        description: 'Run fuzz testing'
        required: false
        type: boolean
        default: true
      run_memory:
        description: 'Run LSP memory plateau workloads'
        required: false
        type: boolean
        default: true

# Cancel in-flight runs on new pushes (saves minutes)
concurrency:
  group: ci-nightly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  # ============================================================================
  # Label-Gated Jobs (run on PR with specific labels)
  # ============================================================================

  mutation:
    name: Mutation Testing
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mutation != 'false') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:mutation'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with: { toolchain: 1.92.0 }
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          key: ${{ runner.os }}-mutation-${{ hashFiles('Cargo.lock') }}
      - run: cargo install cargo-mutants --locked || true
      - run: cargo mutants --timeout 60 --no-shuffle || true
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-results-${{ github.sha }}
          path: mutants.out/mutants.json
          retention-days: 30

  benchmark:
    name: Performance Benchmarks
    timeout-minutes: 45
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'ci:bench')
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
      with:
        toolchain: stable

    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      with:
        key: ${{ runner.os }}-bench-${{ hashFiles('Cargo.lock') }}
        cache-on-failure: true

    - name: Install just
      uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4  # v2.79.7
      with:
        tool: just

    - name: Build perl-lsp binary for real-repo UX perf lane
      run: cargo build -p perl-lsp-rs --bin perl-lsp --locked

    - name: Run real-repo first-diagnostics perf lane
      run: |
        mkdir -p benchmarks/results
        PERL_LSP_BIN="${{ github.workspace }}/target/debug/perl-lsp" \
          cargo test -p perl-lsp-ux-tests --features integration-test \
          --test ux_scenario_18_real_repo_perf -- --test-threads=1 --nocapture \
          2>&1 | tee benchmarks/results/real-repo-perf.txt

    - name: Run benchmarks
      run: |
        # Run full benchmark suite
        cargo bench --workspace --locked -- --noplot 2>&1 | tee benchmarks/results/raw-output.txt || true

        # Extract structured results from Criterion
        python3 ./benchmarks/scripts/extract-criterion.py --output benchmarks/results/latest.json

    - name: Real-repo first-diagnostics perf gate (Catalyst 5000+ lines)
      run: |
        cargo test -p perl-lsp-rs --test real_project_latency \
          real_project_first_diagnostics_catalyst_5000_lines_under_5s \
          -- --include-ignored --nocapture

    - name: Compare against baseline
      id: compare
      continue-on-error: true
      run: |
        LATEST_BASELINE=$(ls -t benchmarks/baselines/v*.json 2>/dev/null | head -1)
        if [ -n "$LATEST_BASELINE" ]; then
          ./benchmarks/scripts/compare.sh --fail-on-regression 2>&1 | tee comparison.txt
          echo "REGRESSION=$?" >> $GITHUB_OUTPUT
        else
          echo "No baseline found, skipping comparison"
          echo "REGRESSION=0" >> $GITHUB_OUTPUT
        fi

    - name: Generate benchmark receipt
      run: |
        python3 ./benchmarks/scripts/format-results.py benchmarks/results/latest.json --receipt > benchmark_receipt.txt
        cat benchmark_receipt.txt

    - name: Generate markdown report
      run: |
        python3 ./benchmarks/scripts/format-results.py benchmarks/results/latest.json --markdown > benchmark_report.md

    - name: Generate performance alerts
      id: alert
      continue-on-error: true
      run: |
        LATEST_BASELINE=$(ls -t benchmarks/baselines/v*.json 2>/dev/null | head -1)
        if [ -n "$LATEST_BASELINE" ]; then
          python3 ./benchmarks/scripts/alert.py --format markdown > alert.md
          python3 ./benchmarks/scripts/alert.py --check 2>&1
          echo "CRITICAL=$?" >> $GITHUB_OUTPUT
        else
          echo "No baseline found, skipping alerts"
          echo "CRITICAL=0" >> $GITHUB_OUTPUT
        fi

    - name: Comment on PR (performance alerts)
      if: github.event_name == 'pull_request' && (steps.compare.outputs.REGRESSION == '1' || steps.alert.outputs.CRITICAL != '')
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          let body = '';

          if (fs.existsSync('alert.md')) {
            body = fs.readFileSync('alert.md', 'utf8');
          } else if (fs.existsSync('comparison.txt')) {
            const comparison = fs.readFileSync('comparison.txt', 'utf8');
            body = `## Performance Regression Detected\n\n\`\`\`\n${comparison}\n\`\`\`\n\nPlease review the benchmark results and address any performance regressions.`;
          }

          if (body) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }

    - name: Upload benchmark artifacts
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-${{ github.sha }}
        path: |
          benchmarks/results/latest.json
          benchmarks/results/raw-output.txt
          benchmarks/results/real-repo-perf.txt
          benchmark_receipt.txt
          benchmark_report.md
          comparison.txt
          alert.md
        retention-days: 30

  real-repo-latency:
    name: Real-Repo Latency (Catalyst 5K Diagnostics)
    timeout-minutes: 30
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_real_repo_latency != 'false') ||
      (github.event_name == 'pull_request' &&
       (contains(github.event.pull_request.labels.*.name, 'ci:bench') ||
        contains(github.event.pull_request.labels.*.name, 'ci:real-repo-latency')))
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
      with:
        toolchain: stable

    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      with:
        key: ${{ runner.os }}-real-repo-latency-${{ hashFiles('Cargo.lock') }}
        cache-on-failure: true

    - name: Run real project latency suite
      env:
        PERL_LSP_FIRST_DIAGNOSTICS_BUDGET_MS: "5000"
      run: |
        cargo test -p perl-lsp-rs --test real_project_latency full_suite -- --include-ignored --nocapture

    - name: Upload real-repo latency artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: real-project-latency-${{ github.sha }}
        path: |
          .ci/metrics/real_project_latency.json
        retention-days: 30

  lsp-memory-plateau:
    name: LSP Memory Plateau
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_memory != 'false') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:memory'))
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: nightly-lsp-memory-${{ hashFiles('Cargo.lock') }}

      - name: Build perl-lsp release binary
        run: cargo build --release -p perl-lsp-rs --bin perl-lsp --locked

      - name: Run document-churn plateau workload
        run: |
          mkdir -p target/memory
          N_FILES=500 \
          N_CHANGES=10 \
          DO_WORKSPACE_SYMBOL=0 \
          DELETE_AFTER_CLOSE=1 \
          BINARY=./target/release/perl-lsp \
          python3 scripts/repro_lsp_storm.py \
            --json-out target/memory/nightly-doc-churn.json \
            --csv-out target/memory/nightly-doc-churn.csv \
            --settle-seconds 3 \
            --server-stderr target/memory/nightly-doc-churn.server.log
          set +e
          python3 scripts/assert_rss_plateau.py \
            target/memory/nightly-doc-churn.json \
            --summary-out target/memory/nightly-doc-churn.plateau.json
          PLATEAU_STATUS=$?
          set -e
          case "$GITHUB_EVENT_NAME" in
            pull_request) RECEIPT_EVENT=pull_request ;;
            merge_group) RECEIPT_EVENT=merge_group ;;
            *) RECEIPT_EVENT=push ;;
          esac
          cargo xtask metrics memory \
            --workload-json target/memory/nightly-doc-churn.json \
            --plateau-json target/memory/nightly-doc-churn.plateau.json \
            --scenario lsp_doc_churn_delete \
            --receipt target/memory/receipts/nightly-doc-churn.receipt.json \
            --commit "$GITHUB_SHA" \
            --event "$RECEIPT_EVENT" \
            --markdown >> "$GITHUB_STEP_SUMMARY"
          cargo xtask gate-receipts validate target/memory/receipts/nightly-doc-churn.receipt.json
          exit "$PLATEAU_STATUS"

      - name: Run workspace-symbol plateau workload
        run: |
          N_FILES=300 \
          N_CHANGES=10 \
          DO_WORKSPACE_SYMBOL=1 \
          DELETE_AFTER_CLOSE=1 \
          BINARY=./target/release/perl-lsp \
          python3 scripts/repro_lsp_storm.py \
            --json-out target/memory/nightly-workspace-symbol.json \
            --csv-out target/memory/nightly-workspace-symbol.csv \
            --settle-seconds 3 \
            --server-stderr target/memory/nightly-workspace-symbol.server.log
          set +e
          python3 scripts/assert_rss_plateau.py \
            target/memory/nightly-workspace-symbol.json \
            --summary-out target/memory/nightly-workspace-symbol.plateau.json
          PLATEAU_STATUS=$?
          set -e
          case "$GITHUB_EVENT_NAME" in
            pull_request) RECEIPT_EVENT=pull_request ;;
            merge_group) RECEIPT_EVENT=merge_group ;;
            *) RECEIPT_EVENT=push ;;
          esac
          cargo xtask metrics memory \
            --workload-json target/memory/nightly-workspace-symbol.json \
            --plateau-json target/memory/nightly-workspace-symbol.plateau.json \
            --scenario lsp_workspace_symbol_churn_delete \
            --receipt target/memory/receipts/nightly-workspace-symbol.receipt.json \
            --commit "$GITHUB_SHA" \
            --event "$RECEIPT_EVENT" \
            --markdown >> "$GITHUB_STEP_SUMMARY"
          cargo xtask gate-receipts validate target/memory/receipts/nightly-workspace-symbol.receipt.json
          cargo xtask memory-trends render \
            --input-dir target/memory \
            --output target/memory/memory_plateau_trends.md
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              raise SystemExit(0)

          rows = [
              (
                  "doc churn + delete",
                  "target/memory/nightly-doc-churn.json",
                  "target/memory/nightly-doc-churn.plateau.json",
              ),
              (
                  "workspace-symbol churn + delete",
                  "target/memory/nightly-workspace-symbol.json",
                  "target/memory/nightly-workspace-symbol.plateau.json",
              ),
          ]

          with open(summary_path, "a", encoding="utf-8") as fh:
              fh.write("## LSP memory plateau\n\n")
              fh.write("| Workload | Files | Tail growth KB | Median tail slope KB/file | Result |\n")
              fh.write("| --- | ---: | ---: | ---: | --- |\n")
              for label, payload_path, plateau_path in rows:
                  payload = json.loads(Path(payload_path).read_text())
                  plateau = json.loads(Path(plateau_path).read_text())
                  result = "passed" if plateau["passed"] else "failed"
                  fh.write(
                      f"| {label} "
                      f"| {payload['n_files']} "
                      f"| {plateau['tail_growth_kb']} "
                      f"| {plateau['median_tail_slope_kb_per_file']} "
                      f"| {result} |\n"
                  )
          PY
          exit "$PLATEAU_STATUS"

      - name: Upload memory plateau artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lsp-memory-plateau-${{ github.sha }}
          path: |
            target/memory/nightly-doc-churn.json
            target/memory/nightly-doc-churn.csv
            target/memory/nightly-doc-churn.plateau.json
            target/memory/nightly-doc-churn.server.log
            target/memory/receipts/nightly-doc-churn.receipt.json
            target/memory/nightly-workspace-symbol.json
            target/memory/nightly-workspace-symbol.csv
            target/memory/nightly-workspace-symbol.plateau.json
            target/memory/nightly-workspace-symbol.server.log
            target/memory/receipts/nightly-workspace-symbol.receipt.json
            target/memory/memory_plateau_trends.md
          if-no-files-found: warn
          retention-days: 30

  test-coverage:
    name: Codecov / Patch 95
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft != true) ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # nightly (master)
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: ${{ runner.os }}-coverage-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
          cache-on-failure: true

      - name: Install just
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4  # v2.79.7
        with:
          tool: just

      - name: Install cargo-llvm-cov
        run: rustup run nightly cargo install cargo-llvm-cov --locked

      - name: Create legacy LSP fixtures (CI-only)
        run: |
          mkdir -p archive/legacy-tests/test_fixtures
          touch archive/legacy-tests/test_fixtures/main.pl
          touch archive/legacy-tests/test_fixtures/Module.pm
          touch archive/legacy-tests/test_fixtures/test.t

      - name: Run workspace coverage proof
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          RUSTFLAGS: "-Cdebuginfo=0"
          CARGO_BUILD_JOBS: 1
        run: |
          base_ref="$BASE_REF"
          git fetch --no-tags --depth=200 origin "$base_ref" || true
          just coverage-proof "origin/$base_ref"

      - name: Append coverage proof summary
        if: always()
        shell: bash
        run: |
          if [ -f target/receipts/quality/quality-gate-coverage.md ]; then
            cat target/receipts/quality/quality-gate-coverage.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage quality-gate summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/lcov.info
          name: workspace-patch-coverage
          fail_ci_if_error: true

      - name: Upload coverage proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-proof-${{ github.sha }}
          path: |
            target/lcov.info
            target/receipts/quality/coverage-baseline.json
            target/receipts/quality/quality-gate-coverage.json
            target/receipts/quality/quality-gate-coverage.md
          retention-days: 14
          if-no-files-found: error

  tautology-check:
    name: Tautology Detection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:strict'))
    steps:
      - uses: actions/checkout@v6

      - name: Check for tautological assertions
        run: |
          echo "Checking for tautological test patterns..."

          if grep -r "assert!(.*\.is_some() || .*\.is_none())" tests/; then
            echo "❌ Found tautological assertions (is_some || is_none)"
            exit 1
          fi

          if grep -r "assert!(true)" tests/; then
            echo "❌ Found assert!(true)"
            exit 1
          fi

          if grep -r "assert!(.*\.len() >= 0)" tests/; then
            echo "❌ Found tautological length check (>= 0)"
            exit 1
          fi

          echo "✅ No tautological patterns found"

  semver-check:
    name: API Compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:semver'))
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: semver-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --version 0.47.0 --locked

      - name: Determine baseline tag
        id: baseline
        run: |
          BASELINE=$(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "baseline=$BASELINE" >> $GITHUB_OUTPUT
          echo "Using baseline: $BASELINE"

      - name: Check perl-parser API compatibility
        run: |
          cargo semver-checks check-release -p perl-parser \
            --baseline-rev ${{ steps.baseline.outputs.baseline }} \
            || echo "::warning::Breaking changes detected in perl-parser"

      - name: Check perl-lexer API compatibility
        run: |
          cargo semver-checks check-release -p perl-lexer \
            --baseline-rev ${{ steps.baseline.outputs.baseline }} \
            || echo "::warning::Breaking changes detected in perl-lexer"

      - name: Check perl-parser-core API compatibility
        run: |
          cargo semver-checks check-release -p perl-parser-core \
            --baseline-rev ${{ steps.baseline.outputs.baseline }} \
            || echo "::warning::Breaking changes detected in perl-parser-core"

      - name: Check perl-lsp-rs API compatibility
        run: |
          cargo semver-checks check-release -p perl-lsp-rs \
            --baseline-rev ${{ steps.baseline.outputs.baseline }} \
            || echo "::warning::Breaking changes detected in perl-lsp-rs"

      - name: Check perllsp API compatibility
        run: |
          cargo semver-checks check-release -p perllsp \
            --baseline-rev ${{ steps.baseline.outputs.baseline }} \
            || echo "::warning::Breaking changes detected in perllsp"

      - name: Generate breaking changes report
        if: always()
        run: |
          mkdir -p target/semver-reports
          cargo semver-checks check-release --workspace \
            --baseline-rev ${{ steps.baseline.outputs.baseline }} \
            --output-format json > target/semver-reports/breaking-changes.json || true

      - name: Upload breaking changes report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semver-breaking-changes-report
          path: target/semver-reports/breaking-changes.json
          retention-days: 30

  public-api-check:
    name: Public API Surface Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:public-api'))
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: 1.92.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: public-api-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked --version 0.50.1

      - name: Install just
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4  # v2.79.7
        with:
          tool: just

      - name: Check public API surface (perl-lsp-rs, perl-parser, perl-uri, perl-dap, perllsp)
        # Uses cargo public-api --simplified to omit blanket-impl noise; baselines in .ci/public-api-baselines/
        run: just public-api-check

  scorecard-ratchet-check:
    name: Scorecard Floor-Metric Ratchet Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:metrics-ratchet'))
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: 1.92.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: scorecard-ratchet-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true

      - name: Install just
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4  # v2.79.7
        with:
          tool: just

      - name: Check floor-metric ratchet (bootstrap-safe)
        # Passes if no receipt exists; compares against committed baselines when receipt is present.
        # See docs/project/metrics/RATCHET.md for the four-layer model and promotion workflow.
        run: just ci-metrics-ratchet

  clippy-strict:
    name: Clippy (Strict)
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:strict'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: ${{ runner.os }}-clippy-strict-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true

      - name: Run clippy (strict mode)
        run: |
          cargo clippy --workspace --locked -- -D warnings -D clippy::all -A missing_docs

  # ============================================================================
  # Fuzz Testing (nightly only)
  # ============================================================================

  fuzz:
    name: Fuzz Target (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        target: [
          builtin_functions,
          dap_eval_validator,
          dap_stack_parser,
          declaration_parsing,
          heredoc_parsing,
          incremental_edit_sequences,
          lexer_tokenization,
          lsp_cancellation_registry,
          lsp_navigation,
          module_surface,
          parser_integration,
          quote_operators,
          semantic_model,
          structured_perl_programs,
          substitution_parsing,
          symbol_query_ranking,
          unicode_positions,
          utf16_roundtrip
        ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Rust toolchain (nightly)
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # nightly (master)
      with:
        toolchain: nightly
        components: rust-src

    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      with:
        key: ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
        cache-on-failure: true

    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --locked

    - name: Run fuzzer
      run: |
        DURATION=${{ github.event.inputs.duration || '600' }}
        ./scripts/fuzz-bounded --duration "$DURATION" -- ${{ matrix.target }}

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-artifacts-${{ matrix.target }}-${{ github.sha }}
        path: |
          fuzz/artifacts/
          fuzz/corpus/
        retention-days: 30
