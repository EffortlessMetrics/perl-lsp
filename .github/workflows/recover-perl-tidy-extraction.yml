name: Recover perl-tidy extraction

on:
  push:
    branches: [refactor/perl-tidy-extraction-10233]
    paths: [.github/workflows/recover-perl-tidy-extraction.yml]

permissions:
  contents: write
  issues: write

concurrency:
  group: perl-tidy-extraction-10233
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Recover the extraction with byte-exact fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('.github/workflows/bootstrap-perl-tidy-extraction.yml').read_text()
          start = "          python3 - <<'PY'\n"
          assert text.count(start) == 1
          script = text.split(start, 1)[1].split('\n          PY', 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script, '<recovered-extraction>', 'exec'))
          for crate in ['perl-tidy-perltidy', 'perl-lsp-perltidy']:
              path = Path('crates') / crate / 'tests/config_tests.rs'
              text = path.read_text()
              old = r'assert_eq!(formatted.contains("\n\n").then_some(()), Some(()));'
              good = r'assert!(formatted.contains("\n\n"));'
              assert old in text or good in text, f'Unexpected assertion in {path}'
              print(f'{path}: unit comparison occurrences={text.count(old)}; direct assertion occurrences={text.count(good)}')
              path.write_text(text.replace(old, good))
          # These existing golden fixtures intentionally contain a final blank line.
          # Preserve their exact bytes; do not trim source or expected output for git.
          for crate in ['perl-tidy', 'perl-tidy-perltidy']:
              fixture_root = Path('crates') / crate / 'tests/fixtures'
              lines = ['# Golden formatter inputs/outputs preserve their final blank line.']
              for name in ['indented_subroutine.pl', 'indented_subroutine.expected.pl', 'simple_subroutine.pl', 'simple_subroutine.expected.pl']:
                  rel = 'native_formatter/' + name
                  source = Path('crates/perl-lsp-perltidy/tests/fixtures') / rel
                  target = fixture_root / rel
                  assert target.read_bytes() == source.read_bytes(), target
                  lines.append(rel + ' whitespace=-blank-at-eof')
              (fixture_root / '.gitattributes').write_text('\n'.join(lines) + '\n')
          p = Path('crates/perl-tidy/src/native.rs')
          text = p.read_text()
          start = text.index('mod config;')
          p.write_text('//! Native formatter implementation and compatibility-era contracts.\n//!\n//! This package owns native formatting; external execution lives in\n//! `perl-tidy-perltidy`. Byte-oriented contracts are the next migration phase.\n\n' + text[start:])
          p = Path('crates/perl-tidy/src/lib.rs')
          text = p.read_text().replace('pub mod native;', '/// Native formatter implementation and public contracts.\npub mod native;')
          p.write_text(text)
          for name in ['bootstrap-perl-tidy-extraction.yml', 'capture-perl-tidy-bootstrap-log.yml', 'recover-perl-tidy-extraction.yml']:
              (Path('.github/workflows') / name).unlink()
          PY
          cargo update --workspace --quiet
          cargo fmt -p perl-tidy -p perl-tidy-perltidy -p perl-lsp-perltidy -p perl-lsp-rs-core -p perl-lsp-rs
          git diff --check
      - name: Preserve the concrete candidate before qualification
        id: candidate
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add Cargo.toml Cargo.lock crates/perl-tidy crates/perl-tidy-perltidy crates/perl-lsp-perltidy crates/perl-lsp-rs-core crates/perl-lsp-rs/Cargo.toml docs/how-to/NATIVE_TOOLING_MIGRATION.md .github/workflows/bootstrap-perl-tidy-extraction.yml .github/workflows/capture-perl-tidy-bootstrap-log.yml .github/workflows/recover-perl-tidy-extraction.yml
          git diff --cached --check
          git diff --exit-code
          git commit -m 'refactor(formatting): extract native and external formatter owners (#10233)'
          git push origin HEAD:refs/heads/refactor/perl-tidy-extraction-10233
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the production dependency closure
        id: closure
        run: |
          set -euo pipefail
          cargo tree --locked -p perl-tidy --edges normal,build --prefix none > /tmp/perl-tidy-tree.txt
          cat /tmp/perl-tidy-tree.txt
          if grep -E '^(lsp-types|perl-lsp-|perl-subprocess-runtime)' /tmp/perl-tidy-tree.txt; then
            echo 'Forbidden native dependency' >&2
            exit 1
          fi
      - name: Test owners, compatibility imports, and production provider
        id: tests
        run: |
          set -euo pipefail
          cargo test --locked --profile agent -p perl-tidy -p perl-tidy-perltidy -p perl-lsp-perltidy
          cargo test --locked --profile agent -p perl-lsp-rs-core --lib providers::formatting
      - name: Strict formatter lint and workspace check
        id: checks
        run: |
          set -euo pipefail
          cargo fmt -p perl-tidy -p perl-tidy-perltidy -p perl-lsp-perltidy -p perl-lsp-rs-core -p perl-lsp-rs -- --check
          cargo clippy --locked --profile agent -p perl-tidy -p perl-tidy-perltidy -p perl-lsp-perltidy --all-targets -- -D warnings -A missing_docs
          cargo clippy --locked --profile agent -p perl-lsp-rs-core --lib -- -D warnings -A missing_docs
          cargo check --locked --profile agent --workspace
          git diff --exit-code
      - name: Save SHA-bound qualification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CLOSURE: ${{ steps.closure.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          CHECKS: ${{ steps.checks.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          sha = os.environ.get('CANDIDATE_SHA') or 'No product commit produced'
          body = '\n'.join([
              '### Phase 1 automated qualification receipt',
              f"Candidate: `{sha}`",
              f"Run: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              f"Production dependency closure: **{os.environ['CLOSURE']}**",
              f"Formatter, compatibility, and focused core tests: **{os.environ['TESTS']}**",
              f"Formatting, lint, and workspace check: **{os.environ['CHECKS']}**",
              'This run does not prove byte API migration, CLI delivery, packaged external-consumer builds, full LSP process behavior, or independent review.'
          ])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(body)
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/10233/comments",
              data=json.dumps({'body': body}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(req) as response: print('Receipt saved:', response.status)
          PY
