name: Publish Docker Images

# Build and publish multi-arch Docker images
# Cost: ~$0.10 per publish (across all architectures)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.x.y)'
        required: true
        type: string
      push:
        description: 'Push to Docker Hub'
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-docker-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  init:
    name: Prepare version metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      major: ${{ steps.version.outputs.major }}
    steps:
      - name: Parse version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BASE_VERSION="${VERSION%%-*}"
          MAJOR="$(echo "$BASE_VERSION" | cut -d. -f1)"
          MINOR="$(echo "$BASE_VERSION" | cut -d. -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    needs: init
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Keep deterministic semver-like tags for manual dispatch runs.
          # `version` input is provided by release orchestration.
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            type=raw,value=${{ needs.init.outputs.major_minor }}
            type=raw,value=${{ needs.init.outputs.major }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/rust/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event.inputs.push != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  publish-dockerhub:
    name: Publish to Docker Hub
    runs-on: ubuntu-24.04
    needs: init
    timeout-minutes: 30
    if: github.event.inputs.push != 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: effortlessmetrics/perl-lsp
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            type=raw,value=${{ needs.init.outputs.major_minor }}
            type=raw,value=${{ needs.init.outputs.major }}
            type=raw,value=latest

      - name: Build and push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  summary:
    name: Summary
    needs: [build, publish-dockerhub]
    runs-on: ubuntu-24.04
    if: always()

    steps:
      - name: Get version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Docker Images Published :whale:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`effortlessmetrics/perl-lsp:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`effortlessmetrics/perl-lsp:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker run --rm -v \${PWD}:/workspace effortlessmetrics/perl-lsp:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
