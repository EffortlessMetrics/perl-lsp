name: Publish Docker Images

# Build and publish multi-arch Docker images
# Cost: ~$0.10 per publish (across all architectures)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.x.y)'
        required: true
        type: string
      push:
        description: 'Push images to GHCR and Docker Hub'
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-docker-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  init:
    name: Prepare version metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      major: ${{ steps.version.outputs.major }}
    steps:
      - name: Parse version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BASE_VERSION="${VERSION%%-*}"
          MAJOR="$(echo "$BASE_VERSION" | cut -d. -f1)"
          MINOR="$(echo "$BASE_VERSION" | cut -d. -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish builder image to GHCR
    runs-on: ubuntu-24.04
    needs: init
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Keep deterministic semver-like tags for manual dispatch runs.
          # `version` input is provided by release orchestration.
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            type=raw,value=${{ needs.init.outputs.major_minor }}
            type=raw,value=${{ needs.init.outputs.major }}
            type=raw,value=latest

      - name: Build and push multi-arch builder image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: .docker/rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify GHCR builder version tag is multi-architecture
        if: github.event.inputs.push != 'false'
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="$(printf '%s/%s:%s' "$REGISTRY" "$IMAGE_NAME" "$VERSION" | tr '[:upper:]' '[:lower:]')"
          manifest="$(mktemp)"
          for attempt in 1 2 3 4 5; do
            if docker manifest inspect "$IMAGE" > "$manifest"; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "Unable to inspect $IMAGE after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python3 - "$IMAGE" "$manifest" <<'PY'
          import json
          import pathlib
          import sys

          image = sys.argv[1]
          data = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          platforms = {
              f"{platform.get('os')}/{platform.get('architecture')}"
              for item in data.get("manifests", [])
              for platform in [item.get("platform") or {}]
              if platform.get("os") not in (None, "unknown")
              and platform.get("architecture") not in (None, "unknown")
          }
          required = {"linux/amd64", "linux/arm64"}
          missing = sorted(required - platforms)
          if missing:
              raise SystemExit(
                  f"{image}: missing required platforms {missing}; "
                  f"observed {sorted(platforms)}"
              )
          print(f"{image}: verified platforms {sorted(platforms)}")
          PY

  build-perl-runtime:
    name: Build and publish runtime image to GHCR
    runs-on: ubuntu-24.04
    needs: init
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-perl
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            type=raw,value=${{ needs.init.outputs.major_minor }}
            type=raw,value=${{ needs.init.outputs.major }}
            type=raw,value=latest

      - name: Build and push multi-arch runtime image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: .docker/perl-lsp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify GHCR runtime version tag is multi-architecture
        if: github.event.inputs.push != 'false'
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="$(printf '%s/%s-perl:%s' "$REGISTRY" "$IMAGE_NAME" "$VERSION" | tr '[:upper:]' '[:lower:]')"
          manifest="$(mktemp)"
          for attempt in 1 2 3 4 5; do
            if docker manifest inspect "$IMAGE" > "$manifest"; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "Unable to inspect $IMAGE after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python3 - "$IMAGE" "$manifest" <<'PY'
          import json
          import pathlib
          import sys

          image = sys.argv[1]
          data = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          platforms = {
              f"{platform.get('os')}/{platform.get('architecture')}"
              for item in data.get("manifests", [])
              for platform in [item.get("platform") or {}]
              if platform.get("os") not in (None, "unknown")
              and platform.get("architecture") not in (None, "unknown")
          }
          required = {"linux/amd64", "linux/arm64"}
          missing = sorted(required - platforms)
          if missing:
              raise SystemExit(
                  f"{image}: missing required platforms {missing}; "
                  f"observed {sorted(platforms)}"
              )
          print(f"{image}: verified platforms {sorted(platforms)}")
          PY

  publish-dockerhub:
    name: Publish to Docker Hub
    runs-on: ubuntu-24.04
    needs: init
    timeout-minutes: 150
    if: github.event.inputs.push != 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: effortlessmetrics/perl-lsp
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            type=raw,value=${{ needs.init.outputs.major_minor }}
            type=raw,value=${{ needs.init.outputs.major }}
            type=raw,value=latest

      - name: Build and push multi-arch (builder image)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: .docker/rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  publish-dockerhub-perl:
    name: Publish perl-lsp runtime to Docker Hub
    runs-on: ubuntu-24.04
    needs: init
    timeout-minutes: 60
    if: github.event.inputs.push != 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta-perl
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: effortlessmetrics/perl-lsp
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}-perl
            type=raw,value=${{ needs.init.outputs.major_minor }}-perl
            type=raw,value=latest-perl

      - name: Build and push multi-arch (perl-lsp runtime image)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: .docker/perl-lsp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-perl.outputs.tags }}
          labels: ${{ steps.meta-perl.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  summary:
    name: Summary
    needs: [build, build-perl-runtime, publish-dockerhub, publish-dockerhub-perl]
    runs-on: ubuntu-24.04
    if: always()

    steps:
      - name: Get version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## Docker Images Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Platforms**: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Builder image (Rust CI)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`effortlessmetrics/perl-lsp:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Runtime image (perllsp + Perl)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ github.repository }}-perl:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`effortlessmetrics/perl-lsp:${{ steps.version.outputs.version }}-perl\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Usage" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "# Run LSP server with your project mounted (stdio transport)" >> "$GITHUB_STEP_SUMMARY"
          echo 'docker run --rm -i -v "${PWD}:/workspace" effortlessmetrics/perl-lsp:${{ steps.version.outputs.version }}-perl' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
