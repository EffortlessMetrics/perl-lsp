name: Apply RTK proof-command patch

on:
  push:
    branches:
      - sync/4953-remove-rtk-proof-contracts
    paths:
      - .github/workflows/apply-rtk-proof-command-patch.yml

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source sync branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: sync/4953-remove-rtk-proof-contracts
          fetch-depth: 0

      - name: Apply exact reviewed validator patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/remove-rtk-validator.patch <<'PATCH'
          diff --git a/xtask/src/tasks/active_goal_manifest.rs b/xtask/src/tasks/active_goal_manifest.rs
          --- a/xtask/src/tasks/active_goal_manifest.rs
          +++ b/xtask/src/tasks/active_goal_manifest.rs
          @@ -1002,8 +1002,10 @@ fn validate_optional_command_array(
                       violations.push(format!("{doc}: {field}[{index}] must not be empty"));
                       continue;
                   }
          -        if !command.starts_with("rtk ") {
          -            violations.push(format!("{doc}: {field}[{index}] must start with \"rtk \""));
          +        if command.split_whitespace().next() == Some("rtk") {
          +            violations.push(format!(
          +                "{doc}: {field}[{index}] must be a direct repository command"
          +            ));
                   }
                   stats.proof_commands += 1;
               }
          @@ -1833,7 +1835,7 @@ mod tests {
                   command_table.insert(
                       "commands".to_owned(),
                       Value::Array(vec![
          -                Value::String("rtk cargo test -p xtask".to_owned()),
          +                Value::String("cargo test -p xtask".to_owned()),
                           Value::String(" ".to_owned()),
                           Value::Integer(5),
                       ]),
          @@ -2093,11 +2095,14 @@ mod tests {
               }
           
               #[test]
          -    fn active_goal_manifest_reports_non_rtk_proof_commands() -> Result<()> {
          +    fn active_goal_manifest_rejects_rtk_wrapped_proof_commands() -> Result<()> {
                   let mut table = Table::new();
                   table.insert(
                       "commands".to_owned(),
          -            Value::Array(vec![Value::String("cargo test -p xtask".to_owned())]),
          +            Value::Array(vec![
          +                Value::String("rtk cargo test -p xtask".to_owned()),
          +                Value::String("rtk\tgit diff --check".to_owned()),
          +            ]),
                   );
                   let mut stats = ManifestStats::default();
                   let mut violations = Vec::new();
          @@ -2110,10 +2115,15 @@ mod tests {
                       &mut violations,
                   );
           
          -        assert_eq!(stats.proof_commands, 1);
          +        assert_eq!(stats.proof_commands, 2);
                   assert_eq!(
                       violations,
          -            vec!["program manifest: work_item[0]: commands[0] must start with \"rtk \"".to_owned()]
          +            vec![
          +                "program manifest: work_item[0]: commands[0] must be a direct repository command"
          +                    .to_owned(),
          +                "program manifest: work_item[0]: commands[1] must be a direct repository command"
          +                    .to_owned(),
          +            ]
                   );
           
                   Ok(())
          PATCH
          git apply --check /tmp/remove-rtk-validator.patch
          git apply /tmp/remove-rtk-validator.patch
          git diff --check

      - name: Run targeted validator tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p xtask active_goal_manifest --locked

      - name: Commit exact validator delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Steven Zimmerman, CPA"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add xtask/src/tasks/active_goal_manifest.rs
          git commit -m "goals: reject RTK-wrapped proof commands"
          git push origin HEAD:sync/4953-remove-rtk-proof-contracts
