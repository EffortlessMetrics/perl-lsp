name: Temporary probe v0.14.0 container tags

on:
  push:
    branches: [ops/probe-v0.14-container-tags]
    paths: [.github/workflows/_tmp-probe-v014-container-tags.yml]
  pull_request:
    branches: [master]
    paths: [.github/workflows/_tmp-probe-v014-container-tags.yml]

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect authenticated GHCR manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          for image in ghcr.io/effortlessmetrics/perl-lsp:0.14.0 ghcr.io/effortlessmetrics/perl-lsp-perl:0.14.0; do
            file="${RUNNER_TEMP}/$(printf '%s' "$image" | tr '/:' '__').json"
            set +e
            docker manifest inspect "$image" >"$file" 2>"${file}.stderr"
            rc=$?
            set -e
            echo "GHCR_IMAGE=$image"
            echo "GHCR_EXIT=$rc"
            if [ "$rc" -eq 0 ]; then
              python3 - "$file" <<'PY'
          import json, pathlib, sys
          d = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("GHCR_RESULT=present")
          print("GHCR_MEDIA_TYPE=" + d.get("mediaType", "unknown"))
          manifests = d.get("manifests") or []
          print("GHCR_MANIFEST_COUNT=" + str(len(manifests) if manifests else "single"))
          for item in manifests:
              p = item.get("platform") or {}
              print("GHCR_PLATFORM=" + p.get("os", "unknown") + "/" + p.get("architecture", "unknown"))
          PY
            else
              echo "GHCR_RESULT=absent-or-inaccessible"
              head -n 3 "${file}.stderr"
            fi
            echo "GHCR_END"
          done
