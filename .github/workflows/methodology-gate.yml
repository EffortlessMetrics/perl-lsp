name: Methodology Gate

on:
  pull_request:
    types: [labeled]
  merge_group:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.label.name || 'non-pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  methodology-gate:
    if: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'ci:qualify' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run methodology gate (advisory)
        run: |
          jq --arg event "$GITHUB_EVENT_NAME" '. + {event_name: $event}' \
            "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/methodology-event.json"
          cargo xtask methodology-gate \
            --fixture "$RUNNER_TEMP/methodology-event.json" \
            --receipt target/receipts/methodology-gate.json

      - name: Upload methodology receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: methodology-gate-receipt
          path: target/receipts/methodology-gate.json
          if-no-files-found: ignore
