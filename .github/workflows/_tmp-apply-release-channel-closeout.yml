name: Temporary apply release-channel closeout

on:
  push:
    branches:
      - docs/release-channel-closeout-0.15-0.17
    paths:
      - scripts/_apply_release_channel_closeout_tmp.py
      - .github/workflows/_tmp-apply-release-channel-closeout.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v7
        with:
          ref: docs/release-channel-closeout-0.15-0.17
          fetch-depth: 0

      - name: Apply guarded note restoration
        run: python3 scripts/_apply_release_channel_closeout_tmp.py

      - name: Validate release-channel actuals
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/_apply_release_channel_closeout_tmp.py \
            scripts/check_release_channel_actuals.py \
            scripts/tests/test_release_channel_actuals.py
          python3 scripts/check_release_channel_actuals.py
          python3 scripts/tests/test_release_channel_actuals.py
          grep -q '^github_release: "https://github.com/EffortlessMetrics/perl-lsp/releases/tag/v0.15.0"$' docs/releases/v0.15.0.md
          grep -q '^github_release: "https://github.com/EffortlessMetrics/perl-lsp/releases/tag/v0.15.1"$' docs/releases/v0.15.1.md
          grep -q '^notes_status: canonical$' docs/releases/v0.15.2.md
          grep -q '^github_release: "https://github.com/EffortlessMetrics/perl-lsp/releases/tag/v0.16.0"$' docs/releases/v0.16.0.md
          grep -q '^github_release: "https://github.com/EffortlessMetrics/perl-lsp/releases/tag/v0.17.0"$' docs/releases/v0.17.0.md
          grep -q '^> \*\*Restoration note (2026-07-12):\*\*' docs/releases/0.15.2-closeout-audit.md
          git diff --check

      - name: Remove one-shot machinery
        run: |
          rm scripts/_apply_release_channel_closeout_tmp.py
          rm .github/workflows/_tmp-apply-release-channel-closeout.yml

      - name: Commit final closeout restoration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(release): restore 0.15.2 closeout and GitHub Release actuals (#9965)'
          git push origin HEAD:refs/heads/docs/release-channel-closeout-0.15-0.17
