name: Temporary apply release-note review fixes

on:
  push:
    branches:
      - docs/release-notes-provenance
    paths:
      - scripts/_apply_9956_review_fixes_tmp.py
      - .github/workflows/_tmp-apply-9956-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v7
        with:
          ref: docs/release-notes-provenance
          fetch-depth: 0

      - name: Apply guarded review fixes
        run: python3 scripts/_apply_9956_review_fixes_tmp.py

      - name: Validate corrected contracts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/_apply_9956_review_fixes_tmp.py
          grep -Fq 'export SWARM_DIR="${SWARM_DIR:-../perl-lsp-swarm}"' docs/project/RELEASE_CHECKLIST.md
          grep -Fq 'git -C "$SWARM_DIR" merge-base --is-ancestor "$PREVIOUS_RC" "$RC_SHA"' docs/project/RELEASE_CHECKLIST.md
          grep -Fq 'records the source tag comparison as `safe`, `inflated`, `incomplete`, or `tree-only`' docs/project/RELEASE_CHECKLIST.md
          grep -Fq 'git -C "$SWARM_DIR" log' docs/releases/README.md
          grep -Fq 'a87f766ab60da513833dfff47349384be96fdae2' docs/releases/v0.16.0.md
          grep -Fq '0.16 source-sync receipt' docs/releases/v0.16.0.md
          ! grep -Fq 'pr-fast 10/10 PASS' docs/releases/v0.16.0.md
          grep -Fq '33c4ee79a753eccdfdc2dab1de9e674f3ecaefe9' docs/releases/v0.17.0.md
          grep -Fq '55bef776fa6865301142a3dd075f0472caa13f36' docs/releases/v0.17.0.md
          grep -Fq 'git log --first-parent' docs/releases/v0.17.0.md
          ! grep -Fq 'c04e06b8c' docs/releases/v0.17.0.md
          ! grep -Fq 'a87f766ab...c04e06b8c' docs/releases/v0.17.0.md
          git diff --check

      - name: Remove one-shot machinery
        run: |
          rm scripts/_apply_9956_review_fixes_tmp.py
          rm .github/workflows/_tmp-apply-9956-review-fixes.yml

      - name: Commit final review fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(release): address provenance review findings'
          git push origin HEAD:refs/heads/docs/release-notes-provenance
