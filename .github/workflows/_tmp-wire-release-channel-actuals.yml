name: Temporary wire release-channel actuals gate

on:
  push:
    branches:
      - docs/release-channel-closeout-0.15-0.17
    paths:
      - scripts/_wire_release_channel_actuals_tmp.py
      - .github/workflows/_tmp-wire-release-channel-actuals.yml
  pull_request:
    branches:
      - docs/release-notes-provenance
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v7
        with:
          ref: docs/release-channel-closeout-0.15-0.17
          fetch-depth: 0

      - name: Wire permanent drift gate
        run: python3 scripts/_wire_release_channel_actuals_tmp.py

      - name: Validate permanent integration
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/_wire_release_channel_actuals_tmp.py \
            scripts/check_release_channel_actuals.py \
            scripts/tests/test_release_channel_actuals.py
          python3 scripts/check_release_channel_actuals.py
          python3 scripts/tests/test_release_channel_actuals.py
          bash scripts/check_release_history.sh
          grep -q '^# ── Check 6: Verified channel actuals must not regress' scripts/check_release_history.sh
          grep -q 'python3 scripts/check_release_channel_actuals.py' scripts/check_release_history.sh
          git diff --check

      - name: Remove one-shot machinery
        run: |
          rm scripts/_wire_release_channel_actuals_tmp.py
          rm .github/workflows/_tmp-wire-release-channel-actuals.yml

      - name: Commit permanent gate wiring
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci(release): enforce verified channel actuals in drift gate'
          git push origin HEAD:refs/heads/docs/release-channel-closeout-0.15-0.17
