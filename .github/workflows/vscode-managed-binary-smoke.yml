name: VS Code Managed Binary Smoke

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main, master]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-managed-binary-smoke.yml'
  schedule:
    - cron: '0 13 * * 1'

concurrency:
  group: vscode-managed-binary-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  managed-binary-smoke:
    name: VS Code smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Select npm authority
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Verify Node and npm authority
        run: npm run doctor

      - name: Compile extension
        run: npm run compile

      - name: Run extension-host smoke
        if: runner.os != 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test:integration

      - name: Run extension-host smoke under Xvfb
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: xvfb-run -a npm run test:integration

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vscode-smoke-source-${{ matrix.os }}
          path: target/receipts/vscode-smoke/**
          if-no-files-found: warn
          retention-days: 14
