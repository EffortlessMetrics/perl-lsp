name: Temporary probe release container matrix

on:
  push:
    branches: [ops/probe-v0.14-container-tags]
    paths:
      - scripts/_tmp_probe_container_matrix.py
      - .github/workflows/_tmp-probe-release-container-matrix.yml
  pull_request:
    branches: [master]
    paths:
      - scripts/_tmp_probe_container_matrix.py
      - .github/workflows/_tmp-probe-release-container-matrix.yml

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null

      - name: Probe release matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/probe.py" \
            "https://raw.githubusercontent.com/EffortlessMetrics/perl-lsp/3c5a2da3c420ae7bb73e283f0fb13bdeef15eb66/scripts/_tmp_probe_container_matrix.py"
          python3 "${RUNNER_TEMP}/probe.py"
