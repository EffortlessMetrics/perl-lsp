name: Temporary release tag provenance audit

on:
  push:
    branches:
      - docs/release-tag-provenance
    paths:
      - scripts/_apply_tag_provenance_tmp.py
      - .github/workflows/_tmp-apply-tag-provenance.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout provenance branch
        uses: actions/checkout@v7
        with:
          ref: docs/release-tag-provenance
          fetch-depth: 0

      - name: Apply guarded documentation edits
        run: python3 scripts/_apply_tag_provenance_tmp.py

      - name: Validate manifest and tests
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check_release_tag_provenance.py \
            scripts/tests/test_release_tag_provenance.py
          python3 scripts/check_release_tag_provenance.py
          python3 scripts/tests/test_release_tag_provenance.py

      - name: Verify live tag refs and ancestry
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          python3 scripts/check_release_tag_provenance.py --verify-git

      - name: Validate documentation contracts
        run: |
          set -euo pipefail
          grep -q '^### 2026-07-12 — live tag SHA and branch-line audit$' RELEASE_HISTORY.md
          grep -q 'v0.9.1...v0.11.0' CHANGELOG.md
          grep -q '^tag_commit: "0e52877de7763d8654e0fb6d7afe6a257639e584"$' docs/releases/v0.9.1.md
          grep -q '^previous_tag: "v0.9.1"$' docs/releases/v0.11.0.md
          grep -q 'check_release_tag_provenance.py --verify-git' docs/RELEASE_PROCESS.md
          grep -q '^name = "v0.17.0"$' policy/release-tag-provenance.toml
          git diff --check

      - name: Remove one-shot machinery
        run: |
          rm scripts/_apply_tag_provenance_tmp.py
          rm .github/workflows/_tmp-apply-tag-provenance.yml

      - name: Commit final provenance audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(release): pin live tag provenance and drift checks (#9963)'
          git push origin HEAD:refs/heads/docs/release-tag-provenance
