name: PR Title Check

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  checks: write

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: actions/github-script@v9
        with:
          script: |
            const actor = context.actor;
            const pr = context.payload.pull_request;
            const title = pr.title;
            const login = pr.user.login;

            if (actor === 'dependabot[bot]' || login.includes('dependabot')) {
              core.info('Exempt: dependabot PR');
              return;
            }

            const labels = pr.labels.map(l => l.name);
            if (labels.includes('skip-title-check')) {
              core.info('Exempt: skip-title-check label present');
              return;
            }

            if (/^v?\d+\.\d+\.\d+$/.test(title.trim())) {
              core.info('Exempt: release stamp title');
              return;
            }

            const BOT_MARKER = '<!-- pr-title-check-bot -->';
            const issueGuidance = [
              'For Codex or other agent-authored PRs: file the plan as a GitHub issue first, then update the PR title to reference that real issue.',
              '',
              'The issue should preserve the plan context: problem, scope, constraints, files or surfaces, validation, and explicit non-goals.',
              '',
              'Do not use `#0000` as a placeholder. Do not use `skip-title-check` to bypass a missing planning issue; that label is reserved for maintainer-owned exceptions.',
            ].join('\n');
            const upsertTitleCheckComment = async (commentBody) => {
              // Deduplicate: find and update existing bot comment instead of posting a new one.
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });

              const existing = comments.find(c =>
                c.user.type === 'Bot' && c.body && c.body.includes(BOT_MARKER)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: commentBody,
                });
                core.info('Updated existing bot comment.');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: commentBody,
                });
                core.info('Posted new bot comment.');
              }
            };
            const issueMatches = [...title.matchAll(/\B#(\d+)\b/g)];

            if (issueMatches.length === 0) {
              core.setFailed(
                `PR title must reference an issue (e.g. "feat: add thing (#42)"). ` +
                `Codex/agent PRs should file the plan as an issue first. Got: "${title}"`
              );

              const commentBody = [
                '## \u26a0\ufe0f PR Title Check Failed',
                '',
                BOT_MARKER,
                '',
                'This PR\'s title does not include an **issue reference** (`#<number>` outside of version strings).',
                '',
                '**Expected format:** `type: description (#1234)`',
                '',
                issueGuidance,
                '',
                `Current title: \`${title}\``,
              ].join('\n');

              await upsertTitleCheckComment(commentBody);
              return;
            }

            // Reject zero-valued issue references anywhere in the title.
            // Real GitHub issues start at #1; zero is the placeholder for an unknown issue.
            const zeroIssueMatch = issueMatches.find((match) => parseInt(match[1], 10) === 0);
            if (zeroIssueMatch) {
              core.setFailed(
                `PR title contains zero-valued issue reference "${zeroIssueMatch[0]}", which is the Codex placeholder for an unknown issue. ` +
                `File the plan as an issue and replace it with the actual issue number, e.g. "(#1234)". Got: "${title}"`
              );
              const commentBody = [
                '## \u26a0\ufe0f PR Title Check Failed',
                '',
                BOT_MARKER,
                '',
                `This PR title uses the placeholder issue reference \`${zeroIssueMatch[0]}\`.`,
                '',
                '**Expected format:** `type: description (#1234)`',
                '',
                issueGuidance,
                '',
                `Current title: \`${title}\``,
              ].join('\n');

              await upsertTitleCheckComment(commentBody);
              return;
            }

            // Validate the first non-placeholder issue reference.
            const issueNumber = parseInt(issueMatches[0][1], 10);
            try {
              await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              core.info(`Referenced issue #${issueNumber} exists.`);
            } catch (e) {
              core.warning(
                `Referenced issue #${issueNumber} was not found. Please verify the issue number.`
              );
              // Don't fail the check for this — it may be a private/internal reference
            }

            core.info('PR title passes validation.');
