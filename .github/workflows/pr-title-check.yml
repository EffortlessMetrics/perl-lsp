name: PR Title Check

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  checks: write
  statuses: write

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: actions/github-script@v9
        with:
          script: |
            const actor = context.actor;
            const pr = context.payload.pull_request;
            const title = pr.title;
            const login = pr.user.login;

            if (actor === 'dependabot[bot]' || login.includes('dependabot')) {
              core.info('Exempt: dependabot PR');
              return;
            }

            const labels = pr.labels.map(l => l.name);
            if (labels.includes('skip-title-check')) {
              core.info('Exempt: skip-title-check label present');
              return;
            }

            if (/^v?\d+\.\d+\.\d+$/.test(title.trim())) {
              core.info('Exempt: release stamp title');
              return;
            }

            const BOT_MARKER = '<!-- pr-title-check-bot -->';
            const prHeadSha = pr.head.sha;
            const statusContext = 'ci/pr-title';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            // Post a commit status so stale failures for the same SHA are always
            // overwritten when the title is subsequently fixed (without a new push).
            async function postTitleStatus(state, description) {
              try {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: prHeadSha,
                  state,
                  context: statusContext,
                  description: description.slice(0, 140),
                  target_url: runUrl,
                });
              } catch (err) {
                core.warning(`Could not post ci/pr-title commit status: ${err.message}`);
              }
            }

            if (!/\B#\d+\b/.test(title)) {
              core.setFailed(
                `PR title must reference an issue (e.g. "feat: add thing (#42)"). Got: "${title}"`
              );

              await postTitleStatus('failure', 'PR title missing issue reference (#NNN)');

              const commentBody = [
                '## ⚠️ PR Title Check Failed',
                '',
                BOT_MARKER,
                '',
                'This PR\'s title does not include an **issue reference** (`#<number>` outside of version strings).',
                '',
                '**Expected format:** `type: description (#1234)`',
                '',
                'Please update the title to reference the relevant issue. If this PR doesn\'t need one, add the `skip-title-check` label.',
                '',
                `Current title: \`${title}\``,
              ].join('\n');

              // Deduplicate: find and update existing bot comment instead of posting a new one
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });

              const existing = comments.find(c =>
                c.user.type === 'Bot' && c.body && c.body.includes(BOT_MARKER)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: commentBody,
                });
                core.info('Updated existing bot comment.');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: commentBody,
                });
                core.info('Posted new bot comment.');
              }
              return;
            }

            // Extract issue number and validate it exists
            const match = title.match(/\B#(\d+)\b/);
            if (match) {
              const issueNumber = parseInt(match[1], 10);
              try {
                await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                core.info(`Referenced issue #${issueNumber} exists.`);
              } catch (e) {
                core.warning(
                  `Referenced issue #${issueNumber} was not found. Please verify the issue number.`
                );
                // Don't fail the check for this — it may be a private/internal reference
              }
            }

            // Post success status — overwrites any stale failure from a prior title edit
            // on this same SHA (e.g. title fixed without a new commit push).
            await postTitleStatus('success', 'PR title passes validation');
            core.info('PR title passes validation.');
