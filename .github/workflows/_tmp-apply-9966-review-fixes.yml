name: Temporary apply PR 9966 review fixes

on:
  push:
    branches:
      - docs/release-channel-closeout-0.15-0.17
    paths:
      - scripts/_apply_9966_review_fixes_tmp.py
      - .github/workflows/_tmp-apply-9966-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v7
        with:
          ref: docs/release-channel-closeout-0.15-0.17
          fetch-depth: 0

      - name: Apply review fixes
        run: python3 scripts/_apply_9966_review_fixes_tmp.py

      - name: Validate permanent checker and tests
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/_apply_9966_review_fixes_tmp.py \
            scripts/check_release_channel_actuals.py \
            scripts/tests/test_release_channel_actuals.py
          python3 scripts/check_release_channel_actuals.py
          python3 scripts/tests/test_release_channel_actuals.py
          grep -q 'if raw.rstrip() == "channels:"' scripts/check_release_channel_actuals.py
          grep -q 'https://github.com/{repository}/releases/tag/{tag}' scripts/check_release_channel_actuals.py
          grep -q 'assertRaises(ChannelActualsError)' scripts/tests/test_release_channel_actuals.py
          git diff --check

      - name: Remove one-shot machinery
        run: |
          rm scripts/_apply_9966_review_fixes_tmp.py
          rm .github/workflows/_tmp-apply-9966-review-fixes.yml

      - name: Commit final review fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): harden channel actuals validator review findings'
          git push origin HEAD:refs/heads/docs/release-channel-closeout-0.15-0.17
