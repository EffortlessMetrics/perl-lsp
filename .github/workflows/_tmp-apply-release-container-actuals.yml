name: Temporary apply release container actuals

on:
  push:
    branches:
      - docs/release-container-actuals-0.15-0.17
    paths:
      - scripts/_apply_release_container_actuals_tmp.py
      - .github/workflows/_tmp-apply-release-container-actuals.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: docs/release-container-actuals-0.15-0.17
          fetch-depth: 0

      - name: Apply exact edits
        run: python3 scripts/_apply_release_container_actuals_tmp.py

      - name: Verify validators
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check_release_container_actuals.py \
            scripts/tests/test_release_container_actuals.py
          python3 scripts/tests/test_release_container_actuals.py
          python3 scripts/check_release_channel_actuals.py
          python3 scripts/check_release_container_actuals.py
          bash -n scripts/check_release_history.sh
          git diff --check

      - name: Commit applied files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/releases/v0.15.0.md \
            docs/releases/v0.15.1.md \
            docs/releases/v0.15.2.md \
            docs/releases/v0.16.0.md \
            docs/releases/v0.17.0.md \
            docs/releases/0.15.2-closeout-audit.md \
            scripts/check_release_history.sh
          if git diff --cached --quiet; then
            echo "No target changes to commit"
            exit 0
          fi
          git commit -m "docs(release): record audited container actuals"
          git push origin HEAD:docs/release-container-actuals-0.15-0.17
