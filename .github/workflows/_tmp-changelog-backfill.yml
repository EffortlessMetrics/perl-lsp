name: Temporary changelog backfill

on:
  push:
    branches:
      - docs/changelog-backfill-0.15-0.17
    paths:
      - scripts/_backfill_changelog_tmp.py
      - .github/workflows/_tmp-changelog-backfill.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout backfill branch
        uses: actions/checkout@v7
        with:
          ref: docs/changelog-backfill-0.15-0.17
          fetch-depth: 0

      - name: Apply historical backfill
        run: python3 scripts/_backfill_changelog_tmp.py

      - name: Validate and remove one-shot machinery
        run: |
          set -euo pipefail
          git diff --check
          grep -q '<!-- changelog-backfill:0.15.1-0.17.0 -->' CHANGELOG.md
          grep -q 'Method-call parameter inlay hints' CHANGELOG.md
          grep -q 'Historical provenance correction' CHANGELOG.md
          grep -q 'Install-surface caveat' CHANGELOG.md
          rm scripts/_backfill_changelog_tmp.py
          rm .github/workflows/_tmp-changelog-backfill.yml

      - name: Commit final changelog diff
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(changelog): backfill 0.15.1 through 0.17.0'
          git push origin HEAD:refs/heads/docs/changelog-backfill-0.15-0.17
