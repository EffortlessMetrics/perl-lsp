name: Merge Ready Reconciler

on:
  schedule:
    # Run every 15 minutes — apply mode by default.
    - cron: '*/15 * * * *'
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      advisory:
        description: 'Emergency rollback: run in dry-run advisory mode (default false = apply)'
        required: false
        default: 'false'

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  # Set RECONCILER_DISABLED=true to globally disable apply mode without reverting this PR.
  # Example: add `RECONCILER_DISABLED: 'true'` to repo variables or environment secrets.
  RECONCILER_DISABLED: ${{ vars.RECONCILER_DISABLED || 'false' }}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-xtask-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-xtask-

      - name: Apply reconcile (default)
        if: >
          env.RECONCILER_DISABLED != 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.advisory != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask merge-ready reconcile-queue --apply

      - name: Advisory dry-run (emergency rollback or manual override)
        if: >
          env.RECONCILER_DISABLED == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.advisory == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask merge-ready reconcile-queue --dry-run

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-reconcile-receipt
          path: target/receipts/queue-reconcile.json
          if-no-files-found: ignore
