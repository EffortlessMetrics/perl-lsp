name: Temporary carry v0.13.0-rc1 status into provenance PR

on:
  push:
    branches:
      - docs/release-tag-provenance
    paths:
      - scripts/_carry_013rc_ledger_tmp.py
      - .github/workflows/_tmp-carry-013rc-provenance.yml
  pull_request:
    branches:
      - docs/release-lineage-0.13
    paths:
      - scripts/_carry_013rc_ledger_tmp.py
      - .github/workflows/_tmp-carry-013rc-provenance.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout provenance branch
        uses: actions/checkout@v7
        with:
          ref: docs/release-tag-provenance
          fetch-depth: 0

      - name: Apply and validate correction
        run: |
          set -euo pipefail
          python3 scripts/_carry_013rc_ledger_tmp.py
          grep -q '\[yes\]\[gh-0.13.0-rc1\] (prerelease)' RELEASE_HISTORY.md
          grep -q '^\[gh-0.13.0-rc1\]:' RELEASE_HISTORY.md
          grep -q '11 assets' docs/releases/v0.13.0-rc1.md
          python3 scripts/check_release_tag_provenance.py
          git diff --check

      - name: Remove one-shot machinery
        run: |
          rm scripts/_carry_013rc_ledger_tmp.py
          rm .github/workflows/_tmp-carry-013rc-provenance.yml

      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(release): carry verified RC status into provenance audit (#9963)'
          git push origin HEAD:refs/heads/docs/release-tag-provenance
