name: Publish VSCode Extension

# Publish VSCode extension to marketplace
# Cost: ~$0.05 per publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.x.y)'
        required: true
        type: string

# Cancel in-flight runs
concurrency:
  group: publish-extension-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false  # Don't cancel publishing

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: |
          npm ci
          npm install -g @vscode/vsce ovsx

      - name: Set version
        working-directory: vscode-extension
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              VERSION="${GITHUB_REF#refs/tags/v}"
            else
              echo "::error::Version input is required for workflow_dispatch"
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          npm version $VERSION --no-git-tag-version
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Compile extension
        working-directory: vscode-extension
        run: npm run compile

      - name: Package extension
        working-directory: vscode-extension
        run: |
          vsce package
          echo "VSIX_FILE=$(ls *.vsix)" >> $GITHUB_ENV

      - name: Publish to VSCode Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          vsce publish --pat $VSCE_PAT --packagePath ${{ env.VSIX_FILE }}

      - name: Publish to Open VSX
        if: ${{ secrets.OVSX_PAT != '' }}
        working-directory: vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          ovsx publish ${{ env.VSIX_FILE }} --pat $OVSX_PAT

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: perl-lsp-${{ env.VERSION }}.vsix
          path: vscode-extension/${{ env.VSIX_FILE }}
          retention-days: 30

      - name: Create GitHub Release asset
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::warning::Release ${RELEASE_TAG} does not exist yet. Skipping VSIX attachment."
            exit 0
          fi

          gh release upload "${RELEASE_TAG}" \
            "vscode-extension/${{ env.VSIX_FILE }}" \
            --clobber
