name: Temporary validate release tag provenance review fixes

on:
  push:
    branches:
      - docs/release-tag-provenance
  pull_request:
    branches:
      - docs/release-lineage-0.13

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@v7
        with:
          ref: docs/release-tag-provenance
          fetch-depth: 0

      - name: Run provenance tests
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check_release_tag_provenance.py \
            scripts/tests/test_release_tag_provenance.py
          python3 scripts/check_release_tag_provenance.py
          python3 scripts/tests/test_release_tag_provenance.py

      - name: Verify all fetched release tags
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          python3 scripts/check_release_tag_provenance.py --verify-git

      - name: Check final diff hygiene
        run: git diff --check
