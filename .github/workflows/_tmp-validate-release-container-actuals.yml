name: Temporary validate release container actuals

on:
  push:
    branches:
      - docs/release-container-actuals-0.15-0.17
    paths:
      - policy/release-container-actuals.json
      - scripts/check_release_container_actuals.py
      - scripts/tests/test_release_container_actuals.py
      - scripts/check_release_history.sh
      - docs/releases/**
      - .github/workflows/_tmp-validate-release-container-actuals.yml
  pull_request:
    branches:
      - docs/release-channel-closeout-0.15-0.17
    paths:
      - policy/release-container-actuals.json
      - scripts/check_release_container_actuals.py
      - scripts/tests/test_release_container_actuals.py
      - scripts/check_release_history.sh
      - docs/releases/**
      - .github/workflows/_tmp-validate-release-container-actuals.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: docs/release-container-actuals-0.15-0.17
          fetch-depth: 1

      - name: Validate release actuals
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check_release_channel_actuals.py \
            scripts/check_release_container_actuals.py \
            scripts/tests/test_release_container_actuals.py
          python3 scripts/tests/test_release_container_actuals.py
          python3 scripts/check_release_channel_actuals.py
          python3 scripts/check_release_container_actuals.py
          bash -n scripts/check_release_history.sh
          git diff --check
