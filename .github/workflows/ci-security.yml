name: CI (Security)

# Consolidated workflow for security scanning
# Combines: security-scan.yml (cargo-audit, cargo-deny, trivy)
# Cost: ~$0.08 per run

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.github/workflows/ci-security.yml'
      - '.docker/**'
      - 'Dockerfile*'
  push:
    branches: [main, master]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

# Coalesce-queue-tail: let the running CI complete; skip superseded SHAs at a
# preflight gate instead of cancelling in-flight work mid-run.
# Note: scheduled runs always pass the preflight gate (no SHA comparison).
concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Preflight: skip superseded SHAs to save cost ─────────────────────
  preflight-latest-check:
    name: Preflight — is this SHA latest?
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - name: Check if this SHA is latest on the ref
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          CURRENT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Scheduled and manual runs always pass through — no SHA to compare.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Scheduled/manual run — always passing preflight"
            exit 0
          fi
          LATEST=$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "refs/heads/${BRANCH}" | awk '{print $1}')
          if [ -z "$LATEST" ] || [ "$LATEST" = "$CURRENT" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This SHA ($CURRENT) is latest on $BRANCH — running full CI"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded by $LATEST — skipping remaining jobs to save cost"
          fi

  # ============================================================================
  # Rust Security Audits
  # ============================================================================

  cargo-audit:
    name: Cargo Audit (RustSec)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: preflight-latest-check
    if: needs.preflight-latest-check.outputs.is_latest == 'true'
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: audit-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d  # v2.79.2
        with:
          tool: cargo-audit

      - name: Run cargo-audit (JSON output for processing)
        id: audit
        run: |
          set +e
          cargo audit --json > audit-results.json 2>&1
          AUDIT_EXIT=$?
          echo "exit_code=$AUDIT_EXIT" >> $GITHUB_OUTPUT

          if [ $AUDIT_EXIT -ne 0 ]; then
            echo "::warning::Security vulnerabilities detected by cargo-audit"
            cat audit-results.json
          else
            echo "::notice::No security vulnerabilities found"
          fi

          exit $AUDIT_EXIT

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-results
          path: audit-results.json
          retention-days: 30

  cargo-deny:
    name: Cargo Deny (Policy Enforcement)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: preflight-latest-check
    if: needs.preflight-latest-check.outputs.is_latest == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable (master)
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: deny-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d  # v2.79.2
        with:
          tool: cargo-deny

      - name: Run cargo-deny (all checks)
        run: cargo deny --locked check advisories licenses bans sources

  # ============================================================================
  # Trivy Comprehensive Scanning
  # ============================================================================

  trivy-repo-scan:
    name: Trivy Repository Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: preflight-latest-check
    if: needs.preflight-latest-check.outputs.is_latest == 'true'
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner (filesystem mode)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'  # Don't fail on findings, just report
          ignore-unfixed: true
          # Scan Rust dependencies and configuration files
          scanners: 'vuln,config,secret'
          # Skip directories that don't need scanning
          skip-dirs: 'target,archive,.runs,.git'
          # Timeout for long scans
          timeout: '10m'

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-repository'

      - name: Run Trivy vulnerability scanner (table format for PR comments)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail on CRITICAL/HIGH findings
          ignore-unfixed: true
          scanners: 'vuln,config,secret'
          skip-dirs: 'target,archive,.runs,.git'

      - name: Upload Trivy scan results (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-repo-scan-results
          path: trivy-results.sarif
          retention-days: 30

  trivy-docker-scan:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: preflight-latest-check
    if: (needs.preflight-latest-check.outputs.is_latest == 'true') && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -t perl-lsp:${{ github.sha }} -f .docker/rust/Dockerfile .

      - name: Run Trivy vulnerability scanner (Docker image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'perl-lsp:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          ignore-unfixed: true
          scanners: 'vuln'
          timeout: '15m'

      - name: Upload Trivy Docker results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-docker-results.sarif'
          category: 'trivy-docker'

      - name: Upload Trivy Docker results (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-docker-scan-results
          path: trivy-docker-results.sarif
          retention-days: 30
