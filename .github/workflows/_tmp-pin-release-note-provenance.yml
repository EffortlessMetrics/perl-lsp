name: Temporary pin release-note provenance

on:
  push:
    branches:
      - docs/release-notes-provenance
    paths:
      - scripts/_pin_release_note_provenance_tmp.py
      - .github/workflows/_tmp-pin-release-note-provenance.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: docs/release-notes-provenance
          fetch-depth: 0

      - name: Apply and validate provenance pins
        run: |
          set -euo pipefail
          python3 scripts/_pin_release_note_provenance_tmp.py
          grep -q '^tag_commit: "15cbe7e6295a67ea0cba506c3cade628ee4847f6"$' docs/releases/v0.15.1.md
          grep -q '^tag_commit: "b6d9f12b995ad8ad78ca641940bd73e4b1a3c26d"$' docs/releases/v0.16.0.md
          grep -q '^source_compare_classification: incomplete$' docs/releases/v0.16.0.md
          grep -q '^tag_commit: "ffee2824938f415e54923112c7b79e3f22040699"$' docs/releases/v0.17.0.md
          grep -q '^source_compare_classification: inflated$' docs/releases/v0.17.0.md
          git diff --check

      - name: Remove one-shot machinery
        run: |
          rm scripts/_pin_release_note_provenance_tmp.py
          rm .github/workflows/_tmp-pin-release-note-provenance.yml

      - name: Commit provenance pins
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(release): pin note tag commits and compare classes'
          git push origin HEAD:refs/heads/docs/release-notes-provenance
