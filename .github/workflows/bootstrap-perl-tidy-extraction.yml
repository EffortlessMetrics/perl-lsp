name: Bootstrap perl-tidy extraction

on:
  push:
    branches:
      - refactor/perl-tidy-extraction-10233
    paths:
      - .github/workflows/bootstrap-perl-tidy-extraction.yml

concurrency:
  group: bootstrap-perl-tidy-extraction-10233
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap complete]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: refactor/perl-tidy-extraction-10233

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Extract formatter ownership surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path.cwd()
          old = root / "crates/perl-lsp-perltidy"
          native = root / "crates/perl-tidy"
          external = root / "crates/perl-tidy-perltidy"

          if not old.is_dir():
              raise SystemExit("missing source crate crates/perl-lsp-perltidy")
          if native.exists() or external.exists():
              raise SystemExit("target extraction crates already exist")

          def write(path: Path, content: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")

          def replace_once(path: Path, old_text: str, new_text: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old_text)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one occurrence in {path}: {old_text!r}; found {count}"
                  )
              path.write_text(text.replace(old_text, new_text, 1), encoding="utf-8")

          # ---- perl-tidy: canonical Rust-native formatter -----------------
          (native / "src").mkdir(parents=True)
          shutil.copy2(old / "src/native.rs", native / "src/native.rs")
          shutil.copytree(old / "src/native", native / "src/native")

          native_lib = '''//! Rust-native, parse-gated Perl source formatting.
          //!
          //! `perl-tidy` owns formatter policy, layout, diagnostics, and edit
          //! production. It deliberately knows nothing about LSP transport,
          //! UTF-16 protocol coordinates beyond its current compatibility API,
          //! subprocess execution, or filesystem replacement.

          #![deny(unsafe_code)]
          #![cfg_attr(test, allow(clippy::panic, clippy::unwrap_used, clippy::expect_used))]
          #![warn(rust_2018_idioms)]
          #![warn(missing_docs)]

          pub mod native;

          pub use native::{
              BracePlacement, ElsePlacement, FinalNewline, FormatConfig, FormatDiagnostic,
              FormatDiagnosticSeverity, FormatDoc, FormatResult, FormatterMode, KeywordSpacing,
              NativeFormatter, PerlFormatter, TextEdit, TextPosition, TextRange, TrailingComma,
          };
          '''
          write(native / "src/lib.rs", native_lib)

          native_manifest = '''[package]
          name = "perl-tidy"
          version.workspace = true
          edition.workspace = true
          rust-version.workspace = true
          authors.workspace = true
          description = "Rust-native, parse-gated Perl source formatter"
          readme = "README.md"
          license.workspace = true
          repository.workspace = true
          homepage.workspace = true
          documentation = "https://docs.rs/perl-tidy"
          keywords = ["perl", "formatter", "formatting"]
          categories = ["development-tools", "text-editors"]

          [lib]
          doctest = false

          [dependencies]
          perl-parser-core = { workspace = true }
          serde = { workspace = true }

          [dev-dependencies]
          perl-tdd-support = { workspace = true }
          serde_json = { workspace = true }
          tempfile = { workspace = true }

          [package.metadata.docs.rs]
          rustdoc-args = ["--cfg", "docsrs"]

          [lints]
          workspace = true
          '''
          write(native / "Cargo.toml", native_manifest)

          native_readme = '''# perl-tidy

          `perl-tidy` is the canonical Rust-native Perl formatter library. It owns
          parse-gated formatting, layout configuration, diagnostics, and edit
          production without depending on an LSP server or an external executable.

          ```rust
          use perl_tidy::{FormatConfig, NativeFormatter, PerlFormatter};

          let result = NativeFormatter::new()
              .format_document("my$x=1;\n", &FormatConfig::default());
          assert_eq!(result.formatted, "my $x = 1;\n");
          ```

          External `Perl::Tidy` compatibility lives in `perl-tidy-perltidy`.
          Protocol-coordinate conversion and live-document admission belong to the
          consuming editor/LSP adapter.
          '''
          write(native / "README.md", native_readme)

          native_claude = '''# CLAUDE.md (perl-tidy)

          ## Role

          Canonical Rust-native Perl source formatter.

          ## Owns

          - Parse-gated native formatting and range formatting.
          - Native formatter configuration, layout IR, diagnostics, and edits.
          - Preservation/refusal rules for Perl surfaces that cannot yet be rewritten safely.

          ## Must not own

          - LSP request/response types or live-document lifecycle.
          - Subprocess execution or discovery of `perl` / `perltidy`.
          - Filesystem writes or metadata-preserving replacement.

          ## Focused validation

          `cargo test -p perl-tidy --all-targets`
          '''
          write(native / "CLAUDE.md", native_claude)

          native_tests = [
              "native_contract_tests.rs",
              "native_doc_ir_tests.rs",
              "native_formatter_layout_tests.rs",
              "native_formatter_parse_gate_tests.rs",
              "native_ir_and_types_tests.rs",
          ]
          (native / "tests").mkdir()
          for name in native_tests:
              source = old / "tests" / name
              target = native / "tests" / name
              shutil.copy2(source, target)
              target.write_text(
                  target.read_text(encoding="utf-8").replace(
                      "perl_lsp_perltidy", "perl_tidy"
                  ),
                  encoding="utf-8",
              )
          if (old / "tests/fixtures").exists():
              shutil.copytree(old / "tests/fixtures", native / "tests/fixtures")

          dependency_contract = '''#[test]
          fn native_manifest_excludes_protocol_and_subprocess_dependencies() {
              let manifest = include_str!("../Cargo.toml");
              for forbidden in ["lsp-types", "perl-lsp-", "perl-subprocess-runtime"] {
                  assert!(
                      !manifest.contains(forbidden),
                      "perl-tidy must not depend on {forbidden}"
                  );
              }
          }
          '''
          write(native / "tests/dependency_contract.rs", dependency_contract)

          # ---- perl-tidy-perltidy: explicit external compatibility adapter --
          old_lib = (old / "src/lib.rs").read_text(encoding="utf-8")
          marker = "#![deny(unsafe_code)]"
          marker_at = old_lib.find(marker)
          if marker_at < 0:
              raise SystemExit("could not locate perl-lsp-perltidy crate attributes")
          external_lib = old_lib[marker_at:]
          external_lib, substitutions = re.subn(
              r"pub mod native;\n\npub use native::\{.*?\n\};\n\n",
              "",
              external_lib,
              count=1,
              flags=re.S,
          )
          if substitutions != 1:
              raise SystemExit("could not remove native exports from external adapter")
          external_header = '''//! Explicit subprocess adapter for `Perl::Tidy` compatibility.
          //!
          //! This crate owns configuration and invocation of the external `perltidy`
          //! executable. The Rust-native formatter lives in `perl-tidy`.

          '''
          external_lib = external_header + external_lib
          write(external / "src/lib.rs", external_lib)

          external_manifest = '''[package]
          name = "perl-tidy-perltidy"
          version.workspace = true
          edition.workspace = true
          rust-version.workspace = true
          authors.workspace = true
          description = "Explicit subprocess adapter for Perl::Tidy compatibility"
          readme = "README.md"
          license.workspace = true
          repository.workspace = true
          homepage.workspace = true
          documentation = "https://docs.rs/perl-tidy-perltidy"
          keywords = ["perl", "perltidy", "formatter", "formatting"]
          categories = ["development-tools", "text-editors"]

          [lib]
          doctest = false

          [dependencies]
          perl-subprocess-runtime = { workspace = true }
          serde = { workspace = true }

          [dev-dependencies]
          perl-tdd-support = { workspace = true }
          serde_json = { workspace = true }
          tempfile = { workspace = true }

          [package.metadata.docs.rs]
          rustdoc-args = ["--cfg", "docsrs"]

          [lints]
          workspace = true
          '''
          write(external / "Cargo.toml", external_manifest)

          external_readme = '''# perl-tidy-perltidy

          `perl-tidy-perltidy` is the explicit compatibility adapter for projects
          that require the external `perltidy` executable or exact `Perl::Tidy`
          behavior. It owns command-line configuration, subprocess invocation,
          memoization, and legacy direct-consumer helpers.

          The default native formatter is `perl-tidy`; this adapter is never selected
          merely because `perltidy` happens to be installed.
          '''
          write(external / "README.md", external_readme)

          external_claude = '''# CLAUDE.md (perl-tidy-perltidy)

          ## Role

          Explicit subprocess-backed compatibility adapter for `Perl::Tidy`.

          ## Owns

          - `PerlTidyConfig` and command-line argument generation.
          - `PerlTidyFormatter`, process invocation, and memoized external output.
          - Legacy `BuiltInFormatter` / `FormatSuggestion` compatibility helpers.

          ## Must not own

          - The Rust-native formatter engine.
          - LSP request wiring or protocol-coordinate conversion.

          ## Focused validation

          `cargo test -p perl-tidy-perltidy --all-targets`
          '''
          write(external / "CLAUDE.md", external_claude)

          external_tests = ["config_tests.rs", "formatting_tests.rs", "subprocess_tests.rs"]
          (external / "tests").mkdir()
          for name in external_tests:
              source = old / "tests" / name
              target = external / "tests" / name
              shutil.copy2(source, target)
              target.write_text(
                  target.read_text(encoding="utf-8").replace(
                      "perl_lsp_perltidy", "perl_tidy_perltidy"
                  ),
                  encoding="utf-8",
              )
          if (old / "tests/fixtures").exists():
              shutil.copytree(old / "tests/fixtures", external / "tests/fixtures")

          # ---- perl-lsp-perltidy: compatibility facade only ----------------
          facade_lib = '''//! Compatibility facade for the formatter crate split.
          //!
          //! New native consumers should depend on `perl-tidy`; consumers that
          //! explicitly invoke external `perltidy` should depend on
          //! `perl-tidy-perltidy`. This crate preserves the historical public paths
          //! while downstream callers migrate.

          #![deny(unsafe_code)]
          #![warn(rust_2018_idioms)]
          #![warn(missing_docs)]

          /// Historical native-module path, re-exported from `perl-tidy`.
          pub mod native {
              pub use perl_tidy::native::*;
          }

          pub use perl_tidy::{
              BracePlacement, ElsePlacement, FinalNewline, FormatConfig, FormatDiagnostic,
              FormatDiagnosticSeverity, FormatDoc, FormatResult, FormatterMode, KeywordSpacing,
              NativeFormatter, PerlFormatter, TextEdit, TextPosition, TextRange, TrailingComma,
          };
          pub use perl_tidy_perltidy::{
              BuiltInFormatter, FormatSuggestion, PerlTidyConfig, PerlTidyFormatter,
          };
          '''
          write(old / "src/lib.rs", facade_lib)
          shutil.rmtree(old / "src/native")
          (old / "src/native.rs").unlink()

          facade_manifest = '''[package]
          name = "perl-lsp-perltidy"
          version.workspace = true
          edition.workspace = true
          rust-version.workspace = true
          authors.workspace = true
          description = "Compatibility facade for perl-tidy and perl-tidy-perltidy"
          readme = "README.md"
          license.workspace = true
          repository.workspace = true
          homepage.workspace = true
          documentation = "https://docs.rs/perl-lsp-perltidy"
          keywords = ["perl", "lsp", "perltidy", "formatting"]
          categories = ["development-tools", "text-editors"]

          [lib]
          doctest = false

          [dependencies]
          perl-tidy = { workspace = true }
          perl-tidy-perltidy = { workspace = true }

          [dev-dependencies]
          perl-subprocess-runtime = { workspace = true }
          perl-tdd-support = { workspace = true }
          serde_json = { workspace = true }
          tempfile = { workspace = true }

          [package.metadata.docs.rs]
          rustdoc-args = ["--cfg", "docsrs"]

          [lints]
          workspace = true
          '''
          write(old / "Cargo.toml", facade_manifest)

          facade_readme = '''# perl-lsp-perltidy

          Compatibility facade retained for downstream migration.

          - Use [`perl-tidy`](../perl-tidy/) for the Rust-native formatter.
          - Use [`perl-tidy-perltidy`](../perl-tidy-perltidy/) only for explicit
            external `Perl::Tidy` compatibility.

          The historical root exports and `perl_lsp_perltidy::native` path remain
          available in this release. Removal is gated on downstream migration rather
          than an unconditional date.
          '''
          write(old / "README.md", facade_readme)

          facade_claude = '''# CLAUDE.md (perl-lsp-perltidy)

          ## Role

          Temporary source-compatibility facade for the formatter crate split.

          ## Owns

          - Historical public re-export paths only.
          - Compatibility tests proving old imports continue to compile and behave.

          ## Must not own

          - Native formatter implementation.
          - External process implementation.
          - New production call sites.

          ## Focused validation

          `cargo test -p perl-lsp-perltidy --all-targets`
          '''
          write(old / "CLAUDE.md", facade_claude)

          # ---- Workspace ownership and publish topology --------------------
          cargo = root / "Cargo.toml"
          replace_once(
              cargo,
              '    "crates/perl-lsp-perltidy",\n',
              '    "crates/perl-lsp-perltidy",\n'
              '    "crates/perl-tidy",\n'
              '    "crates/perl-tidy-perltidy",\n',
          )
          replace_once(
              cargo,
              '    "perl-subprocess-runtime",\n',
              '    "perl-subprocess-runtime",\n'
              '    "perl-tidy-perltidy",\n',
          )
          replace_once(
              cargo,
              '    "perl-parser-core",\n',
              '    "perl-parser-core",\n'
              '    "perl-tidy",\n',
          )
          replace_once(
              cargo,
              'perl-lsp-perltidy = { path = "crates/perl-lsp-perltidy", version = "0.17.0" }\n',
              'perl-tidy = { path = "crates/perl-tidy", version = "0.17.0" }\n'
              'perl-tidy-perltidy = { path = "crates/perl-tidy-perltidy", version = "0.17.0" }\n'
              'perl-lsp-perltidy = { path = "crates/perl-lsp-perltidy", version = "0.17.0" }\n',
          )

          # ---- Production consumers use the owning crates -----------------
          core_manifest = root / "crates/perl-lsp-rs-core/Cargo.toml"
          replace_once(
              core_manifest,
              'perl-lsp-perltidy.workspace = true\n',
              'perl-tidy.workspace = true\nperl-tidy-perltidy.workspace = true\n',
          )

          tooling_mod = root / "crates/perl-lsp-rs-core/src/tooling/mod.rs"
          replace_once(
              tooling_mod,
              'pub mod perltidy {\n    pub use perl_lsp_perltidy::*;\n}\n',
              'pub mod perltidy {\n    pub use perl_tidy::*;\n    pub use perl_tidy_perltidy::*;\n}\n',
          )

          config_mod = root / "crates/perl-lsp-rs-core/src/config/mod.rs"
          replace_once(
              config_mod,
              'pub use perl_lsp_perltidy::FormatterMode;\n',
              'pub use perl_tidy::FormatterMode;\n',
          )

          formatting = root / "crates/perl-lsp-rs-core/src/providers/formatting/formatting.rs"
          replace_once(
              formatting,
              '/// Re-export PerlTidyConfig from perl-lsp-perltidy for convenience.\npub use perl_lsp_perltidy::PerlTidyConfig;\n',
              '/// Re-export the explicit external-adapter configuration for convenience.\npub use perl_tidy_perltidy::PerlTidyConfig;\n',
          )

          lsp_manifest = root / "crates/perl-lsp-rs/Cargo.toml"
          replace_once(lsp_manifest, 'perl-lsp-perltidy = { workspace = true }\n', '')
          replace_once(
              lsp_manifest,
              '[dev-dependencies]\n',
              '[dev-dependencies]\nperl-lsp-perltidy = { workspace = true }\n',
          )

          migration = root / "docs/how-to/NATIVE_TOOLING_MIGRATION.md"
          replace_once(
              migration,
              'The native formatter is the default formatter engine in the Rust formatting\nprovider. The subprocess-backed `PerlTidyFormatter` remains available as a\ncompatibility adapter and comparison surface.\n',
              'The native formatter is the default formatter engine in the Rust formatting\nprovider. Its standalone library is `perl-tidy`. The subprocess-backed\n`PerlTidyFormatter` lives in `perl-tidy-perltidy` as an explicit compatibility\nadapter and comparison surface. `perl-lsp-perltidy` remains only as a temporary\nsource-compatibility facade for downstream migration.\n',
          )

          # Production source must no longer import the compatibility facade.
          forbidden = []
          for path in (root / "crates").glob("*/src/**/*.rs"):
              if "perl-lsp-perltidy" in path.parts:
                  continue
              if "perl_lsp_perltidy" in path.read_text(encoding="utf-8"):
                  forbidden.append(str(path.relative_to(root)))
          if forbidden:
              raise SystemExit(
                  "production source still imports perl_lsp_perltidy: " + ", ".join(forbidden)
              )
          PY

      - name: Regenerate lockfile and format
        shell: bash
        run: |
          set -euo pipefail
          cargo update --workspace --quiet
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Test extracted formatter packages
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p perl-tidy --all-targets --locked
          cargo test -p perl-tidy-perltidy --all-targets --locked
          cargo test -p perl-lsp-perltidy --all-targets --locked
          cargo test -p perl-lsp-rs-core --lib --locked formatting

      - name: Check and lint affected packages
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p perl-lsp-rs-core --all-targets --locked
          cargo check -p perl-lsp-rs --all-targets --locked
          cargo clippy \
            -p perl-tidy \
            -p perl-tidy-perltidy \
            -p perl-lsp-perltidy \
            -p perl-lsp-rs-core \
            --all-targets --locked -- -D warnings

      - name: Commit qualified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git rm .github/workflows/bootstrap-perl-tidy-extraction.yml
          git add -A
          git commit \
            -m "refactor(formatting): extract perl-tidy libraries (#10233)" \
            -m "[bootstrap complete]"
          git push origin HEAD:refactor/perl-tidy-extraction-10233
