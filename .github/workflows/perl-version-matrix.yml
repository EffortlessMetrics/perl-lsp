name: Perl Version Matrix

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  perl-version-matrix:
    name: Perl ${{ matrix.perl-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - '5.8'
          - '5.10'
          - '5.12'
          - '5.14'
          - '5.16'
          - '5.18'
          - '5.20'
          - '5.22'
          - '5.24'
          - '5.26'
          - '5.28'
          - '5.30'
          - '5.32'
          - '5.34'
          - '5.36'
          - '5.38'
          - '5.40'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Perl ${{ matrix.perl-version }}
        uses: shogo82148/actions-setup-perl@0f12f8929f8062f1f7795f8a89e9f2f88c5f6ce2 # v1.34.0
        with:
          perl-version: ${{ matrix.perl-version }}

      - name: Report Perl runtime
        run: |
          perl -e 'print "$^V\n";'
          perl -v | head -n 2

      - name: Syntax smoke
        run: |
          cat > smoke.pl <<'PL'
          use strict;
          use warnings;

          package Smoke;
          sub hello {
              my ($name) = @_;
              return "hello $name";
          }

          print Smoke::hello('world'), "\n";
          PL
          perl -c smoke.pl
          perl smoke.pl
