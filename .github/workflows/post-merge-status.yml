name: Post-Merge Status Regeneration

# Automatically regenerates docs/project/status/*.md after every merge to master.
# This eliminates the #1 merge friction point: PRs no longer need to edit CURRENT_STATUS.md
# themselves, ending the cascade of merge conflicts on that hot shared file.
#
# The status directory contains four generated files (lsp.md, tests.md, parser.md, quality.md)
# and three human-owned files (index.md, release.md). Only the generated files are committed.
# CURRENT_STATUS.md is now a stable stub — it is never touched by this workflow.
#
# See issue #2801 (split CURRENT_STATUS.md) and issue #2296 (original post-merge regen).

on:
  push:
    branches:
      - master

# Only one regeneration at a time; cancel stale runs if a new push lands.
concurrency:
  group: post-merge-status-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate-status:
    name: Regenerate status subsystem files
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch full history so git can commit cleanly.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: post-merge-status-${{ hashFiles('Cargo.lock') }}

      - name: Regenerate all status subsystem files and ROADMAP.md
        run: cargo run -p xtask -- update-status --write

      - name: Commit regenerated files if changed
        run: |
          CHANGED_FILES=$(git diff --name-only -- \
            docs/project/status/lsp.md \
            docs/project/status/tests.md \
            docs/project/status/parser.md \
            docs/project/status/quality.md \
            docs/project/ROADMAP.md)

          if [ -n "$CHANGED_FILES" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add \
              docs/project/status/lsp.md \
              docs/project/status/tests.md \
              docs/project/status/parser.md \
              docs/project/status/quality.md \
              docs/project/ROADMAP.md
            git commit -m "chore(docs): regenerate status subsystem files post-merge [skip ci]"
            git push
            echo "::notice::Regenerated status files and pushed."
          else
            echo "::notice::Status files already up to date -- nothing to commit."
          fi
