# PR Plan
#
# Advisory CI economics forecast. Runs on every PR. Reads:
#   policy/ci-budget.toml
#   policy/ci-lanes.toml
#   policy/ci-risk-packs.toml
# Emits target/ci/ci-plan.json and a step summary. Does not block merges.
#
# See docs/ci/perl-lsp-rollout-plan.md (PR 04). Replaced by `xtask ci plan`
# in PR 12.

name: PR Plan

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: pr-plan-${{ github.event.pull_request.number || github.ref }}
  # Only cancel on synchronize so label add/remove events re-run the plan
  # without cancelling an in-progress run. Required by workflow-policy-lint
  # rule LABEL_EVENT_CANCELS_PR_RUN.
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: Forecast LEM and lanes
    runs-on:
      group: em-ci-nano
      labels: [self-hosted, linux, x64, em-ci, trusted-pr, workflow-nano]
    timeout-minutes: 5
    if: github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # System python3 on the self-hosted runner (Ubuntu ships >=3.11 with
      # tomllib). actions/setup-python has no tool-cache build for this
      # runner's OS, and pr_plan.py is stdlib-only, so no setup needed.
      - name: Compute PR Plan
        # continue-on-error so the artifact upload step still runs even when
        # the budget guard returns exit 2 (over hard ceiling, no override).
        continue-on-error: true
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          mkdir -p target/ci
          python3 scripts/ci/pr_plan.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --labels-json "$LABELS_JSON" \
            --budget policy/ci-budget.toml \
            --lanes policy/ci-lanes.toml \
            --risk-packs policy/ci-risk-packs.toml \
            --trust-lanes policy/trust-lanes.toml \
            --json-out target/ci/ci-plan.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload ci-plan.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-plan
          path: target/ci/ci-plan.json
          retention-days: 14
          if-no-files-found: warn

      - name: Budget guard (hard ceiling)
        # Re-surface a non-zero exit from the planner so over-ceiling PRs that
        # don't have a `full-ci` or `ci-budget-override` label visibly fail.
        # Sub-125-LEM PRs and acknowledged over-ceiling PRs pass.
        if: always() && steps.plan.outcome == 'failure'
        run: |
          echo "::error::PR Plan returned a non-success exit code; see the step summary."
          # Fail this job so the budget guard is visible. The PR Plan workflow
          # is not a required check, so this never blocks merges — it only
          # surfaces budget overruns to the contributor.
          exit 1
