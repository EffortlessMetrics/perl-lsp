[package]
name = "perl-ts-advanced-parsers"
version = "0.12.2"
edition = "2024"
rust-version = "1.92"
description = "Composed parser experiments for Perl"
publish = false
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/EffortlessMetrics/perl-lsp"
homepage = "https://github.com/EffortlessMetrics/perl-lsp"
documentation = "https://docs.rs/perl-ts-advanced-parsers"
keywords = ["perl", "parser", "heredoc", "incremental", "lsp"]
categories = ["parsing", "development-tools", "text-processing"]

[dependencies]
regex.workspace = true
serde = { workspace = true }
pest = "2.8.4"
perl-ts-heredoc-parser = { path = "../perl-ts-heredoc-parser" }
perl-parser-pest = { path = "../perl-parser-pest" }
tracing.workspace = true

[features]
stress-tests = []

[dev-dependencies]
perl-tdd-support = { path = "../perl-tdd-support" }

[lints.rust]
unused_imports = "warn"
dead_code = "warn"

[lints.clippy]
collapsible_if = "warn"
manual_strip = "warn"
unnecessary_map_or = "warn"
redundant_closure = "warn"
while_let_on_iterator = "warn"
len_zero = "warn"
only_used_in_recursion = "warn"
ptr_arg = "warn"
