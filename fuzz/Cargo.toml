[package]
name = "perl-parser-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.perl-parser]
path = "../crates/perl-parser"
features = ["incremental"]

[dependencies.serde_json]
version = "1.0.149"
[dependencies.perl-lsp-rs-core]
path = "../crates/perl-lsp-rs-core"

[dependencies.perl-lexer]
path = "../crates/perl-lexer"

[dependencies.perl-dap]
path = "../crates/perl-dap"

