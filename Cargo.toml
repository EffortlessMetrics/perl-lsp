exclude = [
    "tree-sitter-perl",           # Legacy C parser
    "fuzz",                       # cargo-fuzz specialized requirements
    "archive",                    # Archived legacy components
]

[workspace.metadata.publish]
allow = [
    # Complete publish allowlist in topological dependency order.
    # Workspace crates needed for perl-lsp, perl-parser, and perl-dap.

    # Tier 1 — Leaf crates (no workspace deps)
    "perl-position-tracking",
    "perl-token",
    "perl-builtins",
    "perl-builtins-phf",
    "perl-content-length-framing",
    "perl-percentile",
    "perl-subprocess-runtime",
    "perl-lsp-protocol",
    "perl-lsp-symbol-query",
    "perl-keywords",
    "perl-regex",
    "perl-quote",
    "perl-pod",
    "perl-heredoc-anti-patterns",
    "tree-sitter-perl-c",

    # Tier 1b — Depend only on Tier 1 crates
    "perl-ast",
    "perl-ast-v2",
    "perl-lexer",
    "perl-heredoc",

    # Tier 1c — Depend on Tier 1b crates
    "perl-error",
    "perl-pragma",
    "perl-tokenizer",

    # Tier 2 — Core infrastructure
    "perl-parser-core",
    "perl-test-must",
    "perl-tdd-support",
    # Tier 2+ — Rust-native tree-sitter facade (depends on perl-parser-core + perl-ast)
    "tree-sitter-perl-rs",
    "perl-test-generators",
    "perl-edit",
    "perl-incremental-parsing",
    "perl-symbol-types",
    "perl-symbol-surface",
    "perl-symbol-cursor",
    "perl-symbol-index",
    "perl-uri-classify",
    "perl-uri",
    "perl-workspace-index-state-machine",
    "perl-path-normalize",
    "perl-workspace-index-slo",
    "perl-workspace-index-monitoring",
    # Tier 3 — Analysis and indexing
    "perl-workspace-index",
    "perl-semantic-analyzer",
    "perl-lsp-diagnostic-types",
    "perl-lsp-diagnostics",
    "perl-lsp-text-utils",
    "perl-lsp-rename",
    "perl-lsp-code-actions",
    "perl-lsp-folding",
    "perl-lsp-selection-range",
    "perl-lsp-completion",
    "perl-lsp-file-completion",
    "perl-lsp-completion-item",
    "perl-lsp-inline-completion",
    "perl-lsp-ai-provider",
    "perl-lsp-inlay-hints",
    "perl-lsp-code-lens",
    "perl-lsp-color-provider",

    # Tier 3 — Module resolution chain (unified facade; absorbs perl-module-* in Wave 1)
    "perl-module",

    # Tier 4 — LSP providers
    "perl-lsp-navigation",
    "perl-lsp-type-hierarchy",
    "perl-lsp-document-highlight",
    "perl-lsp-document-links",
    "perl-lsp-workspace-symbols",
    "perl-lsp-tooling",
    "perl-lsp-perltidy",
    "perl-lsp-performance",
    "perl-lsp-critic-parser",
    "perl-lsp-formatting-types",
    "perl-lsp-formatting",
    "perl-lsp-on-type-formatting",
    "perl-lsp-semantic-tokens",
    "perl-lsp-providers",
    "perl-ast-utils",
    "perl-lsp-import-management",
    "perl-qualified-name",
    "perl-refactoring",

    # Tier 5 — Application crates
    "perl-dead-code",
    "perl-parser",
    "perl-parser-bench",
    "perl-parser-pest",
    "perl-corpus",

    # Tier 5 — DAP components (Wave H: satellites collapsed into perl-dap)
    "perl-path-security",
    "perl-feature-catalog",
    "perl-dap",

    # Tier 5 — LSP governance and infrastructure
    "perl-lsp-cancellation",
    "perl-lsp-input-validation",
    "perl-lsp-feature-ids",
    "perl-lsp-capability-map",
    "perl-lsp-feature-contracts",
    "perl-lsp-feature-flags",
    "perl-lsp-feature-profile",
    "perl-lsp-feature-profile-cli",
    "perl-lsp-feature-policy",
    "perl-lsp-feature-grid",
    "perl-lsp-feature-governance",
    "perl-lsp-launcher",
    "perl-lsp-diagnostic-catalog",
    "perl-lsp-limits",
    "perl-lsp-uri",
    "perl-lsp-config",
    "perl-lsp-transport",

    # Tier 6 — Module resolution higher tiers
    "perl-text-line",
    "perl-line-index",
    "perl-workspace-folder",
    "perl-workspace-ignore",
    "perl-source-file",
    "perl-workspace-discovery",
    "perl-diagnostics-codes",

    # Tier 7 — Top-level application
    "perl-lsp-rs",
    "perllsp",
]

# Workspace-level package metadata
[workspace.package]
version = "0.12.4"
edition = "2024"
rust-version = "1.92"
authors = ["Steven Zimmerman, CPA <git@effortlesssteven.com>"]
description = "Perl parser, LSP, and DAP ecosystem in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EffortlessMetrics/perl-lsp"
homepage = "https://github.com/EffortlessMetrics/perl-lsp"

[workspace.dependencies]
perl-ast-v2 = { path = "crates/perl-ast-v2", version = "0.12.4" }
