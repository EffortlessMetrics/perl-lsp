tree-sitter-perl-rs = { path = "crates/tree-sitter-perl-rs", version = "0.12.4" }
tree-sitter = "0.26.8"
ropey = "1.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
regex = "1.12.2"
thiserror = "2.0.18"
tempfile = "3.24.0"
anyhow = "1.0.102"
url = "2.5.8"
lsp-types = "0.97.0"
parking_lot = "0.12.5"
once_cell = "1.21.3"
tracing = "0.1.44"
walkdir = "2.5.0"
clap = { version = "4.5.60", features = ["derive"] }
tokio = { version = "1.51.1", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "time"] }
proptest = "1.11.0"
criterion = "0.8.1"

# Profile for development - slightly optimized for better performance
[profile.dev]
opt-level = 1

# Profile for release builds - fully optimized
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"

# Profile for benchmarks - maximum optimization
[profile.bench]
inherits = "release"
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Workspace lints
[workspace.lints.clippy]
collapsible_if = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ci)', 'cfg(feature, values("slow_tests"))'] }
