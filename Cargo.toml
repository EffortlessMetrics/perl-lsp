[workspace]
resolver = "2"
members = [
    "crates/perl-ast",
    "crates/perl-ast-v2",
    "crates/perl-token",
    "crates/perl-pragma",
    "crates/perl-regex",
    "crates/perl-lexer",
    "crates/perl-parser",
    "crates/perl-parser-bench",
    "crates/perl-parser-core",
    "crates/perl-parser-pest",
    "crates/perl-semantic-analyzer",
    "crates/perl-workspace-index",
    "crates/perl-refactoring",
    "crates/perl-incremental-parsing",
    "crates/perl-tdd-support",
    "crates/perl-test-must",
    "crates/perl-test-generators",
    "crates/perl-lsp-providers",
    "crates/perl-lsp-rename",
    "crates/perl-lsp-protocol",
    "crates/perl-lsp-rs-core",
    "crates/perl-lsp-transport",
    "crates/perl-lsp-on-type-formatting",
    "crates/perl-lsp-tooling",
    "crates/perl-lsp-perltidy",
    "crates/perl-lsp-symbol-query",
    "crates/perl-lsp-performance",
    "crates/perl-lsp-critic-parser",
    "crates/perl-subprocess-runtime",
    "crates/perl-lsp-formatting",
    "crates/perl-lsp-formatting-types",
    "crates/perl-lsp-diagnostics",
    "crates/perl-lsp-semantic-tokens",
    "crates/perl-lsp-inlay-hints",
    "crates/perl-lsp-code-lens",
    "crates/perl-lsp-feature-governance",
    "crates/perl-lsp-launcher",
    "crates/perl-lsp-navigation",
    "crates/perl-lsp-type-hierarchy",
    "crates/perl-lsp-document-links",
    "crates/perl-lsp-workspace-symbols",
    "crates/perl-lsp-completion",
    "crates/perl-lsp-file-completion",
    "crates/perl-lsp-completion-item",
    "crates/perl-lsp-inline-completion",
    "crates/perl-lsp-ai-provider",
    "crates/perl-lsp-code-actions",
    "crates/perl-lsp-document-highlight",
    "crates/perl-lsp-folding",
    "crates/perl-lsp-selection-range",
    "crates/perl-lsp-import-management",
    "crates/perl-lsp-text-utils",
    "crates/perl-lsp-color-provider",
    "crates/perl-lsp-cancellation",
    "crates/perl-lsp-input-validation",
    "crates/perl-lsp-limits",
    "crates/perl-lsp-uri",
    "crates/perl-lsp-config",
    "crates/perl-diagnostics",
    "crates/perl-position-tracking",
    "crates/perl-symbol",
    "crates/perl-module",
    "crates/perl-line-index",
    "crates/perl-content-length-framing",
    "crates/perl-uri",
    "crates/perl-pod",
    "crates/perl-corpus",
    "crates/perl-lsp",
    "crates/perl-lsp-ux-tests",
    "crates/perllsp",
    "crates/perl-dap",
    "crates/perl-dead-code",
    "crates/perl-feature-catalog",
    "crates/tree-sitter-perl-c",
    "crates/tree-sitter-perl-rs",
    "crates/perl-ci-hygiene",
    "xtask",
]

exclude = [
    "tree-sitter-perl",           # Legacy C parser
    "fuzz",                       # cargo-fuzz specialized requirements
    "archive",                    # Archived legacy components
]

[workspace.metadata.publish]
allow = [
    # Complete publish allowlist in topological dependency order.
    # Workspace crates needed for perl-lsp, perl-parser, and perl-dap.

    # Tier 1 — Leaf crates (no workspace deps)
    "perl-position-tracking",
    "perl-token",
    "perl-content-length-framing",
    # (perl-percentile absorbed into perl-parser — Wave D)
    "perl-subprocess-runtime",
    "perl-lsp-protocol",
    "perl-lsp-symbol-query",
    "perl-regex",
    "perl-pod",
    "tree-sitter-perl-c",
    # (perl-heredoc-anti-patterns absorbed into perl-parser — Wave D)

    # Tier 1b — Depend only on Tier 1 crates
    "perl-ast",
    "perl-ast-v2",
    "perl-lexer",

    # Tier 1c — Depend on Tier 1b crates
    "perl-pragma",

    # Tier 2 — Core infrastructure
    # (perl-quote, perl-heredoc, perl-error, perl-edit absorbed into perl-parser-core — Wave D)
    "perl-parser-core",
    "perl-test-must",
    "perl-tdd-support",
    # Tier 2+ — Rust-native tree-sitter facade (depends on perl-parser-core + perl-ast)
    "tree-sitter-perl-rs",
    "perl-test-generators",
    "perl-incremental-parsing",
    "perl-symbol",
    "perl-uri",
    # (perl-path-normalize, perl-path-security, perl-text-line absorbed into perl-parser-core — Wave D)
    # Tier 3 — Analysis and indexing
    "perl-workspace",
    "perl-semantic-analyzer",
    "perl-diagnostics",
    "perl-lsp-diagnostics",
    "perl-lsp-text-utils",
    "perl-lsp-rename",
    "perl-lsp-code-actions",
    "perl-lsp-folding",
    "perl-lsp-selection-range",
    "perl-lsp-completion",
    "perl-lsp-file-completion",
    "perl-lsp-completion-item",
    "perl-lsp-inline-completion",
    "perl-lsp-ai-provider",
    "perl-lsp-inlay-hints",
    "perl-lsp-code-lens",
    "perl-lsp-color-provider",

    # Tier 3 — Module resolution chain (unified facade; absorbs perl-module-* in Wave 1)
    "perl-module",

    # Tier 4 — LSP providers
    "perl-lsp-navigation",
    "perl-lsp-type-hierarchy",
    "perl-lsp-document-highlight",
    "perl-lsp-document-links",
    "perl-lsp-workspace-symbols",
    "perl-lsp-tooling",
    "perl-lsp-perltidy",
    "perl-lsp-performance",
    "perl-lsp-critic-parser",
    "perl-lsp-formatting-types",
    "perl-lsp-formatting",
    "perl-lsp-on-type-formatting",
    "perl-lsp-semantic-tokens",
    "perl-lsp-providers",
    # (perl-ast-utils, perl-qualified-name absorbed into perl-parser — Wave D)
    "perl-lsp-import-management",
    "perl-refactoring",

    # Tier 5 — Application crates
    "perl-dead-code",
    "perl-parser",
    "perl-parser-bench",
    "perl-parser-pest",
    "perl-corpus",

    # Tier 5 — DAP components (Wave H: satellites collapsed into perl-dap)
    # (perl-path-security absorbed into perl-parser-core — Wave D)
    "perl-feature-catalog",
    "perl-dap",

    # Tier 5 — LSP governance and infrastructure
    # (perl-lsp-feature-* and perl-lsp-capability-map absorbed into perl-lsp-rs-core — Wave F)
    "perl-lsp-cancellation",
    "perl-lsp-input-validation",
    "perl-lsp-rs-core",
    "perl-lsp-feature-governance",
    "perl-lsp-launcher",
    "perl-lsp-limits",
    "perl-lsp-uri",
    "perl-lsp-config",
    "perl-lsp-transport",

    # Tier 6 — Module resolution higher tiers
    # (perl-text-line, perl-source-file absorbed — Wave D)
    "perl-line-index",

    # Tier 7 — Top-level application
    "perl-lsp-rs",
    "perllsp",
]

# Workspace-level package metadata
[workspace.package]
version = "0.12.4"
edition = "2024"
rust-version = "1.92"
authors = ["Steven Zimmerman, CPA <git@effortlesssteven.com>"]
description = "Perl parser, LSP, and DAP ecosystem in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EffortlessMetrics/perl-lsp"
homepage = "https://github.com/EffortlessMetrics/perl-lsp"

[workspace.dependencies]
perl-ast-v2 = { path = "crates/perl-ast-v2", version = "0.12.4" }
# Tier 1: Leaf crates (no internal dependencies)
perl-token = { path = "crates/perl-token", version = "0.12.4" }
perl-regex = { path = "crates/perl-regex", version = "0.12.4" }
perl-pragma = { path = "crates/perl-pragma", version = "0.12.4" }
perl-lexer = { path = "crates/perl-lexer", version = "0.12.4" }
perl-ast = { path = "crates/perl-ast", version = "0.12.4" }
# Wave D absorbed (internal modules in perl-parser/src/):
#   perl-heredoc-anti-patterns → perl-parser::heredoc_anti_patterns
# Wave D absorbed (internal modules in perl-parser-core/src/syntax/):
#   perl-quote, perl-heredoc, perl-error, perl-edit
perl-position-tracking = { path = "crates/perl-position-tracking", version = "0.12.4" }
perl-symbol = { path = "crates/perl-symbol", version = "0.12.4" }
perl-module = { path = 'crates/perl-module', version = "0.12.4" }
# Wave D absorbed: perl-qualified-name → perl-parser::qualified_name
perl-line-index = { path = "crates/perl-line-index", version = "0.12.4" }
# Wave D absorbed: perl-source-file → perl-parser::source_file
# Wave D absorbed: perl-text-line → perl-parser-core::text_line
perl-content-length-framing = { path = "crates/perl-content-length-framing", version = "0.12.4" }
perl-subprocess-runtime = { path = "crates/perl-subprocess-runtime", version = "0.12.4" }
perl-lsp-document-highlight = { path = "crates/perl-lsp-document-highlight", version = "0.12.4" }
perl-lsp-document-links = { path = "crates/perl-lsp-document-links", version = "0.12.4" }
perl-lsp-performance = { path = "crates/perl-lsp-performance", version = "0.12.4" }
perl-lsp-symbol-query = { path = "crates/perl-lsp-symbol-query", version = "0.12.4" }
# Wave D absorbed: perl-ast-utils → perl-parser::ast_utils
perl-lsp-input-validation = { path = "crates/perl-lsp-input-validation", version = "0.12.4" }
perl-lsp-text-utils = { path = "crates/perl-lsp-text-utils", version = "0.12.4" }
perl-uri = { path = "crates/perl-uri", version = "0.12.4" }
# Wave D absorbed: perl-percentile → perl-parser::percentile
perl-lsp-import-management = { path = "crates/perl-lsp-import-management", version = "0.12.4" }
perl-lsp-critic-parser = { path = "crates/perl-lsp-critic-parser", version = "0.12.4" }
perl-lsp-protocol = { path = "crates/perl-lsp-protocol", version = "0.12.4" }
# Wave D absorbed: perl-path-normalize → perl-parser-core::path_normalize
# Wave D absorbed: perl-path-security → perl-parser-core::path_security
perl-lsp-rs-core = { path = "crates/perl-lsp-rs-core", version = "0.12.4" }
perl-pod = { path = "crates/perl-pod", version = "0.12.4" }
perl-corpus = { path = "crates/perl-corpus", version = "0.12.4" }
perl-dap = { path = "crates/perl-dap", version = "0.12.4" }
perl-dead-code = { path = "crates/perl-dead-code", version = "0.12.4" }
perl-feature-catalog = { path = "crates/perl-feature-catalog", version = "0.12.4" }
# Tier 2: Single-level dependencies
perl-parser-core = { path = "crates/perl-parser-core", version = "0.12.4" }
perl-lsp-transport = { path = "crates/perl-lsp-transport", version = "0.12.4" }
perl-lsp-tooling = { path = "crates/perl-lsp-tooling", version = "0.12.4" }
perl-lsp-perltidy = { path = "crates/perl-lsp-perltidy", version = "0.12.4" }
perl-lsp-on-type-formatting = { path = "crates/perl-lsp-on-type-formatting", version = "0.12.4" }
perl-lsp-formatting-types = { path = "crates/perl-lsp-formatting-types", version = "0.12.4" }
perl-lsp-formatting = { path = "crates/perl-lsp-formatting", version = "0.12.4" }
perl-tdd-support = { path = "crates/perl-tdd-support", version = "0.12.4" }
perl-test-must = { path = "crates/perl-test-must", version = "0.12.4" }
perl-lsp-diagnostics = { path = "crates/perl-lsp-diagnostics", version = "0.12.4" }
perl-lsp-semantic-tokens = { path = "crates/perl-lsp-semantic-tokens", version = "0.12.4" }
perl-lsp-inlay-hints = { path = "crates/perl-lsp-inlay-hints", version = "0.12.4" }
perl-lsp-code-lens = { path = "crates/perl-lsp-code-lens", version = "0.12.4" }
perl-lsp-color-provider = { path = "crates/perl-lsp-color-provider", version = "0.12.4" }
perl-lsp-cancellation = { path = "crates/perl-lsp-cancellation", version = "0.12.4" }
perl-lsp-limits = { path = "crates/perl-lsp-limits", version = "0.12.4" }
perl-lsp-uri = { path = "crates/perl-lsp-uri", version = "0.12.4" }
perl-lsp-config = { path = "crates/perl-lsp-config", version = "0.12.4" }
perl-lsp-feature-governance = { path = "crates/perl-lsp-feature-governance", version = "0.12.4" }
perl-lsp-launcher = { path = "crates/perl-lsp-launcher", version = "0.12.4" }
perl-lsp-navigation = { path = "crates/perl-lsp-navigation", version = "0.12.4" }
perl-lsp-type-hierarchy = { path = "crates/perl-lsp-type-hierarchy", version = "0.12.4" }
perl-lsp-workspace-symbols = { path = "crates/perl-lsp-workspace-symbols", version = "0.12.4" }
perl-lsp-rename = { path = "crates/perl-lsp-rename", version = "0.12.4" }
perl-lsp-completion = { path = "crates/perl-lsp-completion", version = "0.12.4" }
perl-lsp-file-completion = { path = "crates/perl-lsp-file-completion", version = "0.12.4" }
perl-lsp-completion-item = { path = "crates/perl-lsp-completion-item", version = "0.12.4" }
perl-lsp-inline-completion = { path = "crates/perl-lsp-inline-completion", version = "0.12.4" }
perl-lsp-ai-provider = { path = "crates/perl-lsp-ai-provider", version = "0.12.4" }
perl-lsp-code-actions = { path = "crates/perl-lsp-code-actions", version = "0.12.4" }
perl-lsp-folding = { path = "crates/perl-lsp-folding", version = "0.12.4" }
perl-lsp-selection-range = { path = "crates/perl-lsp-selection-range", version = "0.12.4" }
perl-diagnostics = { path = "crates/perl-diagnostics", version = "0.12.4" }
# Tier 3: Two-level dependencies
perl-workspace = { path = "crates/perl-workspace-index", version = "0.12.4" }
perl-incremental-parsing = { path = "crates/perl-incremental-parsing", version = "0.12.4" }
perl-refactoring = { path = "crates/perl-refactoring", version = "0.12.4" }

# Tier 4: Three-level dependencies
perl-semantic-analyzer = { path = "crates/perl-semantic-analyzer", version = "0.12.4" }
perl-lsp-providers = { path = "crates/perl-lsp-providers", version = "0.12.4", default-features = false }

# Tier 5: Application crates
perl-parser = { path = "crates/perl-parser", version = "0.12.4" }
perl-lsp-rs = { path = "crates/perl-lsp", version = "0.12.4" }

# Legacy/Compatibility crates
perl-parser-pest = { path = "crates/perl-parser-pest", version = "0.12.4" }

# External dependencies
tree-sitter-perl-c = { path = "crates/tree-sitter-perl-c", version = "0.12.4" }
tree-sitter-perl-rs = { path = "crates/tree-sitter-perl-rs", version = "0.12.4" }
tree-sitter = "0.26.8"
ropey = "1.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
regex = "1.12.2"
thiserror = "2.0.18"
tempfile = "3.24.0"
anyhow = "1.0.102"
url = "2.5.8"
lsp-types = "0.97.0"
parking_lot = "0.12.5"
once_cell = "1.21.3"
tracing = "0.1.44"
walkdir = "2.5.0"
clap = { version = "4.5.60", features = ["derive"] }
tokio = { version = "1.51.1", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "time"] }
proptest = "1.11.0"
criterion = "0.8.1"

# Profile for development - slightly optimized for better performance
[profile.dev]
opt-level = 1

# Profile for release builds - fully optimized
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"

# Profile for benchmarks - maximum optimization
[profile.bench]
inherits = "release"
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Workspace lints
[workspace.lints.clippy]
collapsible_if = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ci)', 'cfg(feature, values("slow_tests"))'] }
