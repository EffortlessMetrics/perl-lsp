exclude = [
    "tree-sitter-perl",           # Legacy C parser
    "crates/tree-sitter-perl-c",  # Requires libclang-dev (bindgen)
    "fuzz",                       # cargo-fuzz specialized requirements
    "archive",                    # Archived legacy components
]

[workspace.metadata.publish]
allow = [
    # Complete publish allowlist in topological dependency order.
    # Workspace crates needed for perl-lsp, perl-parser, and perl-dap.

    # Tier 1 — Leaf crates (no workspace deps)
    "perl-position-tracking",
    "perl-token",
    "perl-builtins",
    "perl-builtins-phf",
    "perl-content-length-framing",
    "perl-percentile",
    "perl-subprocess-runtime",
    "perl-lsp-protocol",
    "perl-lsp-symbol-query",
    "perl-keywords",
    "perl-regex",
    "perl-quote",

    # Tier 1b — Depend only on Tier 1 crates
    "perl-ast",
    "perl-ast-v2",
    "perl-lexer",
    "perl-heredoc",

    # Tier 1c — Depend on Tier 1b crates
    "perl-error",
    "perl-pragma",
    "perl-tokenizer",

    # Tier 2 — Core infrastructure
    "perl-parser-core",
    "perl-tdd-support",
    "perl-edit",
    "perl-source-editing",
    "perl-incremental-parsing",
    "perl-symbol-types",
    "perl-symbol-cursor",
    "perl-symbol-table",
    "perl-symbol-index",
    "perl-uri-classify",
    "perl-uri",
    "perl-workspace-index-state-machine",
    "perl-path-normalize",
    "perl-workspace-index-slo",
    # Tier 3 — Analysis and indexing
    "perl-workspace-index",
    "perl-semantic-analyzer",
    "perl-lsp-diagnostic-types",
    "perl-lsp-diagnostics",
    "perl-lsp-text-utils",
    "perl-lsp-rename",
    "perl-lsp-code-actions",
    "perl-lsp-folding",
    "perl-lsp-completion",
    "perl-lsp-completion-item",
    "perl-lsp-inlay-hints",

    # Tier 3 — Module resolution chain
    "perl-module-name",
    "perl-module-path",
    "perl-module-token-core",
    "perl-module-boundary",
    "perl-module-token",
    "perl-module-import",

    # Tier 4 — LSP providers
    "perl-lsp-navigation",
    "perl-lsp-document-links",
    "perl-lsp-workspace-symbols",
    "perl-lsp-tooling",
    "perl-lsp-performance",
    "perl-lsp-critic-parser",
    "perl-lsp-formatting-types",
    "perl-lsp-formatting",
    "perl-lsp-on-type-formatting",
    "perl-lsp-semantic-tokens",
    "perl-lsp-providers",
    "perl-lsp-ast-utils",
    "perl-lsp-import-management",
    "perl-qualified-name",
    "perl-refactoring",

    # Tier 5 — Application crates
    "perl-dead-code",
    "perl-parser",
    "perl-corpus",

    # Tier 5 — DAP components
    "perl-dap-breakpoint",
    "perl-dap-eval",
    "perl-dap-config",
    "perl-dap-command-args",
    "perl-dap-platform",
    "perl-dap-shell",
    "perl-dap-security",
    "perl-dap-stack",
    "perl-dap-value",
    "perl-dap-variables",
    "perl-path-security",
    "perl-feature-catalog",
    "perl-dap",

    # Tier 5 — LSP governance and infrastructure
    "perl-lsp-cancellation",
    "perl-lsp-input-validation",
    "perl-lsp-feature-ids",
    "perl-lsp-capability-map",
    "perl-lsp-feature-contracts",
    "perl-lsp-feature-flags",
    "perl-lsp-feature-profile",
    "perl-lsp-feature-profile-cli",
    "perl-lsp-feature-policy",
    "perl-lsp-feature-grid",
    "perl-lsp-feature-governance",
    "perl-lsp-launcher",
    "perl-lsp-diagnostic-catalog",
    "perl-lsp-limits",
    "perl-lsp-uri",
    "perl-lsp-config",
    "perl-lsp-transport",

    # Tier 6 — Module resolution higher tiers
    "perl-module-token-parser",
    "perl-text-line",
    "perl-line-index",
    "perl-module-reference",
    "perl-module-import-match",
    "perl-module-rename",
    "perl-module-resolution-path",
    "perl-workspace-folder",
    "perl-workspace-ignore",
    "perl-module-resolution-uri",
    "perl-module-resolution",
    "perl-source-file",
    "perl-workspace-discovery",
    "perl-diagnostics-codes",

    # Tier 7 — Top-level application
    "perl-lsp",
]

