# Quality Gate Exceptions
#
# Temporary debt ledger for proof-lane burn-down. These entries document why the
# transition gate can enforce new RIPR gaps and patch coverage before the repo
# reaches the final ripr+ zero and project coverage targets.

schema_version = 1
policy = "quality-gate-exceptions"
owner = "EffortlessMetrics"
status = "active"
updated = "2026-09-10"
# Review dates create owner work; they must not change an unrelated PR verdict.
due_review = "warn"

[requirements]
required_active = [
  "ripr-total-burndown",
  "project-coverage-burndown",
]

[[exception]]
id = "ripr-total-burndown"
kind = "temporary_burndown"
scope = "ripr_plus_total"
owner = "proof-lane"
issue = "#3121"
reason = "Existing repo-wide RIPR+ gaps predate the transition gate. New gaps are blocked first while existing clusters are burned down with focused proof PRs."
final_target = "repo-wide ripr+ unresolved total = 0"
evidence = "repo-wide RIPR+ receipt at target/receipts/quality/ripr-plus.json; push-to-main run 34289196987 at head 7df72b907a01bda78fc899620019da87b4e4db9c measured active_unresolved=5037, suppressed_unresolved=0, and the exact-head gate passed with new gaps 0; its same-head/base comparison is a new-gap gate result, not evidence of improvement toward the zero-total target; the zero-total removal criterion remains unmet; reviewed under #6216, dispositioned under #13704"
disposition = "renew_with_new_evidence"
falsifier = "A repo-wide ripr-plus receipt at or before review_after measuring active_unresolved = 0 (equivalently, quality-gate final mode passing with no active exception) falsifies this entry; the exception must then be removed at once instead of waiting for expiry."
removal_criteria = "quality-gate final mode requires unresolved total = 0 and no active ripr-total-burndown exception"
created = "2026-05-28"
review_after = "2026-09-16"
expires = "2026-09-30"

[[exception]]
id = "project-coverage-burndown"
kind = "temporary_burndown"
scope = "project_coverage"
owner = "proof-lane"
issue = "#3121"
reason = "Project coverage is below the final 95% floor while patch coverage becomes blocking first."
final_target = "workspace project coverage >= 95%"
evidence = "candidate-only coverage evidence for PR #15196 at head 5b2c3c138ad24c9888577eee2b029c59b43fa4fd; coverage-only run 34300768007 (job 102306990180) completed LCOV before a later xtask compilation was cancelled, without a test or LCOV failure. The existing baseline command, run from an exact 5b2 checkout, processed the immutable mapped report with scope workspace-lib-xtask-quality and checked successfully: 54.42% project coverage (197290/362514 lines), 100.0% patch coverage, 1404 source files, receipt SHA-256 be6cb0a9aa691a4c1e29de21c72432cead21f946738c816b1c0fcffec2b1b014. Original LCOV SHA-256 3e8e5f3be5285bee2b2ac53fb4ef203d916fbc28832252e95dd46af3f5df7a7a; exact-5b2 Windows path-mapped input SHA-256 18d32c33d0dbc7714814be0c5135cedeadcc5a6183df3e82f11020d9a4c17881, with only the 1404 Linux SF prefixes changed, zero non-SF differences, and all mapped source files present; baseline generation and --check both used candidate merge base 7df72b907a01bda78fc899620019da87b4e4db9c. This is candidate evidence, not current-main coverage; the 95% target remains unmet; reviewed under #6216, dispositioned under #13704"
disposition = "renew_with_new_evidence"
falsifier = "A fresh ci-nightly coverage baseline on main (or a blocking Codecov project check) measuring workspace project coverage >= 95% falsifies this entry; the exception must then be removed at once instead of waiting for expiry."
removal_criteria = "Codecov project status is blocking at 95% and no active project-coverage-burndown exception remains"
created = "2026-05-28"
review_after = "2026-09-16"
expires = "2026-09-30"
