# This is the ripr#1429 predicate-infection-untraceable class: RIPR cannot
# statically trace activation from string/char literals through iterative
# scan loops, feature-gated code blocks, or trait-object dispatch. Same
# family as ripr-suppress-phase-block-description-match-arms and
# ripr-suppress-canonical-quote-operator-helper.
