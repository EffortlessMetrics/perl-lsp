# -----------------------------------------------------------------------------
# parse_quote_operator_content: canonical shared helper — activation untraceable.
#
# PR refactor/centralize-qw-parsing merged the per-consumer copies of this
# function (previously in perl-semantic-analyzer/src/analysis/index.rs,
# import_extractor.rs, and perl-module/src/import/mod.rs) into a single
# canonical implementation at:
#   crates/perl-parser-core/src/syntax/quote.rs
#
# The three per-consumer suppressions (ripr-suppress-parse-qw-content-end-lt-start,
# ripr-suppress-import-extractor-quote-operator-activation, and
# ripr-suppress-parse-qw-arg-list-predicate-seams) have been REMOVED because
# those files no longer contain the parsing seams — they delegate to the canonical.
#
# Four `weakly_exposed` seams remain in the canonical helper at quote.rs:
#   (A) s.strip_prefix(operator)? — None on prefix miss
#   (B) chars.next()?             — None on empty rest-string
#   (C) open.is_ascii_alphanumeric() || open == '_' — alphanumeric-guard predicate
#   (D) rest.len().checked_sub(close.len_utf8())?   — arithmetic boundary (end<start)
#
# The existing seam-proof tests from PR #1292 continue to cover all four seams.
# RIPR cannot statically trace activation from test inputs through
# s.strip_prefix → .trim_start() → .chars() → .next() — the same ripr#1429
# class limitation. Remove when ripr#1429 is fixed upstream.
#
# Net suppression change: 3 removed (per-consumer), 1 added (canonical home).
# Cites ripr#1429 and #1289 per project convention.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-canonical-quote-operator-helper"
kind = "predicate_infection_untraceable"
paths = ["crates/perl-parser-core/src/syntax/quote.rs"]
classification = ["static_unknown", "no_static_path"]
owner = "proof-lane"
issue = "EffortlessMetrics/ripr#1429"
reason = "Canonical parse_quote_operator_content helper (centralized in #1289 refactor) has 4 ripr#1429-class seams: strip_prefix (A), chars.next (B), alphanumeric-guard predicate (C), checked_sub arithmetic (D). All seams are covered by inline seam-proof tests from PR #1292 (parse_quote_operator_content_wrong_operator_returns_none, _alphanumeric_delimiter_rejected, _underscore_delimiter_rejected, _mismatched_close_returns_none, etc.). RIPR cannot statically trace activation from string literals through the string-parsing call chain — same ripr#1429 limitation as removed per-consumer suppressions. Net reduction: 3 suppressions removed, 1 canonical suppression added. Remove when ripr#1429 is fixed upstream."
created = "2026-06-11"
review_after = "2026-07-11"
expires = "2026-09-30"

