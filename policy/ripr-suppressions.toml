#   is_method_call_context: 6 unit tests in #[cfg(test)] mod tests (exact bool
#   assertions: arrow-method, class-method, plain function, builtin, inside-args,
#   empty text). 3 integration tests in lsp_signature_help_tests.rs exercise the
