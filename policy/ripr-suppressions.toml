#       in is_method_call_context; RIPR cannot trace coverage from unit-test
#       string literals through the char-by-char scan to the predicate exit.
#   (B) 2 equality-boundary seams — depth==1 boundary in paren scanner, and
#       sym.name == method_name exact-match filter in resolve_method_in_workspace;
#       RIPR names missing discriminator `1` and `method_name` respectively.
#   (C) 4 `activation_unknown` seams — the cfg(feature="workspace")-gated
#       resolve_method_in_workspace body including the IndexAccessMode match,
#       workspace_document_text call, and Parser::new chain; RIPR cannot
#       statically determine activation because the workspace feature guard and
#       trait-object dispatch break static call-graph traversal.
