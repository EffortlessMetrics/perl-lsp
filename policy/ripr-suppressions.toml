# RIPR Suppressions
#
# Suppressions for ripr static exposure analysis findings. Each suppression
# requires owner and reason. Exposure-gap suppressions select a `finding_id`;
# test-efficiency suppressions select a `test` and optional repo-relative `path`.
# Suppressions are the documented exception path; the default is to leave
# findings advisory-visible.
#
# Read by .github/workflows/ripr.yml and ripr.toml.

schema_version = 1
