# Windows CWD-planting RCE fix (#2764): windows.rs platform-gated code.
#
# PR #2967 (fix/windows-bare-tool-cwd-rce) tightens the Windows subprocess
# invocation chain: resolve_windows_program now fails closed when the tool is
# not on any absolute PATH directory, and resolve_cmd_exe refuses the bare
# "cmd.exe" name.  The implementation lives in
# crates/perl-subprocess-runtime/src/os_runtime/windows.rs, which is gated
# on #[cfg(windows)].
#
# On Linux CI runners, the entire windows.rs module is excluded from
# compilation by the platform cfg-guard.  RIPR has no test call paths to
# reach any of its functions (resolve_windows_program, path_dirs_from_env,
# pathext_from_env, resolve_cmd_exe, windows_program_priority) — so every
# changed line is classified no_static_path or weakly_exposed with
# reach=no, observe=no.  This is the same structural limitation as
# ripr#1429 (cfg-guard tracing): the code is correct and its security
# invariants are proven by Windows-only tests that run on the dedicated
# Windows CI runner (ripr+ on CX43 / GitHub Hosted Windows), but the Linux
# diff-scoped pass cannot observe those call paths.
#
# The cross-platform security logic was extracted into path_selection.rs
# (select_path_candidate, candidate_priority) precisely so it CAN be
# tested on Linux CI — that file has full reach/observe/infect evidence.
# windows.rs retains only the Windows-specific orchestration (PATH/PATHEXT
# env lookup, is_file probing, cmd.exe resolution) that requires a Windows
# runner.
#
# Suppression is narrow (single production file). Remove when ripr adds
# cross-platform cfg-guard simulation or when targeted mutation covers
# the Windows-only orchestration path on a non-Linux runner.
# ======================================================================
# -----------------------------------------------------------------------------
