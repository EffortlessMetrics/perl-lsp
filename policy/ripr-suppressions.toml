# RIPR Suppressions
#
# Suppressions for ripr static exposure analysis findings. Each suppression
# requires owner, reason, created, review_after, and expires. Suppressions
# are the documented exception path; the default is to leave findings
# advisory-visible.
#
# Read by .github/workflows/ripr.yml (PR 06+) and ripr.toml.

schema_version = 1
policy = "ripr-suppressions"
owner = "EffortlessMetrics"
status = "advisory"
updated = "2026-06-01"

# -----------------------------------------------------------------------------
# Generated status docs: validated through status-generation checks, not
# Rust test oracle exposure.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-generated-status-docs"
kind = "generated_or_non_production_surface"
paths = ["docs/project/status/**"]
classification = ["static_unknown", "no_static_path"]
owner = "repo-owner"
issue = "TODO"
reason = "Generated status docs are verified through status-generation checks, not Rust test oracle exposure."
created = "2026-05-07"
review_after = "2026-06-07"
expires = "2026-08-07"

# -----------------------------------------------------------------------------
# Archived source: retained historical code, not active workspace behavior.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-archive"
kind = "generated_or_non_production_surface"
paths = ["archive/**"]
owner = "proof-lane"
issue = "#8197"
reason = "Archived source is retained for historical reference and is excluded from active workspace proof targets; current behavior must be proven in live crates instead."
created = "2026-05-28"
review_after = "2026-06-28"
expires = "2026-09-30"

# -----------------------------------------------------------------------------
# UX receipt tests: executable proof artifacts, not production behavior seams.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-ux-receipt-tests"
kind = "test_receipt_surface"
paths = ["crates/perl-lsp-ux-tests/tests/*", "crates/perl-lsp-ux-tests/tests/**"]
owner = "editor-trust"
issue = "#8197"
reason = "Editor UX receipt tests are proof inputs validated by cargo/UX gates and fixture inventory; diff-scoped RIPR should not block on oracle gaps inside newly added receipt tests."
created = "2026-06-01"
review_after = "2026-07-01"
expires = "2026-09-30"

# -----------------------------------------------------------------------------
# Seam-proof test files: diff-scoped RIPR harness plumbing, not production seams.
# Tracks EffortlessMetrics/ripr#1428 (RIPR flags test-harness plumbing in newly
# added test files as production seams). Remove this suppression once #1428 lands.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-seam-proof-tests"
kind = "test_receipt_surface"
paths = ["crates/**/tests/ripr_seam_proof_*.rs"]
classification = ["call_deletion", "return_value", "error_path"]
owner = "proof-lane"
issue = "#1289"
reason = "Seam-proof test files (ripr_seam_proof_*.rs) are diff-scoped proof harnesses whose internal plumbing — Ok(()) returns, .contains() calls, ? operators — must not be treated as new production seams by diff-scoped RIPR analysis. This is the same class as ripr-suppress-ux-receipt-tests. Tracks EffortlessMetrics/ripr#1428; remove when fixed upstream."
created = "2026-06-10"
review_after = "2026-07-10"
expires = "2026-09-30"

# -----------------------------------------------------------------------------
# parse_qw_arg_list predicate seams — infection untraceable via string-parsing.
#
# Two `weakly_exposed` predicate seams at crates/perl-module/src/import/mod.rs
# (parse_qw_arg_list):
#   (A) `if delimiter.is_ascii_alphanumeric() || delimiter == '_'` (line ~667)
#   (B) `if inner_start > inner_end || !after_operator.ends_with(closing)` (line ~681)
#
# Strong boundary tests exist for both seams in both inline mod tests and the
# external seam-proof file (parse_qw_arg_list_direct_digit_delimiter, etc.).
# The function is `pub` and directly callable from external test files.
#
# However, RIPR's static predicate-infection analysis cannot trace the delimiter
# character from string arguments (e.g. "qw9abc") through `.chars().next()` to
# determine that delimiter = '9' and '9'.is_ascii_alphanumeric() = true.
# Similarly, it cannot trace `inner_start`/`inner_end` arithmetic from test
# string lengths.
#
# This is a ripr#1429 static-analysis limitation for predicate seams with
# string-parsing arguments (distinct from return_value seams which are provable
# with assert_eq!(..., None) oracles). The tests ARE discriminating; RIPR just
# can't verify it statically through the parsing call chain.
#
# Remove this suppression once ripr#1429 (predicate-infection via parsed-string
# arguments) is fixed upstream.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-parse-qw-arg-list-predicate-seams"
kind = "predicate_infection_untraceable"
paths = ["crates/perl-module/src/import/mod.rs"]
classification = ["static_unknown", "no_static_path"]
owner = "proof-lane"
issue = "#1205"
reason = "parse_qw_arg_list predicate seams (alphanumeric-guard and inner-bounds-guard) are covered by direct exact-equality tests in both mod tests and the seam-proof file (parse_qw_arg_list_direct_digit_delimiter, parse_qw_arg_list_direct_underscore_delimiter, parse_qw_arg_list_direct_unclosed_bracket, parse_qw_arg_list_direct_mismatched_closing). RIPR cannot trace the delimiter character from string arguments through .chars().next() to verify predicate infection — a ripr#1429 class limitation for predicate seams with string-parsing arguments. Suppression is minimal (file-scoped) and non-weakly_exposed-labeled. Remove when ripr#1429 is fixed."
created = "2026-06-10"
review_after = "2026-07-10"
expires = "2026-09-30"

# -----------------------------------------------------------------------------
# parse_qw_content: end < start arithmetic boundary in perl-semantic-analyzer.
# RIPR cannot statically trace rfind(close) vs open.len_utf8() arithmetic
# to determine that end < start is possible; this is the static-arithmetic
# limitation tracked in EffortlessMetrics/ripr#1429.
#
# Discriminating tests ARE present: parse_qw_content_end_lt_start_guard_fires
# (added in PR #1203) exercises "qwf" → end=0 < start=1 → None, and the
# existing parse_qw_content_tolerates_leading_space covers "qwfoo" → None.
# The boundary is genuinely tested; the gap is a RIPR static-analysis blind
# spot, not a missing discriminator.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-parse-qw-content-end-lt-start"
kind = "static_arithmetic_unknown"
paths = ["crates/perl-semantic-analyzer/src/analysis/index.rs"]
classification = ["static_unknown", "no_static_path"]
owner = "proof-lane"
issue = "EffortlessMetrics/ripr#1429"
reason = "RIPR cannot statically resolve rfind(close)/open.len_utf8() arithmetic to confirm that end < start is reachable. Discriminating tests are present (parse_qw_content_end_lt_start_guard_fires added in #1203). This is the static-arithmetic limitation tracked in EffortlessMetrics/ripr#1429; remove this suppression when ripr#1429 is fixed upstream."
created = "2026-06-10"
review_after = "2026-07-10"
expires = "2026-09-30"