# -----------------------------------------------------------------------------
# Seam-proof test files: diff-scoped RIPR harness plumbing, not production seams.
# Tracks EffortlessMetrics/ripr#1428 (RIPR flags test-harness plumbing in newly
# added test files as production seams). Remove this suppression once #1428 lands.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-seam-proof-tests"
kind = "test_receipt_surface"
paths = ["crates/**/tests/ripr_seam_proof_*.rs"]
classification = ["call_deletion", "return_value", "error_path"]
owner = "proof-lane"
issue = "#1289"
reason = "Seam-proof test files (ripr_seam_proof_*.rs) are diff-scoped proof harnesses whose internal plumbing — Ok(()) returns, .contains() calls, ? operators — must not be treated as new production seams by diff-scoped RIPR analysis. This is the same class as ripr-suppress-ux-receipt-tests. Tracks EffortlessMetrics/ripr#1428; remove when fixed upstream."
created = "2026-06-10"
review_after = "2026-07-10"
expires = "2026-09-30"

# -----------------------------------------------------------------------------
# parse_quote_operator_content: canonical shared helper — activation untraceable.
#
# PR refactor/centralize-qw-parsing merged the per-consumer copies of this
# function (previously in perl-semantic-analyzer/src/analysis/index.rs,
# import_extractor.rs, and perl-module/src/import/mod.rs) into a single
# canonical implementation at:
#   crates/perl-parser-core/src/syntax/quote.rs
#
# The three per-consumer suppressions (ripr-suppress-parse-qw-content-end-lt-start,
# ripr-suppress-import-extractor-quote-operator-activation, and
# ripr-suppress-parse-qw-arg-list-predicate-seams) have been REMOVED because
# those files no longer contain the parsing seams — they delegate to the canonical.
#
# Four `weakly_exposed` seams remain in the canonical helper at quote.rs:
#   (A) s.strip_prefix(operator)? — None on prefix miss
#   (B) chars.next()?             — None on empty rest-string
#   (C) open.is_ascii_alphanumeric() || open == '_' — alphanumeric-guard predicate
#   (D) rest.len().checked_sub(close.len_utf8())?   — arithmetic boundary (end<start)
#
# The existing seam-proof tests from PR #1292 continue to cover all four seams.
# RIPR cannot statically trace activation from test inputs through
# s.strip_prefix → .trim_start() → .chars() → .next() — the same ripr#1429
# class limitation. Remove when ripr#1429 is fixed upstream.
#
# Net suppression change: 3 removed (per-consumer), 1 added (canonical home).
# Cites ripr#1429 and #1289 per project convention.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-canonical-quote-operator-helper"
kind = "predicate_infection_untraceable"
paths = ["crates/perl-parser-core/src/syntax/quote.rs"]
classification = ["static_unknown", "no_static_path"]
owner = "proof-lane"
issue = "EffortlessMetrics/ripr#1429"
reason = "Canonical parse_quote_operator_content helper (centralized in #1289 refactor) has 4 ripr#1429-class seams: strip_prefix (A), chars.next (B), alphanumeric-guard predicate (C), checked_sub arithmetic (D). All seams are covered by inline seam-proof tests from PR #1292 (parse_quote_operator_content_wrong_operator_returns_none, _alphanumeric_delimiter_rejected, _underscore_delimiter_rejected, _mismatched_close_returns_none, etc.). RIPR cannot statically trace activation from string literals through the string-parsing call chain — same ripr#1429 limitation as removed per-consumer suppressions. Net reduction: 3 suppressions removed, 1 canonical suppression added. Remove when ripr#1429 is fixed upstream."
created = "2026-06-11"
review_after = "2026-07-11"
expires = "2026-09-30"

# -----------------------------------------------------------------------------
# Quote-operator conformance test helpers: RIPR flags test-plumbing seams in
# newly added integration test helper functions as production seams.
#
# Two `weakly_exposed` seams flagged in test helper functions added by PR #1292:
#   crates/perl-semantic-analyzer/tests/require_import_resolution.rs:304
#     → `extract_explicit_symbols`: match arm / error-path in a test helper
#   crates/perl-workspace/tests/use_lib_fact_tests.rs:477
#     → `workspace_explicit_symbols_for_module`: match arm / error-path
#
# These are test infrastructure functions (not production code). RIPR's
# diff-scoped analysis treats newly added test helper functions as production
# seams — the same class of false-positive as ripr#1428 (test-harness plumbing
# flagged as production seams). The functions are pure test infrastructure:
# they call the production function and classify its output for assertion.
#
# The behavior these helpers exercise IS tested — the entire conformance matrix
# (8 compact/spaced delimiter forms, 1 bareword rejection) is verified through
# these helpers. RIPR cannot distinguish test-only helper functions from
# production exports when analyzing the diff.
#
# This is distinct from ripr#1429 (predicate-infection / activation-tracing in
# production string-parsing functions). This is ripr#1428 (RIPR treats diff-
# added test-helper plumbing as new production seams). Same upstream issue
# family. Remove when ripr#1428 is fixed.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-quote-operator-conformance-test-helpers"
kind = "test_receipt_surface"
paths = [
  "crates/perl-semantic-analyzer/tests/require_import_resolution.rs",
  "crates/perl-workspace/tests/use_lib_fact_tests.rs",
]
classification = ["static_unknown", "no_static_path"]
owner = "proof-lane"
issue = "EffortlessMetrics/ripr#1428"
reason = "Test helper functions (extract_explicit_symbols in require_import_resolution.rs:304 and workspace_explicit_symbols_for_module in use_lib_fact_tests.rs:477) are diff-scoped RIPR false-positives in newly added integration test files. RIPR flags the match-arm / error-path plumbing in these helpers as production seams. The production behavior exercised by these helpers is fully covered by the conformance matrix tests in the same files. This is the same ripr#1428 class as ripr-suppress-seam-proof-tests (test-harness plumbing flagged as production seams). Suppression is minimal (two specific test files). Remove when ripr#1428 is fixed upstream."
created = "2026-06-10"
review_after = "2026-07-10"
expires = "2026-09-30"
