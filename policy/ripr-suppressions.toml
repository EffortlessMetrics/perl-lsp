# PL304 use-constant NodeKind blind-spot fix (PR #3078, issue #3071):
# ripr#1429-class: RIPR 0.9.x cannot mutation-trace let-chain match-condition
# seams in collect_constant_names() in pod_coverage.rs.
#
# PR #3078 adds collect_constant_names() which walks NodeKind::Use nodes to
# detect `use constant FOO => ...` and `use constant { FOO => ... }` exports
# so PL304 MissingPodCoverage no longer fires false-positives for them.
#
# RIPR 0.9.x flags 3 seams as activation_unknown:
#   pod_coverage.rs:167  — `module == "constant"` let-chain string compare
#   pod_coverage.rs:168  — `!args.is_empty()` guard in the same let-chain
#   pod_coverage.rs:171  — `args.first().map(String::as_str) == Some("{")` branch
#
# These are predicate_boundary seams inside a Rust let-chain
# (`if let NodeKind::Use { module, args, .. } = &n.kind && module == "constant"
# && !args.is_empty()`). RIPR's static tracer cannot follow the boolean
# short-circuit through the let-binding into the string-compare conditions —
# a known ripr#1428/1429 limitation for let-chain match predicates.
#
# Call-observation fix was attempted first (per gap-closure playbook): two
# discriminator unit tests were added that explicitly drive both the true and
# false branches of every predicate:
#   collect_constant_names_boundary_discriminator — drives module != "constant"
#     (Use { module: "strict" }) and both hash_form branches (single: "TIMEOUT",
#     hash: "HOST","PORT")
#   is_valid_identifier_boundary_discriminator — drives leading '_', alphabetic,
#     non-word first char, tail variants
# These tests pass (20/20 --lib tests green) but the ripr seams persisted in
# the post-discriminator fresh run — confirming this is the static-tracer class.
#
# Behavioral coverage for all 3 seams:
#   Line 167/168 (module == "constant" + !args.is_empty()):
#     given_use_constant_in_export_ok_then_no_pl304_false_positive (integration)
#     collect_constant_names_single_form_push (lib unit)
#     collect_constant_names_boundary_discriminator (lib unit, non-constant Use)
#   Line 171 (hash_form branch):
#     given_use_constant_hash_form_in_export_ok_then_no_pl304_false_positive
#     collect_constant_names_boundary_discriminator (lib unit, both branches)
#
# Suppression is narrow: single production file, 3 seams. Remove when
# ripr#1429 is fixed upstream or when ripr can trace let-chain predicates.
# ======================================================================
# -----------------------------------------------------------------------------
