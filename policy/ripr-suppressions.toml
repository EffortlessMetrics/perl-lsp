# -----------------------------------------------------------------------------
# phase_block_description match arms: string-literal dispatch — activation
# untraceable by RIPR static analysis.
#
# hover_cards.rs lines 41/48/55/62/68/69/70 are the closing `)),` and `_ => None`
# of each match arm in phase_block_description (BEGIN/END/INIT/CHECK/UNITCHECK).
# Line 63 is the UNITCHECK arm opening (`"UNITCHECK" => Some((`).
#
# All 5 phase names and the wildcard arm are covered by dedicated unit tests in
# hover_tests.rs (phase_block_hover_begin_returns_compile_time_timing,
# phase_block_hover_end_returns_program_exit_timing, etc. plus
# phase_block_hover_unknown_returns_none for the `_ => None` arm). Each test
# uses exact string assertions — strong oracles — against the returned markdown.
#
# RIPR cannot statically trace that calling phase_block_hover("BEGIN") exercises
# the "BEGIN" arm because activation flows through a string-literal match: the
# same ripr#1429 predicate-infection-untraceable class that suppresses
# parse_quote_operator_content. Remove when ripr#1429 is fixed upstream.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-phase-block-description-match-arms"
kind = "predicate_infection_untraceable"
paths = ["crates/perl-lsp-rs/src/runtime/language/hover/hover_cards.rs"]
classification = ["no_static_path", "weakly_exposed"]
owner = "proof-lane"
issue = "EffortlessMetrics/ripr#1429"
reason = "phase_block_description match arms (BEGIN/END/INIT/CHECK/UNITCHECK/wildcard) are ripr#1429-class no_static_path seams: RIPR cannot trace activation from string-literal call sites through the str match dispatch. All arms are covered by dedicated unit tests in hover_tests.rs with exact (strong-oracle) string assertions. Suppression is minimal (single production file, only hover_cards.rs). Remove when ripr#1429 is fixed upstream."
created = "2026-06-11"
review_after = "2026-07-11"
expires = "2026-09-30"

# -----------------------------------------------------------------------------
# find_phase_block_at_offset boundary predicates: ripr reports weakly_exposed
# despite strong oracles present.
#
# hover.rs lines 944 and 953:
#   944: `if offset < node.location.start || offset > node.location.end {`
#   953: `phase_span.as_ref().map(|s| offset >= s.start && offset <= s.end).unwrap_or(true)`
#
# ripr's own discriminate field reports "Strong oracle found: exact value or
# pattern assertion" for both seams, yet classifies them weakly_exposed because
# the propagation path from the predicate branch to the test's assert_eq! is a
# call-chain ripr cannot statically traverse. Four unit tests in hover_tests.rs
# cover both predicates at their exact boundaries:
#   - find_phase_block_at_offset_returns_none_when_offset_out_of_node_range
#   - find_phase_block_at_offset_returns_phase_name_when_offset_in_node_and_no_phase_span
#   - find_phase_block_at_offset_respects_phase_span_boundary
#   - find_phase_block_at_offset_recurses_through_program_to_find_phase_block
# This is the same ripr#1429 propagation-path class. Remove when fixed upstream.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-find-phase-block-at-offset-predicates"
kind = "predicate_infection_untraceable"
paths = ["crates/perl-lsp-rs/src/runtime/language/hover.rs"]
classification = ["weakly_exposed"]
owner = "proof-lane"
issue = "EffortlessMetrics/ripr#1429"
reason = "Two boundary predicates in find_phase_block_at_offset (hover.rs:944 offset-range guard, hover.rs:953 phase_span boundary) are classified weakly_exposed despite ripr's own discriminate field reporting 'Strong oracle found: exact value or pattern assertion'. RIPR cannot statically trace propagation from the predicate branch through the recursive call chain to the test assertion. All four code paths are covered by exact-equality unit tests in hover_tests.rs. Suppression is minimal (single production file, only hover.rs). Remove when ripr#1429 is fixed upstream."
created = "2026-06-11"
review_after = "2026-07-11"
expires = "2026-09-30"

# -----------------------------------------------------------------------------
# OO method signature-help seams (PR #1301 Slice 1): ripr#1429-class activation-
# tracing limitation in is_method_call_context / resolve_method_in_workspace.
#
# Seven seams flagged in crates/perl-lsp-rs/src/runtime/language/hover/signature_help.rs:
#   (A) 3 `weakly_gripped` seams — paren-scan loop predicates and depth==0 check
#       in is_method_call_context; RIPR cannot trace coverage from unit-test
#       string literals through the char-by-char scan to the predicate exit.
#   (B) 2 equality-boundary seams — depth==1 boundary in paren scanner, and
#       sym.name == method_name exact-match filter in resolve_method_in_workspace;
#       RIPR names missing discriminator `1` and `method_name` respectively.
#   (C) 4 `activation_unknown` seams — the cfg(feature="workspace")-gated
#       resolve_method_in_workspace body including the IndexAccessMode match,
#       workspace_document_text call, and Parser::new chain; RIPR cannot
#       statically determine activation because the workspace feature guard and
#       trait-object dispatch break static call-graph traversal.
#
# Coverage evidence:
#   is_method_call_context: 6 unit tests in #[cfg(test)] mod tests (exact bool
#   assertions: arrow-method, class-method, plain function, builtin, inside-args,
#   empty text). 3 integration tests in lsp_signature_help_tests.rs exercise the
#   full ->method( path end-to-end.
#   resolve_method_in_workspace: lib-level tests cover the graceful-None path
#   (no-index-ready, empty-name). Full resolution path covered by integration
#   test test_oo_method_signature_help_shows_params_for_known_method.
#
# This is the ripr#1429 predicate-infection-untraceable class: RIPR cannot
# statically trace activation from string/char literals through iterative
# scan loops, feature-gated code blocks, or trait-object dispatch. Same
# family as ripr-suppress-phase-block-description-match-arms and
# ripr-suppress-canonical-quote-operator-helper.
# Suppression is minimal (single production file, one PR). Remove when
# ripr#1429 is fixed upstream or when targeted mutation is scheduled.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-oo-method-signature-help-seams"
kind = "predicate_infection_untraceable"
paths = ["crates/perl-lsp-rs/src/runtime/language/hover/signature_help.rs"]
classification = ["static_unknown", "no_static_path"]
owner = "proof-lane"
issue = "EffortlessMetrics/ripr#1429"
reason = "Seven ripr#1429-class seams in is_method_call_context and resolve_method_in_workspace (PR #1301 Slice 1): (A) 3 weakly_gripped paren-scan predicates — RIPR cannot trace coverage from char-literal unit tests through the iterative scan loop to predicate exits; (B) 2 equality-boundary seams (depth==1 and sym.name==method_name) with missing discriminators — same activation-tracing limit; (C) 4 activation_unknown seams in the cfg(feature='workspace')-gated resolve_method_in_workspace body — RIPR cannot statically traverse the feature guard and IndexAccessMode trait dispatch. All paths are covered: 6 unit tests for is_method_call_context (exact bool assertions), 2 lib-level None-path tests for resolve_method_in_workspace, and 3 integration tests for the full workspace-resolution path. Suppression is narrow (single production file, one PR). Remove when ripr#1429 is fixed upstream or targeted mutation is scheduled post-review."
created = "2026-06-11"
review_after = "2026-07-11"
expires = "2026-09-30"

# -----------------------------------------------------------------------------
# quality_baseline.rs cfg(test) line-scanner predicates: string/line-scanning
# — activation untraceable by ripr 0.5.0 (ripr#1429 class).
#
# PR #1326 adds five helper functions to xtask/src/tasks/quality_baseline.rs:
#   cfg_test_line_numbers   — scans source text for #[cfg(test)] spans
#   structural_brace_delta  — counts structural braces in a line of Rust source
#   is_cfg_test_attr        — predicate: does a line contain #[cfg(test)]?
#   strip_cfg_test_lines    — strips test-block lines from LcovSummary
#   resolve_source_path     — resolves an LCOV SF: path to a filesystem path
#
# ripr 0.5.0 cannot statically trace activation from string-literal test inputs
# through the line-by-line scanning loops in cfg_test_line_numbers and
# structural_brace_delta to their internal predicate branches. The same
# ripr#1429 predicate-infection-untraceable class as sibling suppressions
# (parse_quote_operator_content, is_method_call_context, etc.).
#
# Coverage evidence: 10 inline #[cfg(test)] unit tests in quality_baseline.rs:
#   cfg_test_line_numbers_detects_inline_test_module
#   cfg_test_line_numbers_empty_file_returns_empty_set
#   cfg_test_line_numbers_handles_multiple_test_blocks
#   strip_cfg_test_lines_removes_test_block_lines_from_lcov
#   strip_cfg_test_lines_does_not_affect_production_hit_count
#   strip_cfg_test_lines_patch_coverage_full_for_test_only_pr
#   structural_brace_delta_counts_only_structural_braces
#   structural_brace_delta_skips_char_literals
#   structural_brace_delta_skips_single_line_string_literals
#   structural_brace_delta_balances_nested_blocks
#
# Suppression is narrow (single xtask file, one PR). Remove when ripr#1429 is
# fixed upstream or when targeted mutation is scheduled per #1289.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-quality-baseline-cfg-test-scanner"
kind = "predicate_infection_untraceable"
paths = ["xtask/src/tasks/quality_baseline.rs"]
classification = ["weakly_exposed", "no_static_path"]
owner = "proof-lane"
issue = "EffortlessMetrics/ripr#1429"
reason = "Five ripr#1429-class seams in PR #1326 cfg(test)-strip helpers: cfg_test_line_numbers, structural_brace_delta, is_cfg_test_attr, strip_cfg_test_lines, resolve_source_path. RIPR cannot statically trace activation from string-literal test inputs through the line-by-line scanning loops to internal predicate branches (same class as parse_quote_operator_content and is_method_call_context). All seams are covered by 10 inline #[cfg(test)] unit tests: 3 for cfg_test_line_numbers (inline_test_module, empty_file, multiple_blocks), 3 for strip_cfg_test_lines (removes_test_block_lines, does_not_affect_production_hit_count, patch_coverage_full_for_test_only_pr), and 4 for structural_brace_delta edge cases added by the deep-review correctness fix. Retirement tracked in #1289. Remove when ripr#1429 is fixed upstream or when targeted mutation is scheduled."
created = "2026-06-12"
review_after = "2026-07-12"
expires = "2026-09-30"
