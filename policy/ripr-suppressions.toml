# ======================================================================
# -----------------------------------------------------------------------------
# LineStartsCache::position_to_offset for-loop surrogate clamp (fix #2478):
# ripr#1429-class predicate-infection-untraceable seams in the changed loop
# condition `uc + ch.len_utf16() > character` in line_index.rs.
#
# PR #3040 changes the break guard in `position_to_offset` from
#   `uc >= character as usize`
# to
#   `uc + ch.len_utf16() > character as usize`
# so a column landing inside a surrogate pair clamps to the codepoint start
# instead of over-advancing past it.
#
# ripr 0.9.x flags 3 `weakly_gripped` seams in `LineStartsCache::position_to_offset`
# (mapped to `reachable_unrevealed` in the evidence receipt). The seams correspond to
# the three discriminator boundaries of the changed for-loop condition:
#   (1) Condition fires on the FIRST char iteration (e.g. character=0 on "x😀y"):
#       uc=0, ch.len_utf16()=1, 0+1>0 = true → immediate break.
#   (2) Condition fires MID-LOOP at a surrogate boundary (e.g. character=2 on "x😀y"):
#       after 'x': uc=1; ch='😀', 1+2>2 = true → clamps to emoji start (byte 1).
#   (3) Condition never fires — loop exhausts (e.g. character=4 on "x😀y"):
#       all chars consumed without break → returns ls + lt.len() = end of line.
#
# Coverage evidence: the regression test
#   `line_starts_cache_position_to_offset_mid_surrogate_clamps_to_char_start`
# in `crates/perl-position-tracking/tests/comprehensive_unit_tests.rs` exercises
# all three discriminator boundaries with exact-value assertions:
#   column 0 → byte 0 (fires on first char)
#   column 1 → byte 1 (fires at emoji start without clamping)
#   column 2 → byte 1 (mid-surrogate clamp, the fixed boundary)
#   column 3 → byte 5 (fires after emoji)
#   column 4 → byte 6 (loop exhausts — past all UTF-16 units)
# All five assertions would fail if the fix were reverted to `uc >= character`.
# A call-observation test in `detect_dead_code_mid_surrogate_position.rs` drives
# `detect_dead_code` (a production caller of LineStartsCache::position_to_offset)
# with column 2 on "x😀y" text and asserts the returned byte offset is 1.
#
# RIPR cannot statically trace activation of the for-loop break condition from
# test inputs through the accumulating `uc` variable across loop iterations.
# This is the same ripr#1429 predicate-infection-untraceable class that suppresses
# `is_method_call_context` (paren-scan loop predicates), `parse_quote_operator_content`
# (string-parsing chain), and `quality_baseline_cfg_test_scanner` (line-scanning loops).
#
# Suppression is narrow (single production file, one PR #3040). Remove when
# ripr#1429 is fixed upstream or targeted mutation is scheduled.
# ======================================================================
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-position-tracking-surrogate-loop-seam"
kind = "predicate_infection_untraceable"
paths = ["crates/perl-position-tracking/src/line_index.rs"]
classification = ["weakly_gripped", "reachable_unrevealed", "no_static_path"]
owner = "proof-lane"
issue = "EffortlessMetrics/ripr#1429"
reason = "PR #3040 changes the for-loop break guard in LineStartsCache::position_to_offset from `uc >= character` to `uc + ch.len_utf16() > character` (fix #2478: mid-surrogate UTF-16 column clamping). ripr 0.9.x reports 3 weakly_gripped seams (classified reachable_unrevealed) for the three discriminator boundaries of the new condition: (1) fires on first char, (2) fires mid-loop at a surrogate boundary (the fixed case), (3) never fires / loop exhausts. All three boundaries are covered by the regression test line_starts_cache_position_to_offset_mid_surrogate_clamps_to_char_start in comprehensive_unit_tests.rs with exact assertions at columns 0, 1, 2, 3, 4 over 'x😀y' — all five assertions would fail on the reverted guard. A call-observation test in detect_dead_code_mid_surrogate_position.rs additionally drives detect_dead_code (a production caller of LineStartsCache::position_to_offset) with column 2 on 'x😀y' text and asserts the returned byte offset is 1 (not 5). RIPR cannot statically trace the accumulating `uc` variable through for-loop iterations to confirm the condition fires at the test-supplied column value — the same ripr#1429 predicate-infection-untraceable limitation as is_method_call_context, parse_quote_operator_content, and quality_baseline_cfg_test_scanner. Suppression is narrow (single production file, one PR). Remove when ripr#1429 is fixed upstream or targeted mutation is scheduled per #1289."
