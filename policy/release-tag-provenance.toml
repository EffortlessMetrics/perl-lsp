# `current_sha` is the commit reached by the live tag ref at audit time.
# `recorded_sha` preserves the identifier previously written in RELEASE_HISTORY
# or a standalone release note. A stale record is evidence, not an instruction
# to move the tag back.
# `recorded_reachable` is true only when that identifier is itself a reachable
# commit object; annotated tag-object identifiers remain false even if Git can
# dereference them to a commit.
#
# record_status:
#   match      - the historical record is a prefix of the live tag commit
#   stale      - the historical record differs from the live tag commit
#   unrecorded - the tag existed but no immutable SHA was in the prior ledger
#   pending    - the prior ledger explicitly recorded the tag SHA as pending
#
# lineage:
#   root       - no predecessor is asserted
#   linear     - predecessor is an ancestor of this tag
#   diverged   - neither tag is an ancestor of the other

