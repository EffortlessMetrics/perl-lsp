# CI Lane Whitelist
#
# Governed map of every CI lane to its proof obligation, owner, trigger,
# cost estimate, and evidence artifact. This is the missing inventory layer
# between docs and the planner: not just "CI runs," but "CI has a reason,
# an owner, a cost, a proof obligation, and a review date."
#
# See docs/ci/perl-lsp-rollout-plan.md (PR 02 entry) for the rationale.
#
# Lifecycle:
#   unknown → whitelisted → measured → learned-estimate → routed → enforced
#
# Do not route or enforce a lane until it has been whitelisted and measured.
#
# Source-of-truth boundaries:
#   - LEM bands and runner multipliers live in policy/ci-budget.toml. They are
#     NOT duplicated here; the policy linter resolves them from ci-budget.toml.
#   - Lane IDs use underscores to match policy/ci-lanes.toml lane keys (so the
#     planner and linter can cross-reference by lane.id == lane.<id>).

schema_version = 1
policy = "ci-lane-whitelist"
owner = "EffortlessMetrics"
status = "advisory"
updated = "2026-05-20"

# =============================================================================
# Swarm routed Rust small lanes
# =============================================================================

[[lane]]
id = "swarm_rust_small_route"
workflow = ".github/workflows/em-ci-routed-rust.yml"
job = "route-rust-small"
tier = "frontdoor"
kind = "control"
blocking = true
default_pr = true
runner = "ubuntu_latest"
base_lem = 1
owner = "ci"
intent = "Route trusted same-repo Rust Small PRs to CX53, CX43, or GitHub-hosted fallback without exposing self-hosted runners to fork PRs."
failure_mode = "Swarm PRs either do not route to available trusted capacity or expose self-hosted capacity to untrusted forks."
proof_obligation = "Emit router_target, router_reason, and router_error; fork PRs must select GitHub-hosted fallback."
evidence = ["job output", "step-summary"]
allowed_triggers = ["pull_request", "merge_group", "workflow_dispatch"]
expensive = false
duplicate_of = []
review_after = "2026-06-20"
expires = "2026-11-20"

