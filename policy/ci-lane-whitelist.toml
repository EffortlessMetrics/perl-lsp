# CI Lane Whitelist
#
# Governed map of every CI lane to its proof obligation, owner, trigger,
# cost estimate, and evidence artifact. This is the missing inventory layer
# between docs and the planner: not just "CI runs," but "CI has a reason,
# an owner, a cost, a proof obligation, and a review date."
#
# See docs/ci/perl-lsp-rollout-plan.md (PR 02 entry) for the rationale.
#
# Lifecycle:
#   unknown → whitelisted → measured → learned-estimate → routed → enforced
#
# Do not route or enforce a lane until it has been whitelisted and measured.

schema_version = 1
policy = "ci-lane-whitelist"
owner = "EffortlessMetrics"
status = "advisory"
updated = "2026-05-07"

[budget]
preferred_default_lem = 25
default_limit_lem = 35
elevated_limit_lem = 75
hard_limit_lem = 125

# Mirrors policy/ci-budget.toml. Duplicated here so the whitelist file is
# self-describing for the policy linter (PR 11+).
[runner_multipliers]
ubuntu_24_04 = 1.0
ubuntu_latest = 1.0
windows_latest = 2.0
macos_latest = 10.0
docker_build = 6.0
external_ai_review = 4.0

# =============================================================================
# Frontdoor / control lanes
# =============================================================================

[[lane]]
id = "draft-pr-guard"
workflow = ".github/workflows/ci.yml"
job = "draft-pr-check"
tier = "frontdoor"
kind = "control"
blocking = true
default_pr = true
runner = "ubuntu_24_04"
base_lem = 1
owner = "ci"
intent = "Avoid running full CI on draft PRs."
failure_mode = "Draft or non-credible candidates consuming CI."
proof_obligation = "Classify draft status and skip downstream CI when appropriate."
evidence = ["job output"]
allowed_triggers = ["pull_request", "push", "merge_group", "workflow_dispatch"]
expensive = false
duplicate_of = []
review_after = "2026-06-07"
expires = "2026-11-07"

[[lane]]
id = "preflight-latest-sha"
workflow = ".github/workflows/ci.yml"
job = "preflight-latest-check"
tier = "frontdoor"
kind = "control"
blocking = true
default_pr = true
runner = "ubuntu_24_04"
base_lem = 1
owner = "ci"
intent = "Skip superseded PR SHAs."
failure_mode = "Spending CI on commits that are no longer current."
proof_obligation = "Compare current SHA to latest branch SHA."
evidence = ["job output"]
allowed_triggers = ["pull_request", "push", "merge_group"]
expensive = false
duplicate_of = []
review_after = "2026-06-07"
expires = "2026-11-07"

[[lane]]
id = "conflict-marker-check"
workflow = ".github/workflows/ci.yml"
job = "conflict-markers"
tier = "frontdoor"
kind = "hygiene"
blocking = true
default_pr = true
runner = "ubuntu_24_04"
base_lem = 1
owner = "ci"
intent = "Prevent merge conflict markers from reaching master."
failure_mode = "Committed conflict markers break builds or user workflows."
proof_obligation = "Search tracked files for conflict marker patterns."
evidence = ["job log"]
allowed_triggers = ["pull_request", "push", "merge_group"]
expensive = false
duplicate_of = ["gate:check_conflict_markers"]
review_after = "2026-06-07"
expires = "2026-11-07"

# =============================================================================
# Default Rust gates
# =============================================================================

[[lane]]
id = "pr-smoke"
workflow = ".github/workflows/ci.yml"
job = "pr-smoke"
tier = "frontdoor"
kind = "rust"
blocking = true
default_pr = true
runner = "ubuntu_24_04"
base_lem = 4
owner = "ci"
intent = "Run fast scoped Rust proof through xtask gates."
failure_mode = "Obvious compile, format, lint, or scoped unit-test failure."
proof_obligation = "Run pr-fast gates selected by ci-scope."
evidence = [
  "target/receipts/receipt.json",
  "target/test-results/pr-fast-junit.xml",
]
allowed_triggers = ["pull_request", "push", "merge_group", "workflow_dispatch"]
expensive = false
duplicate_of = []
review_after = "2026-06-07"
expires = "2026-11-07"

[[lane]]
id = "merge-gate-shards"
workflow = ".github/workflows/ci.yml"
job = "merge-gate-shards"
tier = "merge_gate"
kind = "rust"
blocking = true
default_pr = true
runner = "ubuntu_24_04"
base_lem = 24
owner = "ci"
intent = "Run bounded required merge-gate shards."
failure_mode = "Defect not caught by scoped PR smoke but required before merge."
proof_obligation = "Run required gate groups from .ci/gate-policy.yaml and emit receipts."
evidence = [
  "target/receipts/shards/*.json",
  "target/test-results/gate-shard-*-junit.xml",
]
allowed_triggers = ["pull_request", "push", "merge_group", "workflow_dispatch"]
expensive = true
expensive_reason = "Multiple shard jobs compile and test distinct workspace surfaces."
duplicate_of = []
review_after = "2026-06-07"
expires = "2026-11-07"

[[lane]]
id = "merge-gate-aggregate"
workflow = ".github/workflows/ci.yml"
job = "merge-gate"
tier = "merge_gate"
kind = "control"
blocking = true
default_pr = true
runner = "ubuntu_24_04"
base_lem = 1
owner = "ci"
intent = "Aggregate shard results into the required merge-blocking status."
failure_mode = "Branch protection cannot rely on a stable summary check."
proof_obligation = "Reduce shard outcomes to a single required status."
evidence = ["job output"]
allowed_triggers = ["pull_request", "push", "merge_group"]
expensive = false
duplicate_of = []
review_after = "2026-06-07"
expires = "2026-11-07"

# =============================================================================
# UX / memory / platform default lanes
# =============================================================================

[[lane]]
id = "ux-regression"
workflow = ".github/workflows/ci.yml"
job = "ux-tests"
tier = "merge_gate"
kind = "ux"
blocking = true
default_pr = true
runner = "ubuntu_24_04"
base_lem = 8
owner = "lsp"
intent = "Prevent first-five-minutes LSP UX regressions."
failure_mode = "User-visible LSP behavior regresses while compile/unit tests stay green."
proof_obligation = "Run UX scenario suite against live binary and classify failures."
evidence = [
  "target/receipts/ux-regression.json",
  "target/receipts/ux-regression.log",
  "target/test-results/ux-regression-junit.xml",
]
allowed_triggers = ["pull_request", "push", "merge_group"]
expensive = true
expensive_reason = "Builds binary and runs integration UX harness."
default_pr_exception = "ci-exception-ux-regression-default-pr"
duplicate_of = ["workflow:ux-regression-gate"]
review_after = "2026-06-07"
expires = "2026-08-07"

[[lane]]
id = "lsp-memory-smoke"
workflow = ".github/workflows/ci.yml"
job = "lsp-memory-smoke"
tier = "merge_gate"
kind = "memory"
blocking = true
default_pr = true
runner = "ubuntu_24_04"
base_lem = 8
owner = "runtime"
intent = "Catch retained-state regressions in LSP document churn."
failure_mode = "Open/change/close churn retains document/session/cache state."
proof_obligation = "Run bounded document-churn workload and validate RSS plateau receipt."
evidence = [
  "target/memory/receipts/*.json",
  "target/memory/*.plateau.json",
  "target/memory/*.csv",
]
allowed_triggers = ["pull_request", "push", "merge_group"]
expensive = true
expensive_reason = "Builds release binary and runs process-level memory workload."
default_pr_exception = "ci-exception-lsp-memory-smoke-default-pr"
duplicate_of = ["nightly:memory_plateau"]
review_after = "2026-06-07"
expires = "2026-08-07"

[[lane]]
id = "windows-guardrails"
workflow = ".github/workflows/ci.yml"
job = "windows-guardrails"
tier = "merge_gate"
kind = "platform"
blocking = true
default_pr = true
runner = "windows_latest"
base_minutes = 10
owner = "platform"
intent = "Catch Windows path, module separator, and sandbox regressions."
failure_mode = "Windows-specific behavior fails while Linux CI passes."
proof_obligation = "Compile key crates and run path/sandbox regression lanes on Windows."
evidence = ["job logs"]
allowed_triggers = ["pull_request", "push", "merge_group"]
expensive = true
expensive_reason = "Windows runner multiplier and separate compile surface."
default_pr_exception = "ci-exception-windows-guardrails-default-pr"
duplicate_of = []
review_after = "2026-06-07"
expires = "2026-08-07"

# =============================================================================
# Oracle-gap lane (advisory)
# =============================================================================

[[lane]]
id = "ripr-advisory"
workflow = ".github/workflows/ripr.yml"
job = "ripr"
tier = "frontdoor"
kind = "oracle_gap"
blocking = false
default_pr = true
runner = "ubuntu_24_04"
base_lem = 4
owner = "testing"
intent = "Find static oracle-gap evidence for changed Rust behavior."
failure_mode = "Changed behavior is reachable but tests do not appear to discriminate it."
proof_obligation = "Run static RIPR exposure analysis on production Rust diffs."
evidence = [
  "target/ripr/ripr.json",
  "target/ripr/ripr.sarif",
  "GitHub annotations",
]
allowed_triggers = ["pull_request", "workflow_dispatch"]
labels = ["ripr", "full-ci"]
expensive = false
blocking_promotion_allowed = false
duplicate_of = ["nightly:mutation"]
review_after = "2026-06-07"
expires = "2026-08-07"

# =============================================================================
# Nightly / branch-gated deep lanes
# =============================================================================

[[lane]]
id = "mutation-nightly"
workflow = ".github/workflows/ci-nightly.yml"
job = "mutation"
tier = "nightly"
kind = "mutation"
blocking = false
default_pr = false
runner = "ubuntu_24_04"
base_lem = 60
owner = "testing"
intent = "Execution-backed test adequacy calibration."
failure_mode = "Tests execute code but fail to reject concrete behavioral mutants."
proof_obligation = "Run cargo-mutants on bounded package subset."
evidence = ["mutants.out/mutants.json"]
allowed_triggers = ["schedule", "workflow_dispatch", "pull_request:labeled"]
labels = ["ci:mutation", "mutation", "full-ci"]
expensive = true
expensive_reason = "Runs concrete mutants and executes tests repeatedly."
duplicate_of = ["ripr-advisory"]
review_after = "2026-06-07"
expires = "2026-11-07"

