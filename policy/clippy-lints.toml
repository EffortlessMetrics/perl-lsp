class = "reviewability"
reason = "Use filter_map when flattening Options from iterators."

[[lint]]
name = "clippy::match_result_ok"
level = "deny"
status = "tracked"
class = "reviewability"
reason = "Match on Ok directly instead of discarding error information."

[[lint]]
name = "clippy::cloned_instead_of_copied"
level = "warn"
status = "tracked"
class = "reviewability"
