  "cursor_target_is_direct_package_or_class_identifier",
  "constructor_method_receiver_is_source_backed_class",
  "class_receiver_resolves_to_exactly_one_open_document_package_definition",
]
fallback_conditions = [
  "variable_receiver_requires_data_flow",
  "chained_method_result_requires_return_facts",
  "function_call_result_requires_return_facts",
  "missing_package_definition",
  "ambiguous_package_identity",
  "unsupported_receiver_shape",
]
blocker_conditions = [
  "generated_no_source",
  "dynamic_boundary",
  "stale_fact",
  "low_confidence",
  "ambiguous_identity",
  "missing_fact",
  "unsupported_fact_class",
]
required_receipts = [
  "crates/perl-lsp-rs-core/src/providers/navigation/type_definition.rs",
  "docs/project/status/real_perl_editor_trust_v1.md",
]

