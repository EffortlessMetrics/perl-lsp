[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
license.workspace = true
description = "Task runner for Perl LSP workspace"
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["perl", "parser", "lsp", "tasks"]
categories = ["development-tools"]

[dependencies]
clap = { workspace = true }
color-eyre = "0.6.5"
similar = "3.1.0"
duct = "1.1.1"
walkdir.workspace = true
serde = { workspace = true }
serde_json.workspace = true
anyhow.workspace = true
# (perl-feature-catalog absorbed into perl-lsp-rs-core::feature_catalog — Wave Final PR B)
perl-lsp-rs-core = { workspace = true }
indicatif = "0.18.4"
console = "0.16.2"
chrono = { version = "0.4.43", features = ["serde"] }
perl-parser = { workspace = true }
perl-corpus = { workspace = true }
perl-token = { workspace = true }
perl-lsp-ux-tests = { workspace = true }
perl-parser-pest = { workspace = true, optional = true }
tree-sitter = { workspace = true }
tree-sitter-perl-c = { path = "../crates/tree-sitter-perl-c", optional = true }
regex.workspace = true
serde_yaml_ng = "0.10.0"
toml = "1.1.2"
bindgen = "0.72.1"
peak_alloc = "0.3.0"
notify = "8.2.0"
flate2 = "1.1.5"
tar = "0.4.44"
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18.0"

[dev-dependencies]
assert_cmd = "2.1.2"
perl-tdd-support = { workspace = true }

[features]
# Legacy Pest-based (v2) tasks -- v2-parity corpus, v2-only diagnostics.
# Does not include the C tree-sitter parser (no libclang/C toolchain needed).
legacy = ["perl-parser-pest"]
# Parser-related tasks that additionally require the C tree-sitter parser
# (bindings generation, highlight tests, three-way parser comparison).
# Building this feature requires a C toolchain and libclang to compile
# `tree-sitter-perl-c`.
parser-tasks = ["legacy", "tree-sitter-perl-c"]
