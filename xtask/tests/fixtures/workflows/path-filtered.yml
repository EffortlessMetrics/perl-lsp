name: Path Filtered Required Workflow

on:
  pull_request:
    branches: [master]
    paths:
      - crates/**
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]

concurrency:
  group: required-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
