name: fixture-pr-with-scheduled-write-job
on:
  pull_request:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded:
    runs-on: ubuntu-latest
    steps:
      - run: cargo test -p xtask -- --help
  full:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: git push
