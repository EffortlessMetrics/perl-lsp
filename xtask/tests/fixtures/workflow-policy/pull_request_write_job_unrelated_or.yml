name: fixture-pr-write-job-unrelated-or
on:
  pull_request:
  schedule:
    - cron: '0 8 * * *'
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'schedule' || github.repository == 'EffortlessMetrics/perl-lsp-swarm'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: git push
