[package]
name = "perl-dap-variables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Variable rendering for Perl DAP"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EffortlessMetrics/perl-lsp"
homepage = "https://github.com/EffortlessMetrics/perl-lsp"
documentation = "https://docs.rs/perl-dap-variables"
keywords = ["perl", "dap", "debug", "variables", "rendering"]
categories = ["development-tools::debugging", "development-tools"]

[dependencies]
perl-dap-value = { workspace = true }

# Serialization for DAP protocol
serde = { workspace = true }

# Regex for parsing debugger output
regex.workspace = true
once_cell.workspace = true

# Error handling
thiserror.workspace = true

[dev-dependencies]
perl-tdd-support = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
