[package]
name = "perl-lsp-formatting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "LSP formatting provider for Perl with perltidy integration"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-lsp-formatting"
keywords = ["perl", "lsp", "formatting", "perltidy", "code-formatting"]
categories = ["development-tools", "text-editors"]

[lib]
doctest = false

[dependencies]
perl-lsp-tooling = { workspace = true }
perl-lsp-rs-core = { workspace = true }
perl-lsp-perltidy = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
perl-tdd-support = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
