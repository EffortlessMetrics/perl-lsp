[package]
name = "perl-dap-platform"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Cross-platform runtime utilities for perl-dap"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-dap-platform"
readme = "README.md"
keywords = ["perl", "dap", "platform", "path", "debugger"]
categories = ["development-tools::debugging", "os"]
include = [
  "src/**",
  "Cargo.toml",
  "README.md",
  "LICENSE*"
]

[lib]
name = "perl_dap_platform"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
perl-dap-shell = { workspace = true }

[dev-dependencies]
perl-tdd-support = { workspace = true }
tempfile = "3.24.0"

[lints]
workspace = true
