[package]
name = "perl-ast-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "AST range and insertion helpers for Perl LSP features"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-ast-utils"
keywords = ["perl", "lsp", "ast", "utilities"]
categories = ["development-tools", "text-editors"]
include = [
    "src/**/*",
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "CLAUDE.md",
    "ROADMAP.md",
]

[lib]
doctest = false

[dependencies]
perl-ast = { workspace = true }

[dev-dependencies]
perl-ast = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
