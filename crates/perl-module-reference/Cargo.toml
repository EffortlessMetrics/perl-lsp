[package]
name = "perl-module-reference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Find Perl module references under the cursor on use/require lines"
readme = "README.md"
documentation = "https://docs.rs/perl-module-reference"
keywords = ["perl", "module", "reference", "lsp", "navigation"]
categories = ["development-tools", "text-editors"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
perl-module-name = { workspace = true }
perl-module-token-parser = { workspace = true }
perl-text-line = { workspace = true }

[dev-dependencies]
proptest = "1.11.0"
perl-module-import = { workspace = true }
perl-module-path = { workspace = true }

[lints]
workspace = true
