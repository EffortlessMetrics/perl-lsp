[package]
name = "perl-symbol-surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Projection layer: derives stable symbol-bearing views from the Perl AST"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-symbol-surface"
keywords = ["perl", "lsp", "symbols", "ast", "projection"]
categories = ["development-tools", "text-editors"]
include = [
    "src/**/*",
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "CLAUDE.md",
]

[lib]
doctest = false

[dependencies]
perl-ast = { workspace = true }
perl-symbol-types = { workspace = true }

[dev-dependencies]
perl-ast = { workspace = true }
perl-symbol-types = { workspace = true }
perl-tdd-support = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
