[package]
name = "perl-dap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Debug Adapter Protocol server for Perl"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-dap"
readme = "README.md"
keywords = ["perl", "dap", "debug", "debugger", "adapter"]
categories = ["development-tools::debugging", "command-line-utilities"]
include = [
  "src/**",
  "build.rs",
  "features_sot.toml",
  "Cargo.toml",
  "README.md",
  "LICENSE*"
]

[[bin]]
name = "perl-dap"
path = "src/main.rs"

[lib]
name = "perl_dap"
path = "src/lib.rs"

[dependencies]
# JSON serialization
serde = { workspace = true }
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Regex for parsing debugger output
regex.workspace = true
once_cell.workspace = true

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Logging
tracing.workspace = true

# Command-line argument parsing
clap = { workspace = true }

perl-dap-breakpoint = { workspace = true }
perl-dap-eval = { workspace = true }
perl-dap-config = { workspace = true }
perl-dap-platform = { workspace = true }
perl-dap-command-args = { workspace = true }
perl-dap-variables = { workspace = true }
perl-dap-stack = { workspace = true }
perl-dap-types = { workspace = true }
perl-module-path = { workspace = true }
perl-dap-security = { workspace = true }
perl-content-length-framing = { workspace = true }
perl-keywords = { workspace = true }
perl-lsp-launcher = { workspace = true }

# Process management
# Note: tokio-process not needed (using tokio::process)

[dev-dependencies]
# Property-based testing (AC13)
proptest.workspace = true

# Performance benchmarking (AC14, AC15)
criterion.workspace = true

# Test fixtures
tempfile.workspace = true

perl-tdd-support = { workspace = true }

[build-dependencies]
perl-feature-catalog = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.1", features = ["signal"] }  # For SIGINT handling (AC9)

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["processthreadsapi", "wincon"] }  # For Ctrl+C and GenerateConsoleCtrlEvent (AC9, #3028)

[features]
default = ["dap-phase1", "dap-phase2", "dap-phase3"]
# DAP implementation phases (TDD scaffold tests)
dap-phase1 = []  # AC1-AC4: Bridge to Perl::LanguageServer
dap-phase2 = []  # AC5-AC16: Native adapter, integration tests, performance, security
dap-phase3 = []  # AC17-AC19: Non-regression, dependency management, packaging

# Test targets with acceptance criteria mapping
[[test]]
name = "bridge_adapter_unit_tests"
path = "tests/bridge_adapter_unit_tests.rs"
# Unit tests for BridgeAdapter lifecycle (bridge_adapter.rs)

[[test]]
name = "protocol_edge_case_tests"
path = "tests/protocol_edge_case_tests.rs"
# Protocol edge cases: malformed JSON, missing fields, boundary values

[[test]]
name = "bridge_integration_tests"
path = "tests/bridge_integration_tests.rs"
# AC1-AC4: Bridge to Perl::LanguageServer DAP

[[test]]
name = "dap_adapter_tests"
path = "tests/dap_adapter_tests.rs"
# AC5-AC12: Native Rust adapter implementation

[[test]]
name = "tcp_attach_tests"
path = "tests/tcp_attach_tests.rs"
# Phase5: TCP attach functionality tests

[[test]]
name = "dap_golden_transcript_tests"
path = "tests/dap_golden_transcript_tests.rs"
# AC13: Comprehensive integration tests with golden transcripts

[[test]]
name = "dap_attach_e2e"
path = "tests/dap_attach_e2e.rs"
# AC13: TCP attach e2e happy-path coverage

[[test]]
name = "dap_breakpoint_matrix_tests"
path = "tests/dap_breakpoint_matrix_tests.rs"
# AC13, AC14: Breakpoint validation edge cases

[[test]]
name = "dap_performance_tests"
path = "tests/dap_performance_tests.rs"
# AC14, AC15: Performance benchmarks and baselines

[[test]]
name = "dap_security_tests"
path = "tests/dap_security_tests.rs"
# AC16: Security validation (path traversal, safe eval, timeout, Unicode)

[[test]]
name = "dap_dependency_tests"
path = "tests/dap_dependency_tests.rs"
# AC18: Dependency management and installation strategy

[[test]]
name = "dap_packaging_tests"
path = "tests/dap_packaging_tests.rs"
# AC19: Binary packaging and cross-platform distribution

[[test]]
name = "dap_protocol_message_tests"
path = "tests/dap_protocol_message_tests.rs"
# AC:2783: Protocol message tests for 10 previously untested commands

[[test]]
name = "dap_feature_flag_coverage_tests"
path = "tests/dap_feature_flag_coverage_tests.rs"
# AC0-AC9: Feature flag coverage for 10 DAP features (#2784, #2900)

[[test]]
name = "dap_warn_exception_tests"
path = "tests/dap_warn_exception_tests.rs"
# dap.exceptions.warn: warn filter capability and setExceptionBreakpoints acceptance (#2900)

[[test]]
name = "dap_watchpoints_tests"
path = "tests/dap_watchpoints_tests.rs"
# dap.watchpoints: dataBreakpointInfo + setDataBreakpoints functional tests (#2900)

[[test]]
name = "dap_non_regression_tests"
path = "tests/dap_non_regression_tests.rs"
# AC:17 Phase 3 non-regression: protocol shape, seq monotonicity, capabilities consistency (#435)

[[test]]
name = "dap_step_through_tests"
path = "tests/dap_step_through_tests.rs"
# AC:3535 Comprehensive step-through debugging tests: stepIn, stepOut, stepOver, continue, pause, gotoTargets, cancel

[[test]]
name = "dap_syntax_check_tests"
path = "tests/dap_syntax_check_tests.rs"
# AC:3477 Pre-launch syntax check using perl -c, clear error messages before debug start

[[test]]
name = "dap_e2e_workflow_tests"
path = "tests/dap_e2e_workflow_tests.rs"
# AC:3486 End-to-end workflow: launch -> breakpoint -> inspect -> step -> continue -> exit

[[test]]
name = "dap_scorecard_harness"
path = "tests/dap_scorecard_harness.rs"
# AC:4069 DAP launch-success scorecard: 5 fixtures, ≥80% pass rate, p50/p95 latency

[[bench]]
name = "dap_benchmarks"
path = "benches/dap_benchmarks.rs"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
