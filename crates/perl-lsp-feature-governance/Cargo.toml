[package]
name = "perl-lsp-feature-governance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Feature profile governance façade for Perl LSP (parsing, policies, and grid interoperability)."
documentation = "https://docs.rs/perl-lsp-feature-governance"
readme = "README.md"
keywords = ["perl", "lsp", "features", "profile", "governance"]
categories = ["development-tools", "development-tools::testing"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
perl-lsp-rs-core = { workspace = true }

[features]
lsp-ga-lock = [
    "perl-lsp-rs-core/lsp-ga-lock",
]

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
