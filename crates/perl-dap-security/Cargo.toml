[package]
name = "perl-dap-security"
version = "0.12.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Security validation primitives for perl-dap"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-dap-security"
readme = "README.md"
keywords = ["perl", "dap", "security", "debugger", "validation"]
categories = ["development-tools::debugging", "development-tools"]

[lib]
name = "perl_dap_security"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
perl-path-security = { workspace = true }

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
perl-tdd-support = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
