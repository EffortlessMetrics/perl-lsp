[package]
name = "perl-lsp-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Typed CLI launch configuration for the Perl LSP runtime."
documentation = "https://docs.rs/perl-lsp-launcher"
readme = "README.md"
keywords = ["perl", "lsp", "cli", "launcher", "startup"]
categories = ["development-tools", "development-tools::debugging"]

include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
clap = { workspace = true }
perl-lsp-feature-governance = { workspace = true }
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[features]
lsp-ga-lock = ["perl-lsp-feature-governance/lsp-ga-lock"]

[dev-dependencies]
perl-tdd-support = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
