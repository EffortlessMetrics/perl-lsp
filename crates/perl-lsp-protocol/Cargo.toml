[package]
name = "perl-lsp-protocol"
version = "0.12.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "JSON-RPC/LSP protocol types and capability configuration for perl-lsp"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-lsp-protocol"
keywords = ["perl", "lsp", "jsonrpc", "protocol", "language-server"]
categories = ["development-tools", "text-editors"]
include = [
  "src/**",
  "Cargo.toml",
  "LICENSE*",
  "README.md"
]

[dependencies]
serde = { workspace = true }
serde_json.workspace = true
perl-lsp-feature-flags = { workspace = true }
lsp-types.workspace = true

[dev-dependencies]
perl-lsp-feature-contracts = { workspace = true }

[features]
lsp-ga-lock = []

[lints]
workspace = true
