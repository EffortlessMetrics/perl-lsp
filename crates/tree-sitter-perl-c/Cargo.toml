[package]
name = "tree-sitter-perl-c"
version = "0.12.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tree-sitter Perl grammar with C scanner (legacy implementation)"
readme = "README.md"
documentation = "https://docs.rs/tree-sitter-perl-c"
keywords = ["tree-sitter", "perl", "parser", "grammar", "ffi"]
categories = ["parsing", "text-processing"]
include = [
    "src/**",
    "c-src/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[dependencies]
tree-sitter = "0.26.6"

[dev-dependencies]
criterion.workspace = true
test-case = "3.3.1"

[features]
default = ["c-scanner"]
c-scanner = []
test-utils = []

[lib]
name = "tree_sitter_perl_c"
path = "src/lib.rs"

[[bin]]
name = "bench_parser_c"
path = "src/bin/bench_parser.rs"
required-features = ["test-utils"]

[[bin]]
name = "parse_c"
path = "src/bin/parse_c.rs"

[build-dependencies]
cc = "1.2.51"
