[package]
name = "perl-dap-configuration"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Launch and attach configuration models for perl-dap"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-dap-configuration"
readme = "README.md"
keywords = ["perl", "dap", "configuration", "debugger"]
categories = ["development-tools::debugging", "config"]
include = [
  "src/**",
  "Cargo.toml",
  "README.md",
  "LICENSE*"
]

[lib]
name = "perl_dap_configuration"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lints]
workspace = true
