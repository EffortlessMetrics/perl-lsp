[package]
name = "perl-symbol-scope"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-symbol-scope"
description = "Shared scope identifiers and scope kind enums for Perl symbol analysis"
readme = "README.md"
keywords = ["perl", "scope", "symbol", "lsp", "ide"]
categories = ["development-tools", "text-editors"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[lints]
workspace = true
