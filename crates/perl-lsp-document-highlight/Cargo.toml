[package]
name = "perl-lsp-document-highlight"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SRP microcrate for Perl LSP document highlight (symbol occurrence highlighting)"
readme = "README.md"
documentation = "https://docs.rs/perl-lsp-document-highlight"
keywords = ["perl", "lsp", "document-highlight", "ide", "language-server"]
categories = ["development-tools", "text-editors"]
include = [
  "src/**",
  "tests/**",
  "Cargo.toml",
  "README.md",
  "LICENSE*"
]

[dependencies]
perl-ast = { workspace = true }
perl-qualified-name = { workspace = true }

[dev-dependencies]
perl-parser = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
