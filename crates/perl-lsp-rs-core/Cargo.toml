[package]
name = "perl-lsp-rs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
description = "Implementation core for perl-lsp-rs (Wave F: feature flags, contracts, capability mapping)"
documentation = "https://docs.rs/perl-lsp-rs-core"
readme = "README.md"
keywords = ["perl", "lsp", "features", "contracts", "capabilities"]
categories = ["development-tools", "development-tools::testing"]
include = [
  "src/**",
  "build.rs",
  "features_sot.toml",
  "Cargo.toml",
  "README.md"
]

[lib]
doctest = false

[dependencies]
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true

# Provider crate dependencies (Wave G1a: 15 providers absorbed)
perl-parser-core.workspace = true
perl-module.workspace = true
perl-position-tracking.workspace = true
perl-semantic-analyzer.workspace = true
perl-lexer.workspace = true
perl-ast.workspace = true
walkdir.workspace = true
once_cell.workspace = true
regex.workspace = true
url.workspace = true

# Wave G1b additional dependencies (10 medium-risk providers absorbed)
perl-lsp-tooling.workspace = true
perl-lsp-perltidy.workspace = true
# perl-lsp-uri absorbed into perl-lsp-rs-core::uri (Wave G3 step 3)
perl-diagnostics.workspace = true
perl-workspace.workspace = true
perl-pragma.workspace = true
perl-symbol.workspace = true
perl-parser.workspace = true
rustc-hash = "2.1.2"
thiserror.workspace = true
ureq = { version = "3", features = ["json"] }

# Wave G2 runtime crate dependencies (6 runtime crates absorbed)
anyhow.workspace = true
clap = { workspace = true }
# NOTE(G2-cycle-fix): perl-lsp-feature-governance and perl-lsp-protocol cannot be
# deps of perl-lsp-rs-core because they both depend on perl-lsp-rs-core (cyclic).
# - launcher module uses crate::features::* directly instead of perl-lsp-feature-governance
# NOTE(G2-defer): perl-lsp-transport deferred to G3; perl-content-length-framing not needed
# - transport is kept as separate crate (perl-lsp-transport) until G3 resolves the cycle
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[build-dependencies]
perl-feature-catalog.workspace = true

[features]
lsp-ga-lock = []
lsp-compat = []

[dev-dependencies]
perl-tdd-support.workspace = true
serde_json.workspace = true
perl-lsp-rs.workspace = true
perl-lsp-tooling.workspace = true
tempfile.workspace = true
insta = { version = "1.47.2", features = ["yaml"] }
proptest.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
