[package]
name = "perl-lsp-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "LSP transport layer with Content-Length message framing for perl-lsp"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-lsp-transport"
keywords = ["perl", "lsp", "transport", "jsonrpc", "content-length"]
categories = ["development-tools", "text-editors"]
include = [
  "src/**",
  "Cargo.toml",
  "LICENSE*",
  "README.md",
  "CLAUDE.md",
]

[dependencies]
# perl-lsp-protocol absorbed into perl-lsp-rs-core::protocol (Wave G3 step 2)
perl-lsp-rs-core = { workspace = true }
perl-content-length-framing = { workspace = true }
serde_json.workspace = true
tracing.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
