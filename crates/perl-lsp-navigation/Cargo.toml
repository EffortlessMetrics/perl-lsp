[package]
name = "perl-lsp-navigation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "LSP navigation providers for Perl"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-lsp-navigation"
keywords = ["perl", "lsp", "navigation", "go-to-definition", "find-references"]
categories = ["development-tools", "text-editors"]

[lib]
doctest = false

[dependencies]
perl-parser-core = { workspace = true }
lsp-types = { workspace = true }
serde_json = { workspace = true }
perl-position-tracking = { workspace = true }
perl-lsp-document-links = { workspace = true }
perl-lsp-type-hierarchy = { workspace = true }
perl-lsp-workspace-symbols = { workspace = true }

[features]
default = []
lsp-compat = []  # Enable LSP-specific functionality
slow_tests = []  # Enable slow/expensive tests

[dev-dependencies]
criterion.workspace = true
perl-parser-core = { workspace = true }
perl-tdd-support = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[[bench]]
name = "navigation_benchmark"
harness = false
