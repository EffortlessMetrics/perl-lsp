[package]
name = "perl-module-resolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Deterministic and secure Perl module resolution for workspace and @INC search"
readme = "README.md"
documentation = "https://docs.rs/perl-module-resolution"
keywords = ["perl", "module", "resolution", "lsp", "workspace"]
categories = ["development-tools", "text-editors"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
perl-module-resolution-path = { workspace = true }
perl-module-resolution-uri = { workspace = true }

[dev-dependencies]
url.workspace = true
proptest.workspace = true
tempfile.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
