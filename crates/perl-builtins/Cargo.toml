[package]
name = "perl-builtins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Builtin symbol metadata for Perl parser and LSP tooling"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-builtins"
keywords = ["perl", "builtins", "parser", "lsp", "signatures"]
categories = ["development-tools", "text-processing"]

[dependencies]
perl-builtins-phf = { path = "../perl-builtins-phf", version = "0.12.4" }

[dev-dependencies]
perl-tdd-support = { path = "../perl-tdd-support" }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
