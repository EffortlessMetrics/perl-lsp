[package]
name = "perl-text-line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Text-line cursor and boundary helpers"
readme = "README.md"
documentation = "https://docs.rs/perl-text-line"
keywords = ["perl", "text", "line", "cursor", "boundary"]
