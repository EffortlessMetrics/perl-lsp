[package]
name = "perl-path-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Workspace-bound path validation and traversal prevention for Perl tooling"
readme = "README.md"
documentation = "https://docs.rs/perl-path-security"
keywords = ["perl", "security", "path", "workspace", "validation"]
categories = ["development-tools", "filesystem"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
perl-path-normalize = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
