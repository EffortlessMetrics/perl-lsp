[package]
name = "perl-lsp-completion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Context-aware LSP completion engine for Perl — variables, functions, methods, packages, and file paths"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-lsp-completion"
keywords = ["perl", "lsp", "completion", "autocomplete", "ide"]
categories = ["development-tools", "text-editors"]

[lib]
doctest = false

[dependencies]
perl-lsp-completion-item = { workspace = true }
perl-lsp-file-completion = { workspace = true }
perl-module-path = { workspace = true }
perl-parser-core = { workspace = true }
perl-semantic-analyzer = { workspace = true }
perl-workspace-index = { workspace = true }
perl-keywords = { workspace = true }
url = "2.5.8"

[features]
default = []

[dev-dependencies]
criterion = "0.8.1"
perl-parser-core = { workspace = true }
perl-tdd-support = { workspace = true }
perl-workspace-index = { workspace = true }
serde_json = "1.0"
url = "2.5.8"

[lints]
workspace = true

[[bench]]
name = "completion_benchmark"
harness = false
