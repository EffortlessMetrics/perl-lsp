[package]
name = "perl-lsp-completion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Context-aware LSP completion engine for Perl — variables, functions, methods, packages, and file paths"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-lsp-completion"
keywords = ["perl", "lsp", "completion", "autocomplete", "ide"]
categories = ["development-tools", "text-editors"]

[lib]
doctest = false

[dependencies]
perl-lsp-rs-core = { workspace = true }
perl-parser-core = { workspace = true }
perl-semantic-analyzer = { workspace = true }
perl-workspace = { workspace = true }
perl-lexer = { workspace = true }
perl-module = { workspace = true }
url.workspace = true

[features]
default = []

[dev-dependencies]
criterion.workspace = true
perl-parser-core = { workspace = true }
perl-tdd-support = { workspace = true }
perl-workspace = { workspace = true }
serde_json.workspace = true
url.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[[bench]]
name = "completion_benchmark"
harness = false
