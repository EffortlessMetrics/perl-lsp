[package]
name = "perl-token"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Token definitions for Perl parser"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-token"
keywords = ["perl", "token", "parser", "lexer", "tokenization"]
categories = ["parsing", "text-processing"]

[dependencies]
# No external dependencies for now (Arc is std)

[dev-dependencies]
criterion.workspace = true
perl-lexer = { workspace = true }
perl-parser-core = { workspace = true }
proptest.workspace = true
serde = { workspace = true }
serde_json.workspace = true

[[bench]]
name = "token_scorecard"
harness = false

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
