[package]
name = "perl-symbol-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Unified Perl symbol taxonomy for LSP tooling"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-symbol-types"
readme = "README.md"
keywords = ["perl", "lsp", "symbols", "taxonomy", "language-server"]
categories = ["development-tools", "data-structures"]
include = [
  "src/**",
  "Cargo.toml",
  "LICENSE*"
]

[lib]
doctest = false

[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json.workspace = true

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

