[package]
name = "perl-ts-statement-tracker"
version = "0.12.2"
edition = "2024"
rust-version = "1.92"
description = "Statement boundary and heredoc context tracking for Perl tree-sitter tooling"
publish = false
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/EffortlessMetrics/perl-lsp"
homepage = "https://github.com/EffortlessMetrics/perl-lsp"
documentation = "https://github.com/EffortlessMetrics/perl-lsp"
keywords = ["perl", "tree-sitter", "heredoc", "parser", "lsp"]
categories = ["parsing", "development-tools", "text-processing"]

[lints.rust]
unused_imports = "warn"
dead_code = "warn"

[lints.clippy]
collapsible_if = "warn"
manual_strip = "warn"
unnecessary_map_or = "warn"
redundant_closure = "warn"
while_let_on_iterator = "warn"
len_zero = "warn"
only_used_in_recursion = "warn"
ptr_arg = "warn"
