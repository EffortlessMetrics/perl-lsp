[package]
name = "perl-lsp-inlay-hints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "LSP inlay hints provider for Perl"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-lsp-inlay-hints"
keywords = ["perl", "lsp", "inlay-hints", "type-hints", "ide"]
categories = ["development-tools", "text-editors"]

[lib]
doctest = false

[dependencies]
perl-semantic-analyzer = { workspace = true }
perl-position-tracking = { workspace = true }
perl-parser-core = { workspace = true }
perl-lexer = { workspace = true }
serde_json.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
