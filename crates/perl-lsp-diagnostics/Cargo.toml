[package]
name = "perl-lsp-diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "LSP diagnostics provider for Perl"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-lsp-diagnostics"
keywords = ["perl", "lsp", "diagnostics", "linting", "static-analysis"]
categories = ["development-tools", "text-editors"]

[lib]
doctest = false

[dependencies]
perl-diagnostics-codes = { workspace = true }
perl-lsp-diagnostic-types = { workspace = true }
perl-parser-core = { workspace = true }
perl-semantic-analyzer = { workspace = true }
perl-workspace-index = { workspace = true }
perl-pragma = { workspace = true }
perl-heredoc-anti-patterns = { workspace = true }

[dev-dependencies]
perl-tdd-support = { workspace = true }
perl-parser = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
