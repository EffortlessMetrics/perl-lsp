[package]
name = "perl-lsp-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "LSP wire position/range/location types and UTF-8/UTF-16 conversion"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-lsp-wire"
keywords = ["perl", "lsp", "wire", "position", "utf16"]
categories = ["development-tools", "text-editors"]
include = [
  "src/**",
  "Cargo.toml",
  "README.md",
  "LICENSE*"
]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[features]
default = []
lsp-compat = ["lsp-types"]

[dependencies.lsp-types]
version = "0.97.0"
optional = true

[lints]
workspace = true
