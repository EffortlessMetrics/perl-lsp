[package]
name = "perl-dap-security-patterns"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Shared regex patterns and blocked operation catalog for Perl DAP safe evaluation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EffortlessMetrics/perl-lsp"
homepage = "https://github.com/EffortlessMetrics/perl-lsp"
documentation = "https://docs.rs/perl-dap-security-patterns"
readme = "README.md"
keywords = ["perl", "dap", "security", "regex", "debug"]
categories = ["development-tools", "development-tools::debugging"]

[dependencies]
regex = "1.12.2"
once_cell = "1.21.3"

[dev-dependencies]
perl-tdd-support = { workspace = true }

[lints]
workspace = true
