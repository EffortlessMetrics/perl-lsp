[package]
name = "perl-lsp-performance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Performance utilities for Perl LSP and parser workloads"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/perl-lsp-performance"
keywords = ["perl", "lsp", "performance", "cache", "indexing"]
categories = ["development-tools", "caching"]
publish = false

[lib]
doctest = false

[dependencies]
perl-parser-core = { workspace = true }
perl-symbol = { workspace = true }
moka = { version = "0.12", features = ["sync"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
