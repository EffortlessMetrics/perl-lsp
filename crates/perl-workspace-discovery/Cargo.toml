[package]
name = "perl-workspace-discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-workspace-discovery"
description = "Git-aware Perl workspace file discovery with WalkDir fallback"
readme = "README.md"
keywords = ["perl", "workspace", "discovery", "lsp", "git"]
categories = ["development-tools", "filesystem"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
perl-source-file = { workspace = true }
perl-workspace-ignore = { workspace = true }
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
