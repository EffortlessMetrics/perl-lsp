[package]
name = "perl-lsp-feature-grid"
version.workspace = true
edition = { workspace = true }
rust-version.workspace = true
authors = { workspace = true }
license = "MIT OR Apache-2.0"
repository = { workspace = true }
homepage = { workspace = true }
description = "BDD-aware feature-grid payload and profile-aware advertized feature APIs for Perl LSP."
documentation = "https://docs.rs/perl-lsp-feature-grid"
readme = "README.md"
keywords = ["perl", "lsp", "features", "bdd", "capability"]
categories = ["development-tools", "development-tools::testing"]
include = ["src/**", "Cargo.toml", "README.md"]

[dependencies]
perl-lsp-feature-contracts = { workspace = true }
perl-lsp-feature-policy = { workspace = true }
serde_json.workspace = true

[features]
lsp-ga-lock = [
    "perl-lsp-feature-contracts/lsp-ga-lock",
    "perl-lsp-feature-policy/lsp-ga-lock",
]

[dev-dependencies]
perl-tdd-support = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
