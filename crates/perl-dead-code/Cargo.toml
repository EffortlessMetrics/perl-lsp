[package]
name = "perl-dead-code"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Dead code detection for Perl codebases"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-dead-code"
keywords = ["perl", "dead-code", "analysis", "lsp"]
categories = ["parsing", "development-tools", "text-editors"]
include = [
  "src/**",
  "Cargo.toml",
  "LICENSE*",
  "README.md"
]

[lib]
doctest = false

[dependencies]
perl-workspace-index = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
