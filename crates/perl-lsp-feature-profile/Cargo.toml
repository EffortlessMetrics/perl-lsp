[package]
name = "perl-lsp-feature-profile"
version.workspace = true
edition = { workspace = true }
rust-version.workspace = true
authors = { workspace = true }
license = "MIT OR Apache-2.0"
repository = { workspace = true }
homepage = { workspace = true }
description = "Canonical feature profile contract and parsing for perl-lsp CLI/profile interoperability."
documentation = "https://docs.rs/perl-lsp-feature-profile"
readme = "README.md"
keywords = ["perl", "lsp", "features", "profile", "cli"]
categories = ["development-tools", "development-tools::testing"]

include = ["src/**", "Cargo.toml", "README.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
perl-lsp-feature-contracts = { workspace = true }

[features]
lsp-ga-lock = ["perl-lsp-feature-contracts/lsp-ga-lock"]
