[package]
name = "perl-lsp-feature-policy"
version.workspace = true
edition = { workspace = true }
rust-version.workspace = true
authors = { workspace = true }
license = "MIT OR Apache-2.0"
repository = { workspace = true }
homepage = { workspace = true }
description = "Policy and profile helpers for LSP capability selection."
documentation = "https://docs.rs/perl-lsp-feature-policy"
readme = "README.md"
keywords = ["perl", "lsp", "features", "policy", "capabilities"]
categories = ["development-tools", "development-tools::testing"]

include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[dependencies]
perl-lsp-feature-contracts = { workspace = true }
perl-lsp-feature-profile = { workspace = true }
perl-lsp-feature-flags = { workspace = true }

[features]
lsp-ga-lock = [
    "perl-lsp-feature-contracts/lsp-ga-lock",
    "perl-lsp-feature-profile/lsp-ga-lock",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
