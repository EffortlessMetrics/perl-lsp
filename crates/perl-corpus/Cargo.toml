[package]
name = "perl-corpus"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Test corpus management and generators for Perl parsers"
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/perl-corpus"
homepage.workspace = true
keywords = ["perl", "corpus", "proptest", "testing", "parser"]
categories = ["development-tools", "development-tools::testing"]
include = ["src/**", "README.md", "LICENSE*", "Cargo.toml"]

[lib]
name = "perl_corpus"
path = "src/lib.rs"

[[bin]]
name = "perl-corpus"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
regex = "1.12.3"
glob = "0.3.3"
clap = { version = "4.5.60", features = ["derive"] }
once_cell = "1.21.3"
chrono = "0.4.44"
proptest = "1.10.0"
rand = "0.10.0"

[dev-dependencies]
proptest = "1.10.0"
perl-parser = { workspace = true }
perl-tdd-support = { workspace = true }

[features]
default = []
# Enable fast CI mode that skips slow/flaky property tests
ci-fast = []

[package.metadata.docs.rs]
all-features = false
[lints]
workspace = true
