[package]
name = "perl-lsp-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Perl Language Server (LSP) — Tree-sitter-compatible with comprehensive IDE features"
readme = "README.md"
documentation = "https://docs.rs/perl-lsp-rs"
keywords = ["perl", "lsp", "language-server", "ide", "tree-sitter"]
categories = ["development-tools", "text-editors"]
include = [
  "src/**",
  "build.rs",
  "features_sot.toml",
  "Cargo.toml",
  "README.md",
  "LICENSE*"
]

[lib]
name = "perl_lsp"
path = "src/lib.rs"

[[bin]]
name = "perl-lsp"
path = "src/main.rs"

[dependencies]
perl-dap = { workspace = true, optional = true }
perl-incremental-parsing = { workspace = true, optional = true }
perl-parser = { workspace = true, features = ["test-performance"] }
perl-lsp-providers = { workspace = true, features = ["lsp-compat"] }
perl-lsp-formatting = { workspace = true }
perl-lsp-cancellation = { workspace = true }
perl-lsp-color-provider = { workspace = true }
perl-lsp-input-validation = { workspace = true }
perl-lsp-limits = { workspace = true }
perl-lsp-uri = { workspace = true }
perl-lsp-feature-governance = { workspace = true }
perl-lsp-tooling = { workspace = true }
perl-subprocess-runtime = { workspace = true }
perl-lsp-config = { workspace = true }
perl-dap-platform = { workspace = true }
perl-lsp-protocol = { workspace = true }
perl-lsp-transport = { workspace = true }
perl-lsp-code-actions = { workspace = true }
perl-lsp-inline-completion = { workspace = true }
perl-lsp-ai-provider = { workspace = true }
perl-lsp-completion = { workspace = true }
perl-lsp-diagnostics = { workspace = true }
perl-diagnostics-codes = { workspace = true }
perl-lsp-document-highlight = { workspace = true }
perl-lsp-inlay-hints = { workspace = true }
perl-lsp-code-lens = { workspace = true }
perl-lsp-navigation = { workspace = true, features = ["lsp-compat"] }
perl-lsp-type-hierarchy = { workspace = true }
perl-lsp-rename = { workspace = true }
perl-lsp-selection-range = { workspace = true }
perl-lsp-semantic-tokens = { workspace = true }
perl-lsp-launcher = { workspace = true }
perl-lsp-diagnostic-catalog = { workspace = true }
# Wired provider crates (#2756) — formerly built but unused in this binary
perl-lsp-workspace-symbols = { workspace = true }
perl-lsp-symbol-query = { workspace = true }
perl-lsp-completion-item = { workspace = true }
perl-lsp-formatting-types = { workspace = true }
perl-lsp-critic-parser = { workspace = true }
perl-lsp-import-management = { workspace = true }
perl-lsp-capability-map = { workspace = true }
perl-lsp-performance = { workspace = true }
perl-lsp-feature-flags = { workspace = true }
perl-lsp-feature-policy = { workspace = true }
perl-lsp-feature-contracts = { workspace = true }
perl-lsp-feature-grid = { workspace = true }
perl-lsp-feature-profile = { workspace = true }
perl-lsp-feature-profile-cli = { workspace = true }
perl-lsp-perltidy = { workspace = true }
perl-lsp-document-links = { workspace = true }
perl-position-tracking = { workspace = true, features = ["lsp-compat"] }
perl-symbol-cursor = { workspace = true }
perl-module = { workspace = true }
perl-qualified-name = { workspace = true }
perl-pod = { workspace = true }
perl-source-file = { workspace = true }
perl-workspace-discovery = { workspace = true }
perl-workspace-folder = { workspace = true }
perl-workspace-ignore = { workspace = true }
perl-workspace-index = { workspace = true }
perl-keywords = { workspace = true }
lsp-types.workspace = true
serde = { workspace = true }
serde_json.workspace = true
url.workspace = true
anyhow.workspace = true
regex.workspace = true
md5 = "0.8.0"
parking_lot.workspace = true
walkdir.workspace = true
uuid = { version = "1.23.0", features = ["v4"] }

# Core dependencies for position mapping
ropey = { version = "1.6.1" }
tokio = { workspace = true }
once_cell.workspace = true
tracing.workspace = true

[build-dependencies]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["workspace", "incremental"]  # Enable workspace indexing and incremental parsing by default
workspace = []  # Workspace-wide indexing for cross-file features
incremental = ["perl-parser/incremental", "perl-incremental-parsing"]  # Incremental parsing support
test-performance = []  # Performance optimizations for test environments
# When enabled, advertise *only* the conservative GA set (for emergency point releases).
lsp-ga-lock = [
  "perl-lsp-protocol/lsp-ga-lock",
  "perl-lsp-feature-governance/lsp-ga-lock",
  "perl-lsp-launcher/lsp-ga-lock",
]
experimental-features = []  # Experimental LSP features for testing
stress-tests = []  # Enable stress tests that are too slow for CI

# Aspirational features for tests that should eventually pass
constant-advanced = []  # Advanced constant pragma parsing (hash form, qw form)
qw-variants = []  # Support for all qw delimiter variants
package-qualified = []  # Package-qualified subroutine resolution
error-classifier-v2 = []  # Next generation error classification
lsp-advanced = []  # Advanced LSP features (profiling, git integration, etc.)
expose_lsp_test_api = ["perl-parser/expose_lsp_test_api"]  # Expose test helpers for integration tests
lsp-extras = []  # Quarantined tests for unimplemented/aspirational LSP features
strict-jsonrpc = []  # Strict JSON-RPC 2.0 protocol validation tests
dap-phase1 = ["perl-dap"]  # DAP Phase 1: Bridge to Perl::LanguageServer (AC1-AC4)
dap-phase3 = ["dap-phase1"]  # DAP Phase 3: Non-regression tests (AC17), requires DAP bridge
utf16-complete = ["perl-parser/utf16-complete"]  # Complete UTF-16 round-trip support

[dev-dependencies]
assert_cmd = "2.1.2"
insta = { version = "1.47.2", features = ["yaml"] }
predicates = "3.1.3"
serial_test = "3.4.0"
tempfile.workspace = true
proptest.workspace = true
perl-tdd-support = { workspace = true }
perl-content-length-framing = { workspace = true }
which = "8.0.2"
parking_lot.workspace = true
criterion.workspace = true
perl-ast-utils = { workspace = true }
perl-corpus = { workspace = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/perl-lsp-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bench]]
name = "rope_performance_benchmark"
harness = false
