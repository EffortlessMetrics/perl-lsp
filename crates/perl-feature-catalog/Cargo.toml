[package]
name = "perl-feature-catalog"
version = "0.12.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared feature catalog model and code-generation helpers for capability-driven features."
documentation = "https://docs.rs/perl-feature-catalog"
readme = "README.md"
keywords = ["perl", "lsp", "dap", "features", "capability"]
categories = ["development-tools", "development-tools::testing"]
include = ["src/**", "Cargo.toml", "README.md"]

[dependencies]
serde = { workspace = true }
thiserror.workspace = true
toml = "1.1.2"

[dev-dependencies]
perl-tdd-support = { path = "../perl-tdd-support" }
tempfile.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

