[package]
name = "perl-lsp-tooling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Tooling integration for Perl LSP (perlcritic, subprocess abstraction, performance re-exports)"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-lsp-tooling"
keywords = ["perl", "lsp", "perlcritic", "tooling", "subprocess"]
categories = ["development-tools", "text-editors"]

[lib]
doctest = false

[features]
default = ["lsp-compat"]
lsp-compat = ["dep:lsp-types"]

[dependencies]
perl-subprocess-runtime = { workspace = true }
perl-lsp-perltidy = { workspace = true }
perl-parser-core = { workspace = true }
perl-lsp-performance = { workspace = true }
perl-lsp-critic-parser = { workspace = true }
lsp-types = { version = "0.97.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
perl-tdd-support = { workspace = true }
criterion = "0.8"
serde_json = { workspace = true }

[[bench]]
name = "cache_benchmark"
harness = false

[lints]
workspace = true
