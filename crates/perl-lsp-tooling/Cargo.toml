[package]
name = "perl-lsp-tooling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Tooling integration for Perl LSP (perltidy, perlcritic, subprocess abstraction)"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-lsp-tooling"
keywords = ["perl", "lsp", "perltidy", "perlcritic", "tooling"]
categories = ["development-tools", "text-editors"]

[lib]
doctest = false

[features]
default = ["lsp-compat"]
lsp-compat = ["dep:lsp-types"]

[dependencies]
perl-subprocess-runtime = { workspace = true }
perl-lsp-perltidy = { workspace = true }
perl-parser-core = { workspace = true }
# perl-lsp-performance absorbed into perl-lsp-rs-core::performance (Wave G3 step 5)
perl-lsp-rs-core = { workspace = true }
perl-lsp-critic-parser = { workspace = true }
lsp-types = { workspace = true, optional = true }
serde = { workspace = true }

[dev-dependencies]
perl-tdd-support = { workspace = true }
criterion.workspace = true
serde_json = { workspace = true }

[[bench]]
name = "cache_benchmark"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
