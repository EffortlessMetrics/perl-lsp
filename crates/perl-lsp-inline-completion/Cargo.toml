[package]
name = "perl-lsp-inline-completion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Inline completion provider for Perl LSP"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-lsp-inline-completion"
keywords = ["perl", "lsp", "inline-completion", "ghost-text", "ide"]
categories = ["development-tools", "text-editors"]

[lib]
doctest = false

[dependencies]
lsp-types = "0.97.0"
perl-position-tracking = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
perl-tdd-support = { workspace = true }

[lints]
workspace = true
