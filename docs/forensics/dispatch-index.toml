# Forensics Fragment Index for Agent Dispatch
#
# Maps situation_id to the most-relevant forensics doc paths for that dispatch context.
# Designed for prompt-loadable consumption: an orchestrator (or future dispatch wrapper)
# looks up the situation_id when spawning an agent and includes the listed fragment
# paths in the agent's prompt context.
#
# See `docs/forensics/2026-04-25-forensics-as-prompt-fragments-architecture.md`
# for the architectural rationale and ingestion model.
#
# When adding a new forensics doc:
#   1. Identify which situation_ids it's relevant to (or add a new one)
#   2. Add it under each relevant situation, sorted by specificity then recency
#   3. Cap each situation at 4 fragments — composability constraint
#
# When a fragment is retired or consolidated:
#   1. Remove its entries here
#   2. The recalibrator agent should also flag it during periodic passes

