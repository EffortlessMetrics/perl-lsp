# Codecov Configuration
# See: https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70..100"

  status:
    project:
      default:
        target: 95%           # Final project target, informational during burn-down
        threshold: 2%         # Temporary burn-down window; removed after project reaches target
        if_ci_failed: error   # Fail if CI failed
        informational: true   # Patch coverage enforces first; project is promoted later
    patch:
      default:
        target: 95%           # New code must carry its own proof
        threshold: 0%         # No patch coverage regression allowance
        if_ci_failed: error

# Files/patterns to exclude from coverage analysis
ignore:
  - ".github/**"
  - ".ci/**"
  - "archive/**"
  - "codecov.yml"
  - "docs/**"
  - "crates/tree-sitter-perl-c/**"
  - "crates/*/tests/**"
  - "crates/*/benches/**"
  - "crates/*/examples/**"
  - "crates/*/build.rs"
  - "fuzz/**"
  - "justfile"
  - "xtask/tests/**"
  - "**/*_generated.rs"

# Per-crate coverage flags for detailed tracking
flags:
  parser:
    paths:
      - crates/perl-parser/src/
  xtask:
    paths:
      - xtask/src/
  lsp:
    paths:
      - crates/perl-lsp-rs/src/
  lexer:
    paths:
      - crates/perl-lexer/src/
  dap:
    paths:
      - crates/perl-dap/src/
  corpus:
    paths:
      - crates/perl-corpus/src/

# PR comment configuration
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
