# Codecov Configuration
# See: https://docs.codecov.com/docs/codecov-yaml

codecov:
  # Coverage status must be evaluated from uploaded coverage data, not from
  # unrelated CI/test gate state. Test failures are owned by test-named gates.
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

coverage:
  precision: 2
  round: down
  range: "70..100"

  status:
    project:
      default:
        target: 95%           # Final project target, informational during burn-down
        threshold: 2%         # Temporary burn-down window; removed after project reaches target
        if_ci_failed: ignore  # Keep project telemetry independent from unrelated CI/test failures
        informational: true   # Project telemetry is advisory during burn-down
    patch:
      default:
        target: 95%           # Advisory target for explicit coverage runs
        threshold: 0%         # Preserve the reporting target without gating PRs
        if_ci_failed: ignore  # Patch telemetry stays independent from test failures
        informational: true   # RIPR+ and focused tests are the required PR proof

# Files/patterns to exclude from coverage analysis
ignore:
  - ".github/**"
  - ".ci/**"
  - "archive/**"
  - "codecov.yml"
  - "docs/**"
  - "crates/tree-sitter-perl-c/**"
  - "crates/*/tests/**"
  - "crates/*/benches/**"
  - "crates/*/examples/**"
  - "crates/*/build.rs"
  # perl-dap's bin entry point is a thin CLI wrapper (arg parse -> construct
  # native DapConfig -> run the server). Its logic is not reachable by the
  # `--lib` coverage run that `Codecov / Patch 95` measures, so any edit to it
  # (e.g. removing the legacy `--bridge` flag) would otherwise fail the patch
  # gate on unmeasurable bin lines. CLI behavior is covered by the crate's
  # integration/bin tests instead.
  - "crates/perl-dap/src/main.rs"
  - "fuzz/**"
  - "justfile"
  - "xtask/tests/**"
  - "**/*_generated.rs"

# Per-crate coverage flags for detailed tracking
flags:
  parser:
    paths:
      - crates/perl-parser/src/
  xtask:
    paths:
      - xtask/src/
  lsp:
    paths:
      - crates/perl-lsp-rs/src/
  lexer:
    paths:
      - crates/perl-lexer/src/
  dap:
    paths:
      - crates/perl-dap/src/
  corpus:
    paths:
      - crates/perl-corpus/src/

# PR comment configuration
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
