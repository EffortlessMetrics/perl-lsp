kind: Added
body: >-
  `.perl-lsp.toml` now supports `[perl] use_system_inc = true` to opt into
  interpreter startup `@INC` for module resolution without hardcoding
  perlbrew/plenv/distro module paths. Editor settings still override the
  project layer, and project config still cannot choose the Perl interpreter.
