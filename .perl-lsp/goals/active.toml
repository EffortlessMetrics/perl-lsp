id = "plsp-swarm-real-perl-editor-trust"
title = "perl-lsp-swarm execution lane"
status = "active"
owner = "codex-swarm"
created = "2026-05-20"

proposal = "docs/proposals/PLSP-PROP-0001-real-perl-editor-trust.md"
plan = "plans/real-perl-editor-trust/implementation-plan.md"
status_pointer = "docs/project/status/real_perl_editor_trust_v1.md"
operating_model = "docs/swarm/operating-model.md"

objective = """
Make perl-lsp-swarm the active execution repo for Real Perl Editor Trust work
while keeping perl-lsp as the canonical release, history, and package-lineage
repo until curated sync and release steps promote swarm work back upstream.
"""

end_state = [
  "All new development targets perl-lsp-swarm by default.",
  "perl-lsp receives curated sync and release-lineage PRs only.",
  "Trust, compiler substrate, and reliability work are routed through explicit lanes.",
  "Promotion-ledger work names promotion, fallback, blocker, and receipt boundaries.",
  "Spec hardening and receipts land in swarm before release-lineage sync.",
]

claim_boundaries = [
  "Do not treat perl-lsp-swarm as just another branch farm.",
  "Do not broaden provider behavior from receipt or docs work alone.",
  "Do not promote rename, safe-delete, generated symbols, semantic tokens, or diagnostics without a promotion-ledger row and receipt.",
  "Do not treat generated, dynamic, stale, ambient, unknown, or low-confidence facts as exact source-backed facts.",
  "Do not use perl-lsp for routine feature development once the swarm execution lane is active.",
  "Do not claim release-lineage sync until a separate sync protocol and curated upstream PR exist.",
]

status_docs = [
  "docs/project/status/real_perl_editor_trust_v1.md",
