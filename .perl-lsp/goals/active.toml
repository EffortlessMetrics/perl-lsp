[current]
lane = "real_perl_editor_trust_v1"
repo = "perl-lsp-swarm"
release_lineage_repo = "perl-lsp"
status = "swarm_execution_cutover"

[limits]
trust_prs = 2
substrate_prs = 2
reliability_prs = 4

[[lanes]]
id = "trust"
pr_cap = 2
owns = [
  "provider_promotion_ledger",
  "real_perl_editor_trust_v1_boundary",
  "workspace_symbols",
  "semantic_tokens",
  "rename",
  "safe_delete",
  "diagnostic_explanations",
  "workspace_trust_report",
]
rule = "No broadening; every PR must name promotion, fallback, blocker, and receipt boundaries when it touches trusted provider behavior."

[[lanes]]
id = "substrate"
pr_cap = 2
owns = [
  "lexer_parser_proptest",
  "constant_provider_proof",
  "prototype_table",
  "bareword_classifier",
  "pir_skeleton",
  "determinism_prep",
  "oracle_prep",
]
rule = "No provider cutover unless the trust lane explicitly promotes a fact class."

[[lanes]]
id = "reliability"
pr_cap = 4
owns = [
  "fuzzing",
  "e2e_diagnostics",
  "devex",
  "docs",
  "srp_refactors",
  "coverage",
  "policy_cleanup",
  "published_api_hygiene",
]
rule = "Merge clean leaf work; escalate trust-adjacent surfaces instead of treating them as cleanup."

[trust.next]
items = [
  "semantic_token_class_receipts_as_needed",
  "provider_promotion_ledger_maintenance",
]

[substrate.next]
items = [
  "oracle-fixture-manifest-after-contract",
]

[reliability.next]
items = [
  "cleanup-train-queue-review",
  "policy_cleanup",
  "published_api_hygiene",
  "devex_storage_safe_validation",
]

