# Nextest configuration for LSP test stabilization

[store]
dir = ".tmp/nextest/store"

[profile.default]
retries = 0

[profile.agent]
inherits = "default"
test-threads = 2
fail-fast = true
status-level = "fail"
final-status-level = "fail"

[profile.ci]
retries = 2
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }
leak-timeout = "10s"

[profile.ci.junit]
path = ".tmp/nextest/ci/junit.xml"

[[profile.ci.overrides]]
filter = 'package(perl-lsp-rs)'
slow-timeout = { period = "120s", terminate-after = 3 }
threads-required = 2

[[profile.ci.overrides]]
filter = 'test(lsp_cancel)'
threads-required = 1
retries = 3

[[profile.ci.overrides]]
filter = 'test(lsp_document_symbols) | test(lsp_document_links) | test(lsp_encoding)'
retries = 3

[profile.local-fast]
test-threads = 4
retries = 0
